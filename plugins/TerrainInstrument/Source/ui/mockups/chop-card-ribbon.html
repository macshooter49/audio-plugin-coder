<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CHOP card — Ribbon</title>
<style>
/* ════ CHOP — "RIBBON" · the memory ribbon as a compact FILM STRIP: sprocketed
   slice frames fading into the past, loop bracket, purple play cursor, dashed
   scan handle, LED dots under the frames. Its own button arrangement: the six
   lanes as ONE segmented hairline strip (no other card uses it). Prophet boxes:
   CARVE (steppers + arming toggles) wired to DEPTH (per-lane knobs). ════ */
*{box-sizing:border-box;margin:0;padding:0}
body{width:720px;height:640px;overflow:hidden;background:#16141F;
  font-family:-apple-system,'SF Pro Text','Helvetica Neue',sans-serif;
  -webkit-font-smoothing:antialiased;display:flex;align-items:center;justify-content:center}
.bg{position:absolute;inset:0;background:
  radial-gradient(420px 300px at 62% 30%,rgba(139,92,246,.14),transparent 70%),
  linear-gradient(180deg,#191726 0%,#1A1A2E 60%,#141221 100%)}
.card{position:relative;width:316px;border-radius:14px;
  background:linear-gradient(180deg,rgba(38,34,62,.66),rgba(28,25,50,.78));
  -webkit-backdrop-filter:blur(22px) saturate(1.15);backdrop-filter:blur(22px) saturate(1.15);
  border:1px solid rgba(255,255,255,.14);
  box-shadow:0 24px 60px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.07)}
.h{display:flex;align-items:center;gap:8px;padding:10px 13px 9px;border-bottom:1px solid rgba(255,255,255,.08)}
.h .g{letter-spacing:2px;color:rgba(255,255,255,.30);font-size:10px}
.h .dot{width:5px;height:5px;border-radius:50%;background:#B794FF}
.h .tt{font-size:9px;letter-spacing:1.8px;color:rgba(255,255,255,.92);text-transform:uppercase;font-weight:600}
.h .pop{margin-left:auto;font-size:7px;letter-spacing:1.2px;text-transform:uppercase;color:rgba(255,255,255,.45);font-weight:500}
.h .x{margin-left:10px;color:rgba(255,255,255,.80);font-size:12px}
.b{padding:12px 14px 14px;display:flex;flex-direction:column}

/* ── hero: compact film strip, no headers ── */
.hero{position:relative;height:74px}
.hero svg{position:absolute;inset:0;width:100%;height:100%}

.tabs{display:flex;justify-content:center;gap:26px;margin:10px 0 12px}
.tab{position:relative;font-size:8px;letter-spacing:1.8px;text-transform:uppercase;
  color:rgba(255,255,255,.40);font-weight:500;padding-bottom:5px}
.tab.on{color:rgba(255,255,255,.95)}
.tab.on::after{content:'';position:absolute;left:50%;transform:translateX(-50%);
  bottom:0;width:14px;height:2px;border-radius:1px;background:#B794FF}

/* ── the six lanes as ONE segmented strip (chop's own arrangement) ── */
.lanes{display:grid;grid-template-columns:repeat(6,1fr);
  border:1px solid rgba(255,255,255,.16);border-radius:8px;height:24px;overflow:hidden}
.lane{display:flex;align-items:center;justify-content:center;font-size:7px;
  letter-spacing:.7px;text-transform:uppercase;color:rgba(255,255,255,.42);
  border-left:1px solid rgba(255,255,255,.09)}
.lane:first-child{border-left:none}
.lane.on{color:#fff;background:rgba(183,148,255,.13);box-shadow:inset 0 -2px 0 #B794FF}

/* connector tree: lanes → CARVE + DEPTH */
.tree{height:12px;position:relative}
.tree svg{position:absolute;inset:0;width:100%;height:100%}

/* ── Prophet boxes ── */
.gbox{position:relative;border:1px solid rgba(255,255,255,.15);border-radius:9px}
.gbl{position:absolute;top:-4px;left:50%;transform:translateX(-50%);
  font-size:6px;letter-spacing:1.6px;text-transform:uppercase;line-height:8px;
  color:rgba(255,255,255,.52);background:#232045;padding:0 6px;white-space:nowrap}
.ctlrow{display:grid;grid-template-columns:1fr 1.15fr;gap:8px;align-items:end}
.cell{display:flex;flex-direction:column;align-items:center}
.ctl{display:flex;align-items:flex-end;justify-content:center;width:100%}
.cell .lb{font-size:6.5px;letter-spacing:1.3px;text-transform:uppercase;
  color:rgba(255,255,255,.45);line-height:1;margin-top:6px}
.cell .vl{font-size:9px;color:rgba(255,255,255,.90);font-weight:500;line-height:1;margin-top:4px;min-height:9px}
.gbox.carve{padding:10px 8px 8px}
.carve .togrow{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-bottom:7px}
.tog{height:20px;border:1px solid rgba(255,255,255,.20);border-radius:6px;
  display:flex;align-items:center;justify-content:center;gap:4px;
  font-size:6.5px;letter-spacing:1px;text-transform:uppercase;color:rgba(255,255,255,.72)}
.tog.off{color:rgba(255,255,255,.38)}
.tog i{width:5px;height:5px;border-radius:50%;background:#B794FF}
.carve .cells{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.carve .cells .ctl{height:22px}
.step{width:100%;height:20px;border:1px solid rgba(255,255,255,.18);border-radius:6px;
  display:flex;align-items:center;justify-content:space-between;padding:0 5px;
  font-size:8px;color:rgba(255,255,255,.88)}
.step s{text-decoration:none;color:rgba(255,255,255,.30);font-size:8px}
.gbox.depth{padding:10px 6px 8px}
.depth .in{display:grid;grid-template-columns:repeat(4,1fr)}
.depth .in .ctl{height:49px}
.k svg{width:29px;height:29px;display:block}

/* dots + chain */
.gl{font-size:6.5px;letter-spacing:1.4px;text-transform:uppercase;color:rgba(255,255,255,.32)}
.slotrow{display:flex;align-items:center;justify-content:space-between;padding:0 3px;margin-top:12px}
.sd{display:flex;flex-direction:column;align-items:center;gap:4px;width:20px}
.sd i{width:7px;height:7px;border-radius:50%;border:1px solid rgba(255,255,255,.26)}
.sd.on i{background:rgba(255,255,255,.92);border-color:transparent}
.sd b{font-size:6.5px;font-weight:400;color:rgba(255,255,255,.35)}
.sd.on b{color:rgba(255,255,255,.85)}
.chain{display:flex;align-items:center;gap:7px;margin-top:7px}
.chip{min-width:15px;height:15px;padding:0 4px;border:1px solid rgba(255,255,255,.18);border-radius:4px;
  display:flex;align-items:center;justify-content:center;font-size:7px;color:rgba(255,255,255,.55)}
.chip.cur{border-color:#B794FF;color:#B794FF}
.arr{color:rgba(255,255,255,.25);font-size:8px}
.add{margin-left:auto;color:rgba(255,255,255,.40);font-size:10px}
</style>
</head>
<body>
<div class="bg"></div>
<div class="card">
  <div class="h"><span class="g">⠿</span><span class="dot"></span><span class="tt">Chop</span>
    <span class="pop">Pop Out</span><span class="x">✕</span></div>
  <div class="b">

    <div class="hero"><svg viewBox="0 0 288 74">
      <!-- sprocket dots -->
      <g fill="rgba(255,255,255,.22)">
        <circle cx="16" cy="8" r="1.2"/><circle cx="40" cy="8" r="1.2"/><circle cx="64" cy="8" r="1.2"/>
        <circle cx="88" cy="8" r="1.2"/><circle cx="112" cy="8" r="1.2"/><circle cx="136" cy="8" r="1.2"/>
        <circle cx="160" cy="8" r="1.2"/><circle cx="184" cy="8" r="1.2"/><circle cx="208" cy="8" r="1.2"/>
        <circle cx="232" cy="8" r="1.2"/><circle cx="256" cy="8" r="1.2"/><circle cx="280" cy="8" r="1.2"/>
        <circle cx="16" cy="58" r="1.2"/><circle cx="40" cy="58" r="1.2"/><circle cx="64" cy="58" r="1.2"/>
        <circle cx="88" cy="58" r="1.2"/><circle cx="112" cy="58" r="1.2"/><circle cx="136" cy="58" r="1.2"/>
        <circle cx="160" cy="58" r="1.2"/><circle cx="184" cy="58" r="1.2"/><circle cx="208" cy="58" r="1.2"/>
        <circle cx="232" cy="58" r="1.2"/><circle cx="256" cy="58" r="1.2"/><circle cx="280" cy="58" r="1.2"/>
      </g>
      <!-- strip -->
      <rect x="4" y="13" width="280" height="40" rx="5" fill="none" stroke="rgba(255,255,255,.30)" stroke-width="1"/>
      <!-- frame dividers, fading into the past (left) -->
      <g stroke-width="1">
        <line x1="28" y1="13" x2="28" y2="53" stroke="rgba(255,255,255,.08)"/>
        <line x1="52" y1="13" x2="52" y2="53" stroke="rgba(255,255,255,.10)"/>
        <line x1="76" y1="13" x2="76" y2="53" stroke="rgba(255,255,255,.13)"/>
        <line x1="100" y1="13" x2="100" y2="53" stroke="rgba(255,255,255,.16)"/>
        <line x1="124" y1="13" x2="124" y2="53" stroke="rgba(255,255,255,.19)"/>
        <line x1="148" y1="13" x2="148" y2="53" stroke="rgba(255,255,255,.22)"/>
        <line x1="172" y1="13" x2="172" y2="53" stroke="rgba(255,255,255,.24)"/>
        <line x1="196" y1="13" x2="196" y2="53" stroke="rgba(255,255,255,.26)"/>
        <line x1="220" y1="13" x2="220" y2="53" stroke="rgba(255,255,255,.28)"/>
        <line x1="244" y1="13" x2="244" y2="53" stroke="rgba(255,255,255,.30)"/>
        <line x1="268" y1="13" x2="268" y2="53" stroke="rgba(255,255,255,.30)"/>
      </g>
      <!-- slice content marks: waveform ticks per frame, dimmer leftward -->
      <g stroke="rgba(255,255,255,.35)" stroke-width="1">
        <path d="M10,40 L14,30 L18,44 L22,34"/><path d="M34,42 L38,32 L42,40 L46,36"/>
        <path d="M58,38 L62,28 L66,42 L70,34"/></g>
      <g stroke="rgba(255,255,255,.55)" stroke-width="1">
        <path d="M82,40 L86,26 L90,44 L94,32"/><path d="M106,36 L110,28 L114,42 L118,38"/>
        <path d="M130,42 L134,24 L138,40 L142,34"/></g>
      <g stroke="rgba(255,255,255,.80)" stroke-width="1">
        <path d="M154,38 L158,26 L162,44 L166,30"/><path d="M178,42 L182,28 L186,40 L190,36"/>
        <path d="M202,34 L206,24 L210,44 L214,32"/><path d="M226,40 L230,26 L234,42 L238,34"/>
        <path d="M250,38 L254,28 L258,44 L262,30"/><path d="M274,40 L278,30 L282,42 L286,36"/></g>
      <!-- reversed frame marker -->
      <text x="111" y="21" font-family="'SF Pro Text','Helvetica Neue',sans-serif" font-size="6"
        fill="rgba(255,255,255,.45)" text-anchor="middle">‹‹</text>
      <!-- loop bracket over frames 7-10 -->
      <path d="M148,10 L148,6 L244,6 L244,10" fill="none" stroke="rgba(255,255,255,.40)" stroke-width="1"/>
      <!-- scan handle (dashed) + play cursor (purple) -->
      <line x1="196" y1="13" x2="196" y2="53" stroke="rgba(255,255,255,.45)" stroke-width="1" stroke-dasharray="3 2"/>
      <line x1="232" y1="11" x2="232" y2="55" stroke="#B794FF" stroke-width="1.4"/>
      <!-- LED dots under the frames -->
      <g>
        <circle cx="16" cy="68" r="1.5" fill="rgba(255,255,255,.16)"/><circle cx="40" cy="68" r="1.5" fill="rgba(255,255,255,.16)"/>
        <circle cx="64" cy="68" r="1.5" fill="rgba(255,255,255,.16)"/><circle cx="88" cy="68" r="1.5" fill="rgba(255,255,255,.16)"/>
        <circle cx="112" cy="68" r="1.5" fill="rgba(255,255,255,.16)"/><circle cx="136" cy="68" r="1.5" fill="rgba(255,255,255,.16)"/>
        <circle cx="160" cy="68" r="1.5" fill="rgba(255,255,255,.16)"/><circle cx="184" cy="68" r="1.5" fill="rgba(255,255,255,.16)"/>
        <circle cx="208" cy="68" r="1.5" fill="rgba(255,255,255,.16)"/><circle cx="232" cy="68" r="1.5" fill="#B794FF"/>
        <circle cx="256" cy="68" r="1.5" fill="rgba(255,255,255,.16)"/><circle cx="280" cy="68" r="1.5" fill="rgba(255,255,255,.16)"/>
      </g>
    </svg></div>

    <div class="tabs"><span class="tab on">Slice</span><span class="tab">Scan</span><span class="tab">Shape</span></div>

    <div class="lanes">
      <span class="lane on">Order</span><span class="lane">Pitch</span><span class="lane">Rev</span>
      <span class="lane">Trim</span><span class="lane">Rpt</span><span class="lane">Drop</span>
    </div>

    <div class="tree"><svg viewBox="0 0 288 12" preserveAspectRatio="none">
      <path d="M144,0 L144,5 M66,5 L212,5 M66,5 L66,12 M212,5 L212,12"
        fill="none" stroke="rgba(255,255,255,.18)" stroke-width="1"/></svg></div>

    <div class="ctlrow">
      <div class="gbox carve"><span class="gbl">Carve</span>
        <div class="togrow"><div class="tog"><i></i>Always</div><div class="tog off">Catch</div></div>
        <div class="cells">
          <div class="cell">
            <div class="ctl"><div class="step"><s>‹</s>8<s>›</s></div></div>
            <span class="lb">Slices</span><span class="vl"></span>
          </div>
          <div class="cell">
            <div class="ctl"><div class="step"><s>‹</s>8<s>›</s></div></div>
            <span class="lb">Loop</span><span class="vl"></span>
          </div>
          <div class="cell">
            <div class="ctl"><div class="step"><s>‹</s>Step<s>›</s></div></div>
            <span class="lb">Mode</span><span class="vl"></span>
          </div>
        </div>
      </div>
      <div class="gbox depth"><span class="gbl">Order · Depth</span>
        <div class="in">
          <div class="cell k">
            <div class="ctl"><svg viewBox="0 0 36 36">
                <circle cx="18" cy="18" r="14" fill="none" stroke="rgba(255,255,255,.13)" stroke-width="2"/>
                <circle cx="18" cy="18" r="14" fill="none" stroke="rgba(255,255,255,.92)" stroke-width="2"
                  stroke-linecap="round" stroke-dasharray="44 88" transform="rotate(128 18 18)"/></svg></div>
            <span class="lb">Spread</span><span class="vl">50</span>
          </div>
          <div class="cell k">
            <div class="ctl"><svg viewBox="0 0 36 36">
                <circle cx="18" cy="18" r="14" fill="none" stroke="rgba(255,255,255,.13)" stroke-width="2"/>
                <circle cx="18" cy="18" r="14" fill="none" stroke="rgba(255,255,255,.92)" stroke-width="2"
                  stroke-linecap="round" stroke-dasharray="2 130" transform="rotate(128 18 18)"/></svg></div>
            <span class="lb">Bias</span><span class="vl">0</span>
          </div>
          <div class="cell k">
            <div class="ctl"><svg viewBox="0 0 36 36">
                <circle cx="18" cy="18" r="14" fill="none" stroke="rgba(255,255,255,.13)" stroke-width="2"/>
                <circle cx="18" cy="18" r="14" fill="none" stroke="rgba(255,255,255,.92)" stroke-width="2"
                  stroke-linecap="round" stroke-dasharray="18 114" transform="rotate(128 18 18)"/></svg></div>
            <span class="lb">Lock</span><span class="vl">20</span>
          </div>
          <div class="cell k">
            <div class="ctl"><svg viewBox="0 0 36 36">
                <circle cx="18" cy="18" r="14" fill="none" stroke="rgba(255,255,255,.13)" stroke-width="2"/>
                <circle cx="18" cy="18" r="14" fill="none" stroke="rgba(255,255,255,.92)" stroke-width="2"
                  stroke-linecap="round" stroke-dasharray="10 122" transform="rotate(128 18 18)"/></svg></div>
            <span class="lb">Seed</span><span class="vl">7</span>
          </div>
        </div>
      </div>
    </div>

    <div class="slotrow">
      <span class="sd on"><i></i><b>1</b></span><span class="sd"><i></i><b>2</b></span>
      <span class="sd"><i></i><b>3</b></span><span class="sd"><i></i><b>4</b></span>
      <span class="sd"><i></i><b>5</b></span><span class="sd"><i></i><b>6</b></span>
      <span class="sd"><i></i><b>7</b></span><span class="sd"><i></i><b>8</b></span>
      <span class="sd"><i></i><b>9</b></span><span class="sd"><i></i><b>10</b></span>
      <span class="sd"><i></i><b>11</b></span><span class="sd"><i></i><b>12</b></span></div>
    <div class="chain"><span class="gl" style="margin-right:2px">Chain</span>
      <span class="chip cur">1</span><span class="arr">›</span><span class="chip">1</span>
      <span class="arr">›</span><span class="chip">2</span><span class="arr">›</span><span class="chip">3</span>
      <span class="add">+</span></div>
  </div>
</div>
</body>
</html>
