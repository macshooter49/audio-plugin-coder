<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CHOP card — Ribbon v2 · minimal</title>
<style>
/* ════ CHOP v2 — MINIMAL. Its own silhouette: controls first, the memory ribbon
   lives BELOW the boxes as a quiet strip (8 cells, loop tint, scan dash, purple
   cursor, LED row — nothing else). DEPTH = vertical sliders (the variation).
   No connector tree — the boxes stand alone. Every box packed, no dead rails. ════ */
*{box-sizing:border-box;margin:0;padding:0}
body{width:720px;height:640px;overflow:hidden;background:#16141F;
  font-family:-apple-system,'SF Pro Text','Helvetica Neue',sans-serif;
  -webkit-font-smoothing:antialiased;display:flex;align-items:center;justify-content:center}
.bg{position:absolute;inset:0;background:
  radial-gradient(420px 300px at 62% 30%,rgba(139,92,246,.14),transparent 70%),
  linear-gradient(180deg,#191726 0%,#1A1A2E 60%,#141221 100%)}
.card{position:relative;width:316px;border-radius:14px;
  background:linear-gradient(180deg,rgba(38,34,62,.66),rgba(28,25,50,.78));
  -webkit-backdrop-filter:blur(22px) saturate(1.15);backdrop-filter:blur(22px) saturate(1.15);
  border:1px solid rgba(255,255,255,.14);
  box-shadow:0 24px 60px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.07)}
.h{display:flex;align-items:center;gap:8px;padding:10px 13px 9px;border-bottom:1px solid rgba(255,255,255,.08)}
.h .g{letter-spacing:2px;color:rgba(255,255,255,.30);font-size:10px}
.h .dot{width:5px;height:5px;border-radius:50%;background:#B794FF}
.h .tt{font-size:9px;letter-spacing:1.8px;color:rgba(255,255,255,.92);text-transform:uppercase;font-weight:600}
.mix{margin-left:auto;display:flex;align-items:baseline;gap:4px;
  font-size:6.5px;letter-spacing:1.2px;text-transform:uppercase;color:rgba(255,255,255,.40)}
.mix b{font-size:11px;font-weight:200;letter-spacing:.3px;color:rgba(255,255,255,.92);font-family:-apple-system,'SF Pro Display',sans-serif}
.h .pop{margin-left:12px;font-size:7px;letter-spacing:1.2px;text-transform:uppercase;color:rgba(255,255,255,.45);font-weight:500}
.h .x{margin-left:10px;color:rgba(255,255,255,.80);font-size:12px}
.b{padding:12px 14px 14px;display:flex;flex-direction:column}

.tabs{display:flex;justify-content:center;gap:26px;margin:0 0 12px}
.tab{position:relative;font-size:8px;letter-spacing:1.8px;text-transform:uppercase;
  color:rgba(255,255,255,.40);font-weight:500;padding-bottom:5px}
.tab.on{color:rgba(255,255,255,.95)}
.tab.on::after{content:'';position:absolute;left:50%;transform:translateX(-50%);
  bottom:0;width:14px;height:2px;border-radius:1px;background:#B794FF}

/* six lanes, one segmented strip */
.lanes{display:grid;grid-template-columns:repeat(6,1fr);
  border:1px solid rgba(255,255,255,.16);border-radius:8px;height:24px;overflow:hidden;margin-bottom:14px}
.lane{display:flex;align-items:center;justify-content:center;font-size:7px;
  letter-spacing:.7px;text-transform:uppercase;color:rgba(255,255,255,.42);
  border-left:1px solid rgba(255,255,255,.09)}
.lane:first-child{border-left:none}
.lane.on{color:#fff;background:rgba(183,148,255,.13);box-shadow:inset 0 -2px 0 #B794FF}

/* boxes: packed, symmetric, standalone */
.gbox{position:relative;border:1px solid rgba(255,255,255,.15);border-radius:9px}
.gbl{position:absolute;top:-4px;left:50%;transform:translateX(-50%);
  font-size:6px;letter-spacing:1.6px;text-transform:uppercase;line-height:8px;
  color:rgba(255,255,255,.52);background:#232045;padding:0 6px;white-space:nowrap}
.ctlrow{display:grid;grid-template-columns:1fr 1.12fr;gap:8px}
.gbox.carve{padding:14px 9px 8px;display:flex;flex-direction:column;justify-content:flex-end}
.togrow{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.tog{height:20px;border:1px solid rgba(255,255,255,.20);border-radius:6px;
  display:flex;align-items:center;justify-content:center;gap:4px;
  font-size:6.5px;letter-spacing:1px;text-transform:uppercase;color:rgba(255,255,255,.72)}
.tog.off{color:rgba(255,255,255,.38)}
.tog i{width:5px;height:5px;border-radius:50%;background:#B794FF}
.carve .cells{display:grid;grid-template-columns:1fr 1fr 1.25fr;gap:4px;margin-top:8px}
.carve .cell{display:flex;flex-direction:column;align-items:center;gap:6px}
.step{width:100%;height:20px;border:1px solid rgba(255,255,255,.18);border-radius:6px;
  display:flex;align-items:center;justify-content:space-between;padding:0 4px;
  font-size:7.5px;letter-spacing:.2px;color:rgba(255,255,255,.88);white-space:nowrap}
.step s{text-decoration:none;color:rgba(255,255,255,.30);font-size:8px}
.lb{font-size:6.5px;letter-spacing:1.3px;text-transform:uppercase;
  color:rgba(255,255,255,.45);line-height:1}
.vl{font-size:9px;color:rgba(255,255,255,.90);font-weight:500;line-height:1}
.gbox.depth{padding:14px 8px 8px}
.depth .in{display:grid;grid-template-columns:repeat(4,1fr);height:100%}
.depth .cell{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px}
.vs{width:3px;height:30px;background:rgba(255,255,255,.13);border-radius:2px;position:relative}
.vs i{position:absolute;left:0;right:0;bottom:0;background:#B794FF;border-radius:2px}
.vs b{position:absolute;left:50%;width:7px;height:7px;border-radius:50%;
  background:#fff;transform:translateX(-50%)}

/* the memory ribbon — quiet strip below the boxes */
.ribbon{position:relative;height:52px;margin-top:14px}
.ribbon svg{position:absolute;inset:0;width:100%;height:100%}

/* dots + chain */
.gl{font-size:6.5px;letter-spacing:1.4px;text-transform:uppercase;color:rgba(255,255,255,.32)}
.slotrow{display:flex;align-items:center;justify-content:space-between;padding:0 3px;margin-top:10px}
.sd{display:flex;flex-direction:column;align-items:center;gap:4px;width:20px}
.sd i{width:7px;height:7px;border-radius:50%;border:1px solid rgba(255,255,255,.26)}
.sd.on i{background:rgba(255,255,255,.92);border-color:transparent}
.sd b{font-size:6.5px;font-weight:400;color:rgba(255,255,255,.35)}
.sd.on b{color:rgba(255,255,255,.85)}
.chain{display:flex;align-items:center;gap:7px;margin-top:7px}
.chip{min-width:15px;height:15px;padding:0 4px;border:1px solid rgba(255,255,255,.18);border-radius:4px;
  display:flex;align-items:center;justify-content:center;font-size:7px;color:rgba(255,255,255,.55)}
.chip.cur{border-color:#B794FF;color:#B794FF}
.arr{color:rgba(255,255,255,.25);font-size:8px}
.add{margin-left:auto;color:rgba(255,255,255,.40);font-size:10px}
</style>
</head>
<body>
<div class="bg"></div>
<div class="card">
  <div class="h"><span class="g">⠿</span><span class="dot"></span><span class="tt">Chop</span>
    <span class="mix">Mix <b>60%</b></span><span class="pop">Pop Out</span><span class="x">✕</span></div>
  <div class="b">

    <div class="tabs"><span class="tab on">Slice</span><span class="tab">Scan</span><span class="tab">Shape</span></div>

    <div class="lanes">
      <span class="lane on">Order</span><span class="lane">Pitch</span><span class="lane">Rev</span>
      <span class="lane">Trim</span><span class="lane">Rpt</span><span class="lane">Drop</span>
    </div>

    <div class="ctlrow">
      <div class="gbox carve"><span class="gbl">Carve</span>
        <div class="togrow"><div class="tog"><i></i>Always</div><div class="tog off">Catch</div></div>
        <div class="cells">
          <div class="cell"><div class="step"><s>‹</s>8<s>›</s></div><span class="lb">Slices</span></div>
          <div class="cell"><div class="step"><s>‹</s>8<s>›</s></div><span class="lb">Loop</span></div>
          <div class="cell"><div class="step"><s>‹</s>Step<s>›</s></div><span class="lb">Mode</span></div>
        </div>
      </div>
      <div class="gbox depth"><span class="gbl">Order · Depth</span>
        <div class="in">
          <div class="cell">
            <div class="vs"><i style="height:50%"></i><b style="bottom:calc(50% - 3.5px)"></b></div>
            <span class="lb">Spread</span><span class="vl">50</span>
          </div>
          <div class="cell">
            <div class="vs"><i style="height:4%"></i><b style="bottom:calc(4% - 3.5px)"></b></div>
            <span class="lb">Bias</span><span class="vl">0</span>
          </div>
          <div class="cell">
            <div class="vs"><i style="height:20%"></i><b style="bottom:calc(20% - 3.5px)"></b></div>
            <span class="lb">Lock</span><span class="vl">20</span>
          </div>
          <div class="cell">
            <div class="vs"><i style="height:58%"></i><b style="bottom:calc(58% - 3.5px)"></b></div>
            <span class="lb">Seed</span><span class="vl">7</span>
          </div>
        </div>
      </div>
    </div>

    <div class="ribbon"><svg viewBox="0 0 288 52">
      <!-- the MEMORY: rolling capture buffer, dim = the past -->
      <rect x="4" y="6" width="280" height="30" rx="5" fill="none" stroke="rgba(255,255,255,.28)" stroke-width="1"/>
      <path d="M6,21 L15,15 L24,26 L33,18 L42,25 L51,14 L60,26 L69,20 L78,24 L87,16 L96,27 L105,19 L114,23 L123,15 L132,25 L141,20 L144,21"
        fill="none" stroke="rgba(255,255,255,.28)" stroke-width="1"/>
      <path d="M249,22 L258,17 L267,25 L276,19 L282,22"
        fill="none" stroke="rgba(255,255,255,.28)" stroke-width="1"/>
      <!-- the LOOP WINDOW: the region being performed, sliced -->
      <rect x="144" y="6.5" width="105" height="29" fill="rgba(255,255,255,.055)"/>
      <path d="M144,21 L153,14 L162,27 L171,17 L180,24 L189,13 L198,26 L207,19 L216,25 L225,15 L234,27 L243,18 L249,22"
        fill="none" stroke="rgba(255,255,255,.85)" stroke-width="1"/>
      <g stroke="rgba(255,255,255,.16)" stroke-width="1">
        <line x1="157" y1="6" x2="157" y2="36"/><line x1="170" y1="6" x2="170" y2="36"/>
        <line x1="183" y1="6" x2="183" y2="36"/><line x1="197" y1="6" x2="197" y2="36"/>
        <line x1="210" y1="6" x2="210" y2="36"/><line x1="223" y1="6" x2="223" y2="36"/>
        <line x1="236" y1="6" x2="236" y2="36"/></g>
      <!-- window edges: drag nubs + scan handle (dashed) -->
      <rect x="141" y="2" width="6" height="3" rx="1" fill="rgba(255,255,255,.40)"/>
      <rect x="246" y="2" width="6" height="3" rx="1" fill="rgba(255,255,255,.40)"/>
      <line x1="144" y1="6" x2="144" y2="36" stroke="rgba(255,255,255,.45)" stroke-width="1" stroke-dasharray="3 2"/>
      <line x1="249" y1="6" x2="249" y2="36" stroke="rgba(255,255,255,.30)" stroke-width="1"/>
      <!-- playhead: current slice -->
      <line x1="199" y1="4" x2="199" y2="38" stroke="#B794FF" stroke-width="1.4"/>
      <!-- slice LEDs: one per window slice, current lit -->
      <g>
        <circle cx="151" cy="45" r="1.5" fill="rgba(255,255,255,.18)"/><circle cx="164" cy="45" r="1.5" fill="rgba(255,255,255,.18)"/>
        <circle cx="177" cy="45" r="1.5" fill="rgba(255,255,255,.18)"/><circle cx="190" cy="45" r="1.5" fill="rgba(255,255,255,.18)"/>
        <circle cx="203" cy="45" r="1.5" fill="#B794FF"/><circle cx="216" cy="45" r="1.5" fill="rgba(255,255,255,.18)"/>
        <circle cx="229" cy="45" r="1.5" fill="rgba(255,255,255,.18)"/><circle cx="242" cy="45" r="1.5" fill="rgba(255,255,255,.18)"/>
      </g>
    </svg></div>

    <div class="slotrow">
      <span class="sd on"><i></i><b>1</b></span><span class="sd"><i></i><b>2</b></span>
      <span class="sd"><i></i><b>3</b></span><span class="sd"><i></i><b>4</b></span>
      <span class="sd"><i></i><b>5</b></span><span class="sd"><i></i><b>6</b></span>
      <span class="sd"><i></i><b>7</b></span><span class="sd"><i></i><b>8</b></span>
      <span class="sd"><i></i><b>9</b></span><span class="sd"><i></i><b>10</b></span>
      <span class="sd"><i></i><b>11</b></span><span class="sd"><i></i><b>12</b></span></div>
    <div class="chain"><span class="gl" style="margin-right:2px">Chain</span>
      <span class="chip cur">1</span><span class="arr">›</span><span class="chip">1</span>
      <span class="arr">›</span><span class="chip">2</span><span class="arr">›</span><span class="chip">3</span>
      <span class="add">+</span></div>
  </div>
</div>
</body>
</html>
