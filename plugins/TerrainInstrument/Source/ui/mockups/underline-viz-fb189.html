<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Terrain — the living underline (F1 / F2 / F3)</title>
<style>
  /* Terrain locked system: dark panel, white ink, #B794FF only, SF Pro, hairlines. */
  html,body { margin:0; padding:0; background:#131320; }
  body { font-family:-apple-system,"SF Pro Text","Helvetica Neue",sans-serif; color:#fff;
         display:flex; flex-direction:column; align-items:center; padding:34px 0 60px; }
  h1 { font-size:15px; font-weight:400; letter-spacing:.4px; color:rgba(255,255,255,.85); margin:0 0 4px; }
  .sub { font-size:11px; font-weight:300; color:rgba(255,255,255,.42); margin:0 0 30px; letter-spacing:.3px; }
  .variant { background:#1A1A2E; border:1px solid rgba(255,255,255,.08); border-radius:10px;
             padding:20px 26px 24px; margin-bottom:26px; width:640px; }
  .vhead { display:flex; align-items:baseline; gap:10px; margin-bottom:2px; }
  .vtag { font-size:10px; letter-spacing:1.6px; color:#B794FF; font-weight:600; }
  .vname { font-size:13px; font-weight:400; color:rgba(255,255,255,.9); }
  .vdesc { font-size:10.5px; font-weight:300; color:rgba(255,255,255,.45); margin:0 0 18px; line-height:1.5; }
  .row { display:flex; justify-content:space-between; }
  .cell { display:flex; flex-direction:column; align-items:center; width:130px; }
  .cap { font-size:9px; font-weight:300; color:rgba(255,255,255,.34); margin-top:9px;
         letter-spacing:.3px; text-align:center; line-height:1.5; }
  .knob { position:relative; width:44px; height:44px; margin-bottom:8px; }
  .knob svg { position:absolute; inset:0; }
  .klabel { font-size:11px; font-weight:300; letter-spacing:.4px; color:rgba(255,255,255,.78);
            padding-bottom:5px; position:relative; }
  /* the underline stage: exactly the word's ink width, 1.5px rail */
  .ul { position:relative; height:1.5px; margin-top:1px; }
  .ul .rail { position:absolute; inset:0; background:rgba(255,255,255,.13); }          /* full range 0..1 */
  .ul .span { position:absolute; top:0; height:100%; background:rgba(183,148,255,.38); } /* the depth's territory */
  .ul .fill { position:absolute; top:0; height:100%; background:#B794FF; }               /* F2: anchor→now */
  .ul .tick { position:absolute; top:-1.25px; width:4px; height:4px; border-radius:50%;
              background:#fff; box-shadow:0 0 5px rgba(231,222,255,.95); transform:translateX(-2px); }
  .ul .comet { position:absolute; top:0; height:100%;
               background:linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,.92) 100%); }
  .ul .comet.rev { background:linear-gradient(270deg, rgba(255,255,255,0) 0%, rgba(255,255,255,.92) 100%); }
</style>
</head>
<body>
<h1>The living underline</h1>
<p class="sub">Serum's ring science, spoken in Terrain's grammar — span = attenuation's territory, anchored where the knob lives. A note plays every 1.6&nbsp;s.</p>
<div id="stage"></div>
<script>
// ── the shared science (the shipped ownership law) ─────────────────────────
// eff(t) = (1−d)·knob + d·env(t) · the span covers [ (1−d)·knob , (1−d)·knob + d ]
// fast attack = snap · slow attack = glide in · LFO = continuous ride.

var CASES = [
  { label:'Warp',     knob:0.0,  d:1.0, kind:'pluck', cap:'knob 0% · depth 100%<br>pluck — full-word sweep' },
  { label:'Spectral', knob:1.0,  d:1.0, kind:'swell', cap:'knob 100% · depth 100%<br>slow swell up to the knob' },
  { label:'Fold',     knob:0.7,  d:0.5, kind:'pluck', cap:'knob 70% · depth 50%<br>span sits where the knob says' },
  { label:'Level',    knob:0.5,  d:0.6, kind:'lfo',   cap:'knob 50% · depth 60%<br>LFO rides the territory' },
];
var VARIANTS = [
  { tag:'F1', name:'The playhead', desc:'The territory reads as a quiet purple stretch; a single white point rides the live value. Stillness until you play — then the dot snaps or glides exactly like your shape. The most Terrain answer: one moving light, nothing else.',
    render:function(els,geo){ els.tick.style.display='block'; els.tick.style.left=(geo.eff*100)+'%'; } },
  { tag:'F2', name:'The fill', desc:'The underline pours from the anchor to the live value — the grain-engine attenuation-line grammar. You read depth as territory and the note as liquid filling it, draining as the envelope falls.',
    render:function(els,geo){ els.fill.style.display='block';
      var a=Math.min(geo.anchor,geo.eff), b=Math.max(geo.anchor,geo.eff);
      els.fill.style.left=(a*100)+'%'; els.fill.style.width=((b-a)*100)+'%';
      els.tick.style.display='block'; els.tick.style.left=(geo.eff*100)+'%'; } },
  { tag:'F3', name:'The comet', desc:'A white glow sweeps the territory with a fading tail — the portal. Fast attacks streak, slow attacks pour, LFOs breathe back and forth. The most alive, and the loudest.',
    render:function(els,geo){ els.comet.style.display='block';
      var a=Math.min(geo.anchor,geo.eff), b=Math.max(geo.anchor,geo.eff);
      var tail=Math.min(0.32,(b-a)); var lead=geo.eff, back=(geo.eff>=geo.anchor)?Math.max(a,lead-tail):lead, w;
      if(geo.eff>=geo.anchor){ els.comet.classList.remove('rev'); w=lead-back; els.comet.style.left=(back*100)+'%'; }
      else { els.comet.classList.add('rev'); w=Math.min(tail,geo.anchor-lead); els.comet.style.left=(lead*100)+'%'; }
      els.comet.style.width=(Math.max(0.008,w)*100)+'%'; } },
];

function knobSvg(v){ var a0=-135,a1=a0+270*v, r=17,cx=22,cy=22;
  function pt(deg){ var rad=(deg-90)*Math.PI/180; return (cx+r*Math.cos(rad)).toFixed(1)+' '+(cy+r*Math.sin(rad)).toFixed(1); }
  var large=(a1-a0)>180?1:0;
  return '<svg viewBox="0 0 44 44">'
   + '<path d="M '+pt(a0)+' A '+r+' '+r+' 0 1 1 '+pt(135)+'" stroke="rgba(255,255,255,.14)" stroke-width="2" fill="none" stroke-linecap="round"/>'
   + '<path d="M '+pt(a0)+' A '+r+' '+r+' 0 '+large+' 1 '+pt(a1)+'" stroke="rgba(255,255,255,.75)" stroke-width="2" fill="none" stroke-linecap="round"/>'
   + '<circle cx="22" cy="22" r="10.5" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="1"/></svg>'; }

var stage=document.getElementById('stage'), cells=[];
VARIANTS.forEach(function(V){
  var box=document.createElement('div'); box.className='variant';
  box.innerHTML='<div class="vhead"><span class="vtag">'+V.tag+'</span><span class="vname">'+V.name+'</span></div>'
              + '<p class="vdesc">'+V.desc+'</p>';
  var row=document.createElement('div'); row.className='row'; box.appendChild(row);
  CASES.forEach(function(C){
    var cell=document.createElement('div'); cell.className='cell';
    cell.innerHTML='<div class="knob">'+knobSvg(C.knob)+'</div>'
      + '<div class="klabel">'+C.label+'<div class="ul"><div class="rail"></div><div class="span"></div>'
      + '<div class="fill" style="display:none"></div><div class="comet" style="display:none"></div>'
      + '<div class="tick" style="display:none"></div></div></div>'
      + '<div class="cap">'+C.cap+'</div>';
    row.appendChild(cell);
    var ul=cell.querySelector('.ul');
    cells.push({ V:V, C:C, els:{ span:ul.querySelector('.span'), fill:ul.querySelector('.fill'),
                                 comet:ul.querySelector('.comet'), tick:ul.querySelector('.tick') } });
  });
  stage.appendChild(box);
});

// simulated performance: a note every 1.6 s (0.9 s held), envelopes per case kind
function envOf(kind,t){ var T=t%1.6, on=T<0.9;
  if(kind==='lfo') return 0.5+0.5*Math.sin(t*2*Math.PI*1.6);
  if(kind==='pluck'){ if(!on) return 0; return Math.max(0, Math.exp(-(T-0.004)/0.16)) * Math.min(1,T/0.004); }
  /* swell: slow attack 450ms, release 300ms */
  if(on) return Math.min(1,T/0.45);
  var rel=Math.min(1,0.9/0.45); return Math.max(0, rel*(1-(T-0.9)/0.3)); }

function frame(ts){ var t=ts/1000;
  cells.forEach(function(c){
    var d=c.C.d, k=c.C.knob, e=envOf(c.C.kind,t);
    var anchor=(1-d)*k, eff=anchor+d*e;
    c.els.span.style.left=(anchor*100)+'%'; c.els.span.style.width=(d*100)+'%';
    c.V.render(c.els,{anchor:anchor,eff:eff,d:d,knob:k});
  });
  requestAnimationFrame(frame); }
requestAnimationFrame(frame);
</script>
</body>
</html>
