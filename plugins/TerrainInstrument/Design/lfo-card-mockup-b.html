<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;padding:0;background:#141225;font-family:-apple-system,"SF Pro Text","Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased;}
.desk{width:760px;height:620px;display:flex;align-items:flex-start;padding:22px;}
.card{width:378px;background:linear-gradient(180deg,#26223E,#1C1932);border:1px solid rgba(255,255,255,0.10);border-radius:10px;box-shadow:0 14px 44px rgba(0,0,0,.5);overflow:hidden;color:#ECE8F2;}
.h{position:relative;display:flex;align-items:center;gap:9px;padding:9px 12px;background:rgba(255,255,255,0.03);border-bottom:1px solid rgba(255,255,255,0.07);font-size:10px;}
.h .grip{color:rgba(255,255,255,.25);letter-spacing:1px;font-size:9px;}
.h .dot{width:5px;height:5px;border-radius:50%;background:#8B5CF6;box-shadow:0 0 6px rgba(139,92,246,.8);}
.h .nm{font-weight:600;letter-spacing:2.2px;font-size:11px;}
.h .nm i{font-style:normal;color:rgba(255,255,255,.4);font-size:8px;margin-left:3px;}
.h .pset{position:absolute;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;color:rgba(255,255,255,.75);}
.h .pa{color:rgba(255,255,255,.4);font-size:11px;}
.h .pn{font-size:10px;letter-spacing:.5px;}
.h .sp{flex:1;}
.h .mx{color:rgba(255,255,255,.45);letter-spacing:1.6px;font-size:8.5px;}
.h .mx b{color:#fff;font-weight:400;font-size:10px;letter-spacing:0;}
.h .dk{color:rgba(255,255,255,.45);letter-spacing:1.6px;font-size:8.5px;}
.h .x{color:rgba(255,255,255,.6);font-size:12px;}
.hero{margin:12px 12px 10px;background:rgba(10,9,20,.55);border:1px solid rgba(255,255,255,0.07);border-radius:8px;position:relative;height:132px;}
.hero svg{display:block;width:100%;height:100%;}
.bzone{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;padding:2px 14px 0;}
.bzone+.bzone{padding-top:7px;}
.bp{text-align:center;font-size:8px;letter-spacing:1.4px;color:rgba(255,255,255,.65);border:1px solid rgba(255,255,255,.14);border-radius:6px;padding:8px 0;position:relative;}
.bp.on{color:#0F0D1E;background:#ECE8F2;font-weight:600;border-color:transparent;}

.krow{display:flex;justify-content:space-between;padding:16px 14px 4px;}
.kn{text-align:center;}
.kn svg{display:block;margin:0 auto;}
.kl{font-size:8px;letter-spacing:1.6px;color:rgba(255,255,255,.45);margin-top:5px;}
.kv{font-size:10px;color:#fff;margin-top:2px;}
.lfodots{display:flex;justify-content:space-between;padding:12px 14px 2px;}
.ld{text-align:center;}
.ld .c{width:8px;height:8px;border-radius:50%;border:1px solid rgba(255,255,255,.35);margin:0 auto;}
.ld.on .c{background:#ECE8F2;border-color:#ECE8F2;box-shadow:0 0 7px rgba(236,232,242,.6);}
.ld .n{font-size:7px;color:rgba(255,255,255,.35);margin-top:4px;}
.chain{display:flex;align-items:center;gap:8px;padding:6px 14px 12px;font-size:8px;letter-spacing:1.8px;color:rgba(255,255,255,.4);}
.chain .slot{width:16px;height:16px;border:1px solid rgba(255,255,255,.3);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:8px;color:#ECE8F2;letter-spacing:0;}
.chain .plus{margin-left:auto;color:rgba(255,255,255,.4);font-size:11px;letter-spacing:0;}
</style></head><body><div class="desk">
