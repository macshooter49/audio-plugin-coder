<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Equalizer — mockup</title>
<style>
:root,#syn-panel{
  color:var(--text-primary);
  --bg-main:       #1A1A2E;
  --bg-hero:       #12121F;
  --bg-surface:    #232340;
  --bg-card:       #2A2A48;
  --bg-card-2:     #252340;
  --knob-track:    rgba(120,118,160,0.35);
  --purple-600:    #9B6DFF;
  --purple-500:    #8B5CF6;
  --purple-400:    #B794FF;
  --border:        rgba(58,58,88,0.55);
  --border-strong: rgba(140,130,180,0.45);
  --text-primary:  #ECE8F2;
  --text-secondary: #C5BFD2;
  --text-muted:    #908599;
  --text-dim:      #6E6580;
  --line-bright:   #ECE8F2;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:radial-gradient(900px 520px at 30% -10%,#241d3a 0,transparent 60%),#141220;
  color:var(--text-primary);font-family:-apple-system,'SF Pro Text',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;display:flex;flex-direction:column;align-items:center;
  gap:14px;padding:26px 18px 40px}
h1{font:600 15px/1.2 -apple-system,system-ui;letter-spacing:.02em;margin:0;color:#e8e4f5}
.sub{font:400 11.5px/1.5 -apple-system,system-ui;color:#9a92b8;max-width:660px;text-align:center;margin:0}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
button{background:#241f38;color:#e8e4f5;border:1px solid #3a3356;border-radius:7px;
  padding:7px 13px;font:500 11.5px -apple-system,system-ui;cursor:pointer}
button:hover{background:#2e2846}
#status{font:400 11px -apple-system,system-ui;color:#8f88ab;min-height:15px}
#err{font:400 11px/1.45 ui-monospace,Menlo,monospace;color:#ff9a9a;white-space:pre-wrap;max-width:680px}
/* THE REAL CARD IS 272 x 170. Lifting the CSS is not enough: `.fxr-dev` is
   `flex:0 0 272px; height:100%`, so with no sized parent the core collapses to nothing and the
   knob row stretches — which is exactly what the first render showed. These two rules are the
   fx3 mockup's own `.rackwrap`/`.rackstrip`, reused. */
#wrap{display:flex;flex-direction:column;align-items:center;gap:16px}
#rack{display:flex;gap:9px;height:170px;width:272px}
#backpanel{width:272px}
@keyframes mvBreathe{0%,100%{opacity:.9}50%{opacity:1}}
#syn-panel .fxr-switch{ position:absolute; top:-18px; left:0; z-index:3; display:flex; align-items:center; gap:0; }
#syn-panel .fxr-seg{ display:flex; border:1px solid var(--border-strong); border-radius:7px; overflow:hidden; }
#syn-panel .fxr-tab{ background:transparent; border:0; color:var(--text-muted); font-family:inherit; font-size:9px; letter-spacing:.03em; padding:2px 8px; cursor:pointer; display:flex; align-items:center; gap:5px; font-weight:400; line-height:1; }
#syn-panel .fxr-tab .fxr-k{ font-weight:700; }
#syn-panel .fxr-tab + .fxr-tab{ border-left:1px solid var(--border-strong); }
#syn-panel .fxr-tab.on{ color:var(--purple-400); }
#syn-panel .fxr-tabhint{ margin-left:auto; font-size:9px; color:var(--text-dim); letter-spacing:1px; font-weight:300; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#syn-panel .fxr-pane{ flex:1; min-width:0; min-height:0; display:flex; }
#syn-panel .fxr-macros-pane{ flex-direction:column; justify-content:center; }
#syn-panel .fxr-clip{ flex:1; min-width:0; overflow-x:auto; overflow-y:hidden; display:flex; scrollbar-width:none; }
#syn-panel .fxr-clip::-webkit-scrollbar{ display:none; }
#syn-panel .fxr-rack{ display:flex; gap:9px; align-items:stretch; padding:0; min-height:0; }
#syn-panel .fxr-dev{ flex:0 0 272px; height:100%; min-height:0; background:transparent; border:1px solid var(--border-strong); border-radius:8px; display:flex; flex-direction:column; transition:border-color .15s, opacity .15s; position:relative; }
#syn-panel .fxr-dev:hover{ border-color:rgba(255,255,255,.34); }
#syn-panel .fxr-dev.fxr-off{ opacity:.45; }
#syn-panel .fxr-dev.fxr-off *{ animation-play-state:paused !important; }
#syn-panel .fxr-head{ display:flex; align-items:center; gap:6px; padding:5px 8px 4px; height:26px; }
#syn-panel .fxr-grip{ color:var(--text-dim); font-size:11px; line-height:1; letter-spacing:-2px; cursor:grab; user-select:none; display:flex; align-items:center; }
#syn-panel .fxr-grip:active{ cursor:grabbing; }
#syn-panel .fxr-name{ font-size:11.5px; color:var(--text-primary); font-weight:500; white-space:nowrap; line-height:1; display:flex; align-items:center; }
#syn-panel .fxr-type{ position:relative; font-size:9px; color:var(--text-secondary); border:1px solid var(--border-strong); border-radius:9px; padding:0 7px; height:16px; display:flex; align-items:center; gap:4px; cursor:pointer; font-weight:300; line-height:1; margin-left:3px; white-space:nowrap; }
#syn-panel .fxr-dev.noback .fxr-type{ max-width:132px; }
#syn-panel .fxr-dev.noback .fxr-preset{ max-width:104px; }
#syn-panel .fxr-dev.noback .fxr-headr{ margin-left:6px; }
#syn-panel .fxr-type .fxr-car{ color:var(--text-muted); font-size:8px; position:relative; top:.5px; }
#syn-panel .fxr-tw{ display:grid; align-items:center; justify-items:center; }
#syn-panel .fxr-tw > span{ grid-area:1/1; white-space:nowrap; display:inline-flex; align-items:center; gap:4px; }
#syn-panel .fxr-tg{ visibility:hidden; pointer-events:none; }
#syn-panel .fxr-type-native, #syn-panel .fxr-bk-native{ position:absolute; inset:0; width:100%; height:100%; margin:0; padding:0; border:none; background:transparent; color:transparent; opacity:0; cursor:pointer; -webkit-appearance:none; appearance:none; font-size:9px; }
#syn-panel .fxr-type-native:focus, #syn-panel .fxr-bk-native:focus{ outline:none; }
#syn-panel .fxr-preset{ position:relative; display:flex; align-items:center; gap:5px; width:88px; height:16px; border:1px solid var(--border-strong); border-radius:9px; padding:0 9px; cursor:pointer; line-height:1; overflow:hidden; box-sizing:border-box; }
#syn-panel .fxr-preset .fxr-star{ color:var(--purple-400); font-size:8px; line-height:1; position:relative; top:-1px; }
#syn-panel .fxr-preset .fxr-pname{ flex:1; min-width:0; text-align:center; font-size:9px; color:var(--text-secondary); font-weight:300; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#syn-panel .fxr-preset .fxr-car{ color:var(--text-muted); font-size:8px; margin-left:auto; position:relative; top:.5px; }
#syn-panel .fxr-spacer{ flex:1; }
#syn-panel .fxr-headr{ display:flex; align-items:center; gap:9px; }
#syn-panel .fxr-code{ font-weight:300; font-size:9px; color:var(--text-muted); line-height:1; white-space:nowrap; }
#syn-panel .fxr-pwr{ width:9px; height:9px; border-radius:50%; border:1px solid var(--purple-400); background:var(--purple-400); box-shadow:0 0 6px rgba(183,148,255,.5); cursor:pointer; flex:0 0 auto; }
#syn-panel .fxr-dev.fxr-off .fxr-pwr{ background:transparent; border-color:var(--text-muted); box-shadow:none; }
#syn-panel .fxr-swap, #syn-panel .fxr-x{ width:14px; height:14px; display:grid; place-items:center; cursor:pointer; padding:0; background:transparent; border:none; }
#syn-panel .fxr-swap svg, #syn-panel .fxr-x svg{ grid-area:1/1; width:14px; height:14px; display:block; }
#syn-panel .fxr-x{ color:var(--text-muted); }
#syn-panel .fxr-x:hover{ color:#EF4444; }
#syn-panel .fxr-core{ flex:1 1 0; min-height:0; margin:1px 10px 0; position:relative; overflow:hidden; color:var(--text-primary); }
#syn-panel .fxr-core svg{ position:absolute; inset:0; width:100%; height:100%; display:block; }
.fxr-core canvas{ position:absolute; inset:0; width:100%; height:100%; display:block; }
#syn-panel .fxr-core .dst-curve{ fill:none; stroke:#ECE8F2; stroke-width:1.3;
          filter:drop-shadow(0 0 1.54px rgba(183,148,255,0.85)) drop-shadow(0 0 3.84px rgba(183,148,255,0.5));
          animation:mvBreathe 3.2s ease-in-out infinite; }
#syn-panel .fxr-core .grn-wave{ fill:none; stroke:#ECE8F2; stroke-width:1.3;

#syn-panel .fxr-ctrls{ display:flex; align-items:flex-end; gap:10px; padding:5px 10px 9px; }
#syn-panel .fxr-knobs{ flex:1; display:grid; grid-template-columns:repeat(4,1fr); align-items:end; min-width:0; }
#syn-panel .fxr-knob{ display:flex; flex-direction:column; align-items:center; gap:4px; min-width:0; }
#syn-panel .fxr-dial{ width:29px; height:29px; cursor:ns-resize; }
#syn-panel .fxr-dial svg{ width:100%; height:100%; display:block; }
#syn-panel .fxr-lab{ font-size:7px; letter-spacing:.01em; color:var(--text-secondary); white-space:nowrap; text-align:center; font-weight:400; }
#syn-panel .fxr-divider{ flex:0 0 auto; width:1px; height:92%; align-self:center; position:relative; left:-3.5px; background:var(--border-strong); }
#syn-panel .fxr-rightcol{ flex:0 0 92px; display:flex; flex-direction:column; align-items:stretch; justify-content:flex-end; gap:6px; }
#syn-panel .fxr-pills{ display:flex; gap:5px; width:100%; }

#syn-panel .fxr-pill .fxr-t{ position:relative; top:0; line-height:1; }
#syn-panel .fxr-pill.fxr-on{ border-color:var(--purple-400); color:var(--text-primary); text-shadow:0 0 4px rgba(255,255,255,.5); }
#syn-panel .fxr-route{ display:flex; gap:3px; width:100%; }
#syn-panel .fxr-r{ flex:1; height:14px; display:flex; align-items:center; justify-content:center; font-size:8px; font-weight:400; color:var(--text-muted); border:1px solid var(--border-strong); border-radius:3px; cursor:pointer; }
#syn-panel .fxr-r .fxr-t{ position:relative; top:0; line-height:1; }
#syn-panel .fxr-r.fxr-on{ color:var(--text-primary); border-color:var(--purple-400); text-shadow:0 0 4px rgba(255,255,255,.5); }
#syn-panel .fxr-snd{ flex:0 0 15px; height:14px; display:flex; align-items:center; justify-content:center;
          border:1px solid var(--border); border-radius:3px; cursor:pointer; box-sizing:border-box;
          color:var(--text-muted); transition:color .12s, border-color .12s; }
#syn-panel .fxr-snd svg{ display:block; }
#syn-panel .fxr-snd:hover{ color:var(--text-secondary); }
#syn-panel .fxr-snd.fxr-on{ color:var(--purple-400); border-color:var(--purple-400);
          filter:drop-shadow(0 0 3px rgba(183,148,255,.55)); }
#syn-panel .fxr-add{ flex:0 0 110px; align-self:stretch; border:1px dashed var(--border-strong); border-radius:8px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:7px; color:var(--text-muted); cursor:pointer; transition:.15s; }
#syn-panel .fxr-add:hover{ border-color:var(--purple-400); color:var(--purple-400); }
#syn-panel .fxr-plus{ font-size:24px; font-weight:200; line-height:.7; }
#syn-panel .fxr-rack.fxr-blank{ flex:1 1 auto; min-width:0; }
#syn-panel .fxr-empty{ flex:1 1 auto; align-self:stretch; min-width:0; border:1px dashed var(--border-strong);
          border-radius:8px; display:flex; flex-direction:column; align-items:center; justify-content:center;
          gap:9px; color:var(--text-muted); cursor:pointer; transition:.15s; }
#syn-panel .fxr-empty:hover{ border-color:var(--purple-400); color:var(--purple-400); }
#syn-panel .fxr-empty .fxr-eplus{ width:30px; height:30px; display:grid; place-items:center; }
#syn-panel .fxr-empty .fxr-eplus svg{ width:30px; height:30px; display:block; }
#syn-panel .fxr-empty .fxr-t{ font-size:10px; letter-spacing:.06em; font-weight:300; }
#syn-panel .fxr-add .fxr-t{ font-size:9px; letter-spacing:.05em; text-align:center; line-height:1.4; font-weight:300; }
#syn-panel .fxr-dev.fxr-drag{ opacity:.85; box-shadow:0 12px 30px rgba(0,0,0,.5); z-index:5; }
#syn-panel .fxr-swap{ color:var(--text-muted); transition:color .12s, filter .12s; }
#syn-panel .fxr-swap .ic-arrow{ display:none; }
#syn-panel .fxr-swap.act .ic-plus{ display:none; }
#syn-panel .fxr-swap.act .ic-arrow{ display:block; }
#syn-panel .fxr-swap:hover{ color:var(--purple-400); filter:drop-shadow(0 0 5px rgba(167,139,250,.6)); }
#syn-panel .fxr-swap.act{ color:#fff; }
#syn-panel .fxr-back{ display:none; flex:1 1 0; min-height:0; flex-direction:column; padding:7px 12px 9px; }
#syn-panel .fxr-dev.swapped .fxr-core, #syn-panel .fxr-dev.swapped .fxr-ctrls{ display:none; }
#syn-panel .fxr-dev.swapped .fxr-back{ display:flex; }
#syn-panel .fxr-bk-row{ display:flex; justify-content:space-between; align-items:center; flex:0 0 auto; padding:0 2px 2px; }
#syn-panel .fxr-bk-sel{ display:inline-flex; align-items:center; gap:6px; cursor:pointer; line-height:1.55; }
#syn-panel .fxr-bk-sel .fxr-bk-k{ font-size:8.5px; color:var(--text-muted); font-weight:300; letter-spacing:.02em; }
#syn-panel .fxr-bk-vwrap{ position:relative; display:inline-flex; align-items:center; }
#syn-panel .fxr-bk-sel .fxr-bk-v{ display:inline-flex; align-items:center; gap:4px; font-size:9.5px; color:var(--text-primary); font-weight:400; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#syn-panel .fxr-bk-sel .fxr-bk-v .fxr-car{ color:var(--text-muted); font-size:8px; }
#syn-panel .fxr-bk-sel:hover .fxr-bk-v{ color:#fff; }
#syn-panel .fxr-bk-vw{ display:grid; align-items:center; justify-items:center; }
#syn-panel .fxr-bk-vw > span{ grid-area:1/1; }
#syn-panel .fxr-bk-sel .fxr-bk-g{ display:inline-flex; align-items:center; gap:4px; font-size:9.5px; font-weight:400; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; visibility:hidden; pointer-events:none; }
#syn-panel .fxr-bk-sel .fxr-bk-g .fxr-car{ font-size:8px; }
#syn-panel .fxr-bk-grid{ flex:1 1 0; min-height:0; display:grid; grid-template-columns:1fr 11px 1fr 11px 1fr 11px 1fr; grid-template-rows:1fr 1fr; align-items:center; justify-items:center; }
#syn-panel .fxr-bk-sep{ grid-row:1 / 3; width:1px; align-self:stretch; justify-self:center; background:var(--border-strong); margin:5px 0; }
#syn-panel .fxr-bk-knob{ display:flex; flex-direction:column; align-items:center; gap:5px; }
#syn-panel .fxr-bk-knob .fxr-dial{ width:32px; height:32px; cursor:ns-resize; }
#syn-panel .fxr-bk-knob .fxr-lab{ font-size:7.5px; }
#syn-panel .fxr-core[data-conv="1"] .conv-drop{ position:absolute; inset:0; z-index:5; display:none; flex-direction:column; align-items:center; justify-content:center; gap:2px; border:1px dashed var(--purple-400); border-radius:6px; background:rgba(18,16,30,.66); color:var(--purple-400); font-size:10px; letter-spacing:.04em; pointer-events:none; }
#syn-panel .fxr-core[data-conv="1"].conv-drag .conv-drop{ display:flex; }
#syn-panel .fxr-core[data-conv="1"] .cd-big{ font-size:18px; font-weight:200; line-height:.8; }
#syn-panel .fxr-core[data-conv="1"] .conv-dur{ position:absolute; right:2px; bottom:1px; z-index:3; font-size:8px; color:var(--text-dim); font-variant-numeric:tabular-nums; pointer-events:none; }
/* the mockup's own scaffolding — NOT part of the lifted rack sheet */
.fxr-dev{position:relative}
#backpanel{display:none;border:1px solid var(--border-strong,#3a3356);border-radius:10px;
  background:rgba(24,20,38,.72);padding:12px 14px}
#backpanel.on{display:block}
.bp-row{display:flex;gap:14px;align-items:flex-end;margin-bottom:12px}
.bp-sel{display:flex;flex-direction:column;gap:4px}
.bp-sel label{font:500 9.5px -apple-system,system-ui;letter-spacing:.08em;text-transform:uppercase;color:#8f88ab}
.bp-sel select{background:#1c1830;color:#e8e4f5;border:1px solid #3a3356;border-radius:6px;
  padding:4px 6px;font:400 10.5px -apple-system,system-ui;width:118px}
.bp-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px 0;position:relative}

</style></head><body>
<h1>Equalizer</h1>
<p class="sub">The back-8 ARE the curve nodes. Drag a node, a back knob moves.<br>Real card, real engine — the worklet is the same algorithm the C++ runs.
Press <b>Start</b>, then <b>Play</b>. Drag knobs vertically. <b>+</b> opens the back panel.</p>
<div class="bar">
  <button id="go">Start audio</button>
  <button id="play">Play</button>
  <button id="src">Source: Saw chord</button>
</div>
<div id="status">Idle.</div><div id="err"></div>
<div id="wrap"><div id="syn-panel"><div id="rack"></div><div id="backpanel" class="on"></div></div></div>

<script id="wk" type="text/plain">// ═══════════════════════════════════════════════════════════════════════════════
//  eq-worklet.js — fb420. The FX-rack EQUALIZER (chain kind 9) as an
//  AudioWorkletProcessor, so Max can HEAR it in a Safari mockup before integration.
//
//  Same Type / Character / Focus names, same 12 params, same laws as
//  TerrainEqualizerFx.h. NOT sample-identical to the C++ (JS has no fade-swap dip and
//  the design runs every 64 samples instead of 32) but recognisably the same device:
//  the same matched-biquad design math, the same Q laws, the same +-30 dB x Amount 200 %
//  ceiling, the same Chisel notch morph and the same Dynamic ride.
//
//  USE:
//    await ctx.audioWorklet.addModule('eq-worklet.js');
//    const eq = new AudioWorkletNode(ctx, 'terrain-eq', { numberOfInputs: 1,
//                                                         outputChannelCount: [2] });
//    eq.port.postMessage({ type: 3, character: 0, axis: 0,
//                          f1: 0.5, f2: 0.5, f3: 0.5, mix: 1,
//                          b1: 0.5, b2: 0.5, b3: 0.5, b4: 0.5,
//                          b5: 0.5, b6: 0.5, b7: 0.5, b8: 0.5 });
//    eq.port.onmessage = e => drawCurve(e.data.curve);   // 96 log bins, 20 Hz - 20 kHz
//
//  EVERY DEFAULT IS 0.5 AND 0.5 IS NEUTRAL, so the device boots flat and transparent.
// ═══════════════════════════════════════════════════════════════════════════════

const TYPES = ['Surgical', 'British', 'American', 'Passive', 'Open', 'Dynamic', 'Chisel'];
const FOCUS = ['Stereo', 'Mid', 'Side', 'Left', 'Right'];
const TRAIT = ['Pinch', 'Slope', 'Taper', 'Dip', 'Silk', 'Pivot', 'Sting'];
const BACK  = ['Low Hz', 'Low', 'Body Hz', 'Body', 'Bite Hz', 'Bite', 'Reach', 'Trait'];
const FRONT = ['Slant', 'Air', 'Amount', 'Mix'];
// fb425 — the two words the card prints ABOVE the back dropdowns. They are published
// labels like any other, so they live in a table the drift gate can read, not in the mockup's
// markup where nothing checks them. Order matches the panel: dropdown 1, then dropdown 2.
const DROPDOWN = ['Character', 'Focus'];

const CHARS = [
  ['Plain','Tight','Broad','Steep','Scoop','Deep Pivot','Bright Pivot','Four Bells'],
  ['Desk','Big Knob','Ahead','Iron Top','Sub Iron','Steep Iron','Full Swing','Mid Rise'],
  ['Proportional','Lasers','Mellow','Floor Lift','Boost Only','Cut Only','Shelf Ride','Bolt'],
  ['Baseline','Close Cut','Far Cut','Both Ends','Bell Top','Slow Top','Deep Atten','Revival'],
  ['Gloss','Very Wide','Two Shelves','Twin Shelf','Deep Reach','Soft Knee','Hard Knee','Bell Air'],
  ['Program Ride','Quick','Lazy','Wideband','Upward','Hard Window','Soft Window','Peak Keep'],
  ['Resonator','Scalpel','Triple Notch','Gain Peak','Shallow','Handset','Sub Kill','Tin']
];

// LOW · BODY · BITE · AIR   —   kind: 0 bell · 1 low shelf · 2 high shelf
//                                      3 low shelf 1-pole · 4 high shelf 1-pole · 5 SLANT (fixed pivot)
const TSPEC = [
  { q: [0.90,1.00,1.00,0.90], k: [1,0,0,2], law: 0, soften: 0.00 },  // Surgical
  { q: [0.80,1.00,1.00,0.80], k: [1,0,0,2], law: 1, soften: 0.10 },  // British
  { q: [1.00,1.00,1.00,1.00], k: [1,0,0,2], law: 2, soften: 0.00 },  // American
  { q: [0.90,0.80,0.70,0.80], k: [1,0,0,2], law: 3, soften: 0.00 },  // Passive
  { q: [0.45,0.40,0.40,0.50], k: [1,0,0,4], law: 4, soften: 0.00 },  // Open  (AIR is 6 dB/oct)
  { q: [0.90,1.00,1.00,0.90], k: [1,0,0,2], law: 5, soften: 0.00 },  // Dynamic
  { q: [1.00,1.00,1.00,1.00], k: [1,0,0,2], law: 6, soften: 0.00 }   // Chisel
];

// qm, fm, gm per band · kd (-1 = type default, 5 = steep) · pivotHz · cutQ · cutG · e1,e2,e3
// 🔑 fb423 — NO `nm` FIELD. This factory used to carry a name, which made CSPEC a SECOND
// name table beside CHARS above — and it had already drifted 12 names behind it while
// being dead code (only CHARS is ever published, at pushCurve()). That is the same
// two-table geometry the C++ header deleted at fb422 (`Fixed Top` vs `Iron Top`).

const BAND_LO = [20, 100, 700, 6000], BAND_HI = [500, 3000, 14000, 40000];
const DB_SPAN = 30, SLANT_SPAN = 24, AMOUNT_MAX = 2;
const Q_MIN = 0.05, Q_MAX = 90, G_CEIL = 72, G_FLOOR = -90;
const DESIGN_BLK = 64, DET_CAL = 14, MAX_RING_SEC = 3;
const CURVE_BINS = 96;

const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const bandHz = (b, t) => BAND_LO[b] * Math.pow(BAND_HI[b] / BAND_LO[b], clamp(t, 0, 1));
const curveBinHz = i => 20 * Math.pow(10, 3 * i / (CURVE_BINS - 1));

// ── the analog prototype every design below is trying to be ──────────────────
function protoMag2(kind, f, f0, Q, gDb) {
  if (Math.abs(gDb) < 1e-12) return 1;
  if (Q < 1e-4) Q = 1e-4;
  const A = Math.pow(10, gDb / 40), W = f / Math.max(1e-6, f0), W2 = W * W;
  if (kind === 0) {
    const t = (1 - W2) * (1 - W2);
    return (t + Math.pow(A * W / Q, 2)) / Math.max(1e-300, t + Math.pow(W / (A * Q), 2));
  }
  if (kind === 1) {
    const n = (A - W2) * (A - W2) + A * W2 / (Q * Q);
    const d = (1 - A * W2) * (1 - A * W2) + A * W2 / (Q * Q);
    return A * A * n / Math.max(1e-300, d);
  }
  if (kind === 2) {
    const n = (1 - A * W2) * (1 - A * W2) + A * W2 / (Q * Q);
    const d = (A - W2) * (A - W2) + A * W2 / (Q * Q);
    return A * A * n / Math.max(1e-300, d);
  }
  if (kind === 3) return A * A * (W2 + A * A) / Math.max(1e-300, W2 + 1 / (A * A));
  if (kind === 5) { const g = Math.pow(10, gDb / 20); return (W2 * g * g + 1 / (g * g)) / (W2 + 1); }
  return A * A * A * A * (W2 + 1 / (A * A)) / Math.max(1e-300, W2 + A * A);
}

// |H|^2 in the phi basis (phi = sin^2(w/2)). NOT the textbook cosine form: that one loses
// eight digits to cancellation at low frequency and makes the drawn curve lie by 60 dB.
function magSq(c, phi) {
  const sb = c[0] + c[1] + c[2], sa = 1 + c[3] + c[4];
  const n = sb * sb - 4 * (c[0] * c[1] + 4 * c[0] * c[2] + c[1] * c[2]) * phi + 16 * c[0] * c[2] * phi * phi;
  const d = sa * sa - 4 * (c[3] + 4 * c[4] + c[3] * c[4]) * phi + 16 * c[4] * phi * phi;
  return d > 1e-300 ? Math.max(0, n) / d : 1e300;
}

// ── the designs. Coeffs are [b0, b1, b2, a1, a2]. ───────────────────────────
function designRbj(kind, f0, Q, gDb, fs) {
  if (Math.abs(gDb) < 1e-12) return [1, 0, 0, 0, 0];
  if (Q < 1e-4) Q = 1e-4;
  const A = Math.pow(10, gDb / 40), w = 2 * Math.PI * clamp(f0, 1, 0.45 * fs) / fs;
  const cw = Math.cos(w), al = Math.sin(w) / (2 * Q), sA = Math.sqrt(A);
  let b0, b1, b2, a0, a1, a2;
  if (kind === 0) { b0 = 1 + al * A; b1 = -2 * cw; b2 = 1 - al * A; a0 = 1 + al / A; a1 = -2 * cw; a2 = 1 - al / A; }
  else if (kind === 1) {
    b0 = A * ((A + 1) - (A - 1) * cw + 2 * sA * al); b1 = 2 * A * ((A - 1) - (A + 1) * cw);
    b2 = A * ((A + 1) - (A - 1) * cw - 2 * sA * al); a0 = (A + 1) + (A - 1) * cw + 2 * sA * al;
    a1 = -2 * ((A - 1) + (A + 1) * cw);             a2 = (A + 1) + (A - 1) * cw - 2 * sA * al;
  } else {
    b0 = A * ((A + 1) + (A - 1) * cw + 2 * sA * al); b1 = -2 * A * ((A - 1) + (A + 1) * cw);
    b2 = A * ((A + 1) + (A - 1) * cw - 2 * sA * al); a0 = (A + 1) - (A - 1) * cw + 2 * sA * al;
    a1 = 2 * ((A - 1) - (A + 1) * cw);              a2 = (A + 1) - (A - 1) * cw - 2 * sA * al;
  }
  return [b0 / a0, b1 / a0, b2 / a0, a1 / a0, a2 / a0];
}

// impulse-invariant pole/zero pair, in the form that does not overflow at q*w > 710
function iiPair(f, q, fs) {
  const fc = clamp(f, 0.02, 0.47 * fs), w = 2 * Math.PI * fc / fs;
  const c2 = Math.exp(-2 * q * w);
  let c1;
  if (q <= 1) c1 = -2 * Math.exp(-q * w) * Math.cos(Math.sqrt(1 - q * q) * w);
  else { const sq = Math.sqrt(q * q - 1); c1 = -(Math.exp(-(q - sq) * w) + Math.exp(-(q + sq) * w)); }
  return [isFinite(c1) ? c1 : 0, isFinite(c2) ? c2 : 0];
}

// the shelf-Q ceiling: a resonance whose pole pair sits beyond Nyquist cannot exist in a
// minimum-phase digital filter, so taper Q toward 0.7 instead of faking a band-edge bump.
function usableQ(kind, f0, Q, gDb, fs) {
  if (kind === 0 || kind >= 3) return Q;
  const A = Math.pow(10, gDb / 40);
  const fp = kind === 1 ? f0 / Math.sqrt(A) : f0 * Math.sqrt(A);
  const r = fp / (0.5 * fs);
  if (r <= 0.70) return Q;
  let t = Math.min(1, (r - 0.70) / 0.60); t = t * t * (3 - 2 * t);
  return Q + (0.70 - Q) * t;
}

const PROBE_FR  = [0.0004,0.0016,0.0055,0.016,0.040,0.075,0.120,0.190,0.270,0.340,0.405,0.455];
const PROBE_PHI = PROBE_FR.map(f => { const s = Math.sin(Math.PI * f); return s * s; });

function designMatched(kind, f0, Q, gDb, fs) {
  if (Math.abs(gDb) < 1e-12) return [1, 0, 0, 0, 0];
  if (Q < 1e-4) Q = 1e-4;
  const A = Math.pow(10, gDb / 40);
  let fp, qp, fz, qz;
  if (kind === 0) { fp = f0; qp = 1 / (2 * A * Q); fz = f0; qz = A / (2 * Q); }
  else if (kind === 1) { fp = f0 / Math.sqrt(A); fz = f0 * Math.sqrt(A); qp = qz = 1 / (2 * Q); }
  else { fp = f0 * Math.sqrt(A); fz = f0 / Math.sqrt(A); qp = qz = 1 / (2 * Q); }
  const [a1, a2] = iiPair(fp, qp, fs);

  // (A) closed-form three-point magnitude fit
  let A1 = null;
  {
    const fFit = Math.min(f0, 0.40 * fs);
    const G0 = protoMag2(kind, 0, f0, Q, gDb), G1 = protoMag2(kind, fFit, f0, Q, gDb);
    const GN = protoMag2(kind, 0.5 * fs, f0, Q, gDb);
    const sp = Math.sin(Math.PI * fFit / fs), phi = sp * sp;
    const sumA = 1 + a1 + a2, difA = 1 - a1 + a2;
    const R1 = sumA * Math.sqrt(G0), R2 = difA * Math.sqrt(GN);
    const bb1 = 0.5 * (R1 - R2), S = 0.5 * (R1 + R2);
    const PA = sumA * sumA - 4 * (a1 + 4 * a2 + a1 * a2) * phi + 16 * a2 * phi * phi;
    const den = 16 * phi * (phi - 1);
    if (den < -1e-10) {
      const W = (G1 * PA - R1 * R1 + 4 * phi * bb1 * S) / den, disc = S * S - 4 * W;
      if (disc >= 0) { const r = Math.sqrt(disc), b0 = 0.5 * (S + r);
                       const c = [b0, bb1, S - b0, a1, a2];
                       if (c.every(isFinite)) A1 = c; }
    }
  }
  // (B)/(D) matched pole-zero, anchored at DC and at Nyquist
  const cands = [];
  if (A1) cands.push(A1);
  {
    const [z1, z2] = iiPair(fz, qz, fs);
    for (let e = 0; e < 2; ++e) {
      const anchor = e === 0 ? 0 : 0.5 * fs;
      const tgt = protoMag2(kind, anchor, f0, Q, gDb);
      const nb = e === 0 ? (1 + z1 + z2) : (1 - z1 + z2);
      const na = e === 0 ? (1 + a1 + a2) : (1 - a1 + a2);
      if (Math.abs(nb) < 1e-12 || Math.abs(na) < 1e-12) continue;
      const k = Math.sqrt(tgt) * na / nb, c = [k, k * z1, k * z2, a1, a2];
      if (c.every(isFinite)) cands.push(c);
    }
  }
  cands.push(designRbj(kind, f0, Q, gDb, fs));                        // (C) plain bilinear
  let best = cands[0], bestE = Infinity;
  for (const c of cands) {
    let e = 0;
    for (let i = 0; i < 12; ++i) {
      const t = protoMag2(kind, PROBE_FR[i] * fs, f0, Q, gDb);
      const r = Math.max(1e-300, magSq(c, PROBE_PHI[i]));
      e += r / t + t / r;
    }
    if (e < bestE) { bestE = e; best = c; }
  }
  return best;
}

// 1-pole shelves as gLo*LP + gHi*HP. The m^2(1+K/m)/(1+Km) form is algebraically the same
// and numerically lethal: a 96 dB slant loses its whole low end to cancellation.
// 🚨 fb422 — the prewarped corner G is the primitive, because the SLANT places its corner
// by arithmetic and an atan/tan round trip would smear the pivot.
// The one-pole pole cap: a1 = (G-1)/(G+1), so |a1| -> 1 as G leaves the window in which the
// decay is under MAX_RING_SEC. Same rMax as the biquad ring cap.
function onePoleGmax(fs) { const r = Math.exp(-6.907755 / (MAX_RING_SEC * fs)); return (1 + r) / (1 - r); }
function designShelf1G(G, gLoDb, gHiDb, fs) {
  const gMax = onePoleGmax(fs);
  G = clamp(G, 1 / gMax, gMax);
  const gL = Math.pow(10, gLoDb / 20), gH = Math.pow(10, gHiDb / 20), d = 1 + G;
  if (gLoDb === 0 && gHiDb === 0) return [1, (G - 1) / d, 0, (G - 1) / d, 0];
  return [(gL * G + gH) / d, (gL * G - gH) / d, 0, (G - 1) / d, 0];
}
function designShelf1(f0, gLoDb, gHiDb, fs) {
  return designShelf1G(Math.tan(Math.PI * clamp(f0, 1, 0.49 * fs) / fs), gLoDb, gHiDb, fs);
}
// 🚨 fb422 — THE SLANT. It was designShelf1(pivot, -g, +g), whose 0 dB crossing sits at
// pivot/10^(g/20): the pivot SLID 700 Hz -> 2.8 Hz as the knob opened and 120 Hz travelled
// -4.4 dB and then back UP to +8.8 dB. Put the CORNER where the crossing has to land:
// G_corner = G_pivot * 10^(g/20), in the prewarped domain, so the pivot is exact digitally.
function designSlant(fPivot, gDb, fs) {
  const Gp = Math.tan(Math.PI * clamp(fPivot, 1, 0.49 * fs) / fs);
  return designShelf1G(Gp * Math.pow(10, gDb / 20), -gDb, gDb, fs);
}
function designOnePole(kind, f0, gDb, fs) {
  if (kind === 5) return designSlant(f0, gDb, fs);
  if (kind === 4) return designShelf1(f0, 0, gDb, fs);
  return designShelf1(f0, gDb, 0, fs);
}

// nothing in this device may ring longer than MAX_RING_SEC
function limitRing(c, fs) {
  const rMax = Math.exp(-6.907755 / (MAX_RING_SEC * fs)), r2 = rMax * rMax;
  if (c[4] > r2) { const sc = Math.sqrt(r2 / c[4]); c[3] *= sc; c[4] = r2; }
  return c;
}
function designBand(kind, f0, Q, gDb, fs) {
  if (Math.abs(gDb) < 1e-12) return [1, 0, 0, 0, 0];
  if (kind >= 3) return designOnePole(kind, f0, gDb, fs);
  const fLo = fs / 48, fHi = fs / 24;
  if (f0 <= fLo) return limitRing(designRbj(kind, f0, Q, gDb, fs), fs);
  if (f0 >= fHi) return limitRing(designMatched(kind, f0, Q, gDb, fs), fs);
  let t = (Math.log(f0) - Math.log(fLo)) / (Math.log(fHi) - Math.log(fLo));
  t = t * t * (3 - 2 * t);
  const a = designRbj(kind, f0, Q, gDb, fs), b = designMatched(kind, f0, Q, gDb, fs);
  return limitRing(a.map((v, i) => v + t * (b[i] - v)), fs);
}

const widthMul = s => s <= 0.5 ? 0.25 * Math.pow(4, s * 2) : Math.pow(40, (s - 0.5) * 2);

// ═══════════════════════════════════════════════════════════════════════════════
class TerrainEq extends AudioWorkletProcessor {
  constructor() {
    super();
    this.fs = sampleRate;
    this.p = { type: 0, character: 0, axis: 0, f1: .5, f2: .5, f3: .5, mix: 1,
               b1: .5, b2: .5, b3: .5, b4: .5, b5: .5, b6: .5, b7: .5, b8: .5 };
    this.tg = new Float64Array(11).fill(0.5);
    this.sm = new Float64Array(11).fill(0.5);
    // fb422: Amount .010 -> .020. It multiplies all four band gains (+-60 dB of authority) and
    // had the SHORTEST tau in the table; an instant Amount write measured 1.63 dB of wet-gain
    // change in ONE sample. The number scales as 1/tau, which is what proves it is a smoothing
    // fault; `Trait` does not move with tau at all, because that one is stored resonator energy.
    const tau = [.020,.012,.020,.012,.020,.012,.020,.020,.015,.012,.020];
    this.k = tau.map(t => 1 - Math.exp(-(DESIGN_BLK / this.fs) / t));
    this.mixSm = 1; this.mixTg = 1;
    this.mixK = 1 - Math.exp(-1 / (0.010 * this.fs));
    // 9 stages: 4 bands x 2 + slant. cur/tgt/inc coefficients + 2 channels of state.
    this.st = [];
    for (let i = 0; i < 9; ++i)
      this.st.push({ on: false, kind: 0, f: 1000, q: 1, g: 0, lf: -1, lq: -1, lg: 1e9,
                     cur: [1,0,0,0,0], tgt: [1,0,0,0,0], inc: [0,0,0,0,0],
                     z1: [0,0], z2: [0,0] });
    this.act = []; this.ctr = 0;
    this.det = { d1: [0,0,0,0], d2: [0,0,0,0], env: [0,0,0,0], envW: 0,
                 a1: [.5,.5,.5,.5], a2: [0,0,0,0], a3: [0,0,0,0],
                 atk: [.01,.01,.01,.01], rel: [.001,.001,.001,.001] };
    this.ride = [1,1,1,1];
    this.nodeHz = [100,550,3100,15500]; this.nodeDb = [0,0,0,0];
    this.slantDb = 0; this.lvl = 0;
    this.lvlK = 1 - Math.exp(-1 / (0.060 * this.fs));
    this.phi = new Float64Array(CURVE_BINS);
    for (let i = 0; i < CURVE_BINS; ++i) {
      const s = Math.sin(Math.PI * curveBinHz(i) / this.fs); this.phi[i] = s * s;
    }
    this.curve = new Float32Array(CURVE_BINS);
    this.pushCtr = 0; this.pushEvery = Math.max(1, Math.floor(this.fs / 30 / 128));
    this.port.onmessage = e => this.setParams(e.data);
    this.resolve(); this.designAll(true);
  }
  static get parameterDescriptors() { return []; }

  setParams(q) {
    Object.assign(this.p, q);
    const p = this.p;
    this.tg[0] = clamp(p.b1,0,1); this.tg[1] = clamp(p.b2,0,1);
    this.tg[2] = clamp(p.b3,0,1); this.tg[3] = clamp(p.b4,0,1);
    this.tg[4] = clamp(p.b5,0,1); this.tg[5] = clamp(p.b6,0,1);
    this.tg[6] = clamp(p.b7,0,1); this.tg[7] = clamp(p.b8,0,1);
    this.tg[8] = clamp(p.f1,0,1); this.tg[9] = clamp(p.f2,0,1); this.tg[10] = clamp(p.f3,0,1);
    this.mixTg = clamp(p.mix,0,1);
  }

  resolve() {
    const T = TSPEC[clamp(this.p.type|0, 0, 6)];
    const CH = CSPEC[clamp(this.p.type|0, 0, 6)][clamp(this.p.character|0, 0, 7)];
    const sm = this.sm, amount = sm[10] * AMOUNT_MAX, shape = sm[7];
    const f = [bandHz(0, sm[0]) * CH.fm[0], bandHz(1, sm[2]) * CH.fm[1],
               bandHz(2, sm[4]) * CH.fm[2], bandHz(3, sm[6]) * CH.fm[3]];
    const g = [(sm[1]*2-1) * DB_SPAN * CH.gm[0], (sm[3]*2-1) * DB_SPAN * CH.gm[1],

    for (let b = 0; b < 4; ++b) if (g[b] < 0) g[b] *= CH.cutG;
    const kd = [], steep = [];
    for (let b = 0; b < 4; ++b) {
      let k = CH.kd[b] >= 0 ? CH.kd[b] : T.k[b];
      steep[b] = (k === 5); if (steep[b]) k = T.k[b];
      kd[b] = k;
    }

    } else if (T.law === 4) {

      }

        this.det.a2[b] = gg * this.det.a1[b];
        this.det.a3[b] = gg * this.det.a2[b];

        let rel = 8 * atk; if (CH.e2 === 3) rel *= 10;

      } else if (S.f !== S.lf || S.q !== S.lq || S.g !== S.lg) {

                            : designBand(S.kind, S.f, S.q, S.g, this.fs);

    if (CH.e2 === 2) {

      this.curve[i] = clamp(acc, -120, 80);
    }
    this.port.postMessage({ curve: Array.from(this.curve), nodeHz: this.nodeHz.slice(),

    const iR = inp && inp[1] ? inp[1] : iL;

    let i = 0;
    while (i < n) {

        this.resolve(); this.designAll(false);

        for (const s of this.act) {
          const S = this.st[s];
          S.cur[0] += S.inc[0]; S.cur[1] += S.inc[1]; S.cur[2] += S.inc[2];
          S.cur[3] += S.inc[3]; S.cur[4] += S.inc[4];

        if (focus === 1) { a = (dl + dr) * S2; b = (dl - dr) * S2; }
        else if (focus === 2) { a = (dl - dr) * S2; b = (dl + dr) * S2; }
        else if (focus === 4) { a = dr; b = dl; }
        else { a = dl; b = dr; }
        const both = focus === 0;
        for (const s of this.act) {
          const S = this.st[s], c = S.cur;

          if (both) { x = b; y = c[0] * x + S.z1[1];
                      S.z1[1] = c[1] * x - c[3] * y + S.z2[1];
                      S.z2[1] = c[2] * x - c[4] * y; b = y; }
        }
        let wl, wr;

        else if (focus === 2) { wl = (b + a) * S2; wr = (b - a) * S2; }
        else if (focus === 4) { wl = b; wr = a; }
        else { wl = a; wr = b; }
        this.mixSm += this.mixK * (this.mixTg - this.mixSm);
        const mw = this.mixSm, md = 1 - mw;                 // LINEAR, never equal-power
        const ol = dl * md + wl * mw, orr = dr * md + wr * mw;
        oL[i] = ol; if (oR !== oL) oR[i] = orr;
        const pk = Math.max(Math.abs(ol), Math.abs(orr));

  }

  bindDial(d,function(){return BV[i];},function(v){BV[i]=v; push('b'+(i+1),v/100);}); });
document.getElementById('tsel').addEventListener('change',function(e){
  var i=e.target.selectedIndex; D.type=TYPES[i];
  document.querySelector('.fxr-tl').firstChild.nodeValue=D.type; push('type',i,true); });
document.getElementById('csel').addEventListener('change',function(e){ push('character',e.target.selectedIndex,true); });
document.getElementById('dsel').addEventListener('change',function(e){ push('axis',e.target.selectedIndex,true); });
document.querySelector('.fxr-pwr').addEventListener('click',function(){
  D.on=!D.on; document.querySelector('.fxr-dev').classList.toggle('fxr-off',!D.on);
  if(wetG){var t=ac.currentTime; wetG.gain.setTargetAtTime(D.on?1:0,t,0.02); dryG.gain.setTargetAtTime(D.on?0:1,t,0.02);} });
document.querySelectorAll('.fxr-r').forEach(function(r){ r.addEventListener('click',function(){ r.classList.toggle('fxr-on'); }); });
document.querySelectorAll('.fxr-pill').forEach(function(p,i){ p.addEventListener('click',function(){
  p.classList.toggle('fxr-on'); push(['pill1','pill2'][i], p.classList.contains('fxr-on')?1:0, true); }); });

/* ── audio ── */
var ac=null,node=null,wetG=null,dryG=null,outG=null,srcN=null,playing=false,viz={},kind=0;
var KINDS=['Saw chord','Sine 220','Noise','Pluck'];
function fail(m){document.getElementById('err').textContent=m;document.getElementById('status').textContent='Failed to start.';}
function push(k,v,raw){ if(!node)return; var m={}; m[k]=raw?v:v; node.port.postMessage(m); }
async function addWorklet(){
  var code=document.getElementById('wk').textContent;
  /* Safari refuses blob: worklets on file:// in some builds (fb396) — blob, then data:, then report */
  try{ await ac.audioWorklet.addModule(URL.createObjectURL(new Blob([code],{type:'text/javascript'}))); return 'blob'; }
  catch(e1){ try{ await ac.audioWorklet.addModule('data:text/javascript;base64,'+btoa(unescape(encodeURIComponent(code)))); return 'data'; }
    catch(e2){ throw new Error('addModule failed.\nblob: '+e1.message+'\ndata: '+e2.message); } }
}
async function boot(){
  ac=new (window.AudioContext||window.webkitAudioContext)();
  var how=await addWorklet();
  node=new AudioWorkletNode(ac,'terrain-eq',{numberOfInputs:1,numberOfOutputs:1,outputChannelCount:[2]});
  wetG=ac.createGain(); dryG=ac.createGain(); outG=ac.createGain();
  dryG.gain.value=0; outG.gain.value=0.55;
  node.connect(wetG); wetG.connect(outG); dryG.connect(outG); outG.connect(ac.destination);
  node.port.onmessage=function(e){ viz=e.data||{}; };
  KEYS.forEach(function(k,i){ push(k,D.knobs[i].v/100); });
  BACK.forEach(function(b,i){ push('b'+(i+1), b[1]/100); });
  push('type',0,true); push('character',0,true); push('axis',0,true);
  document.getElementById('status').textContent='Running (worklet via '+how+'). Drag a knob; switch Type.';
}
document.getElementById('go').addEventListener('click',function(){ boot().catch(function(e){fail(String(e&&e.message||e));}); });
document.getElementById('src').addEventListener('click',function(){ kind=(kind+1)%KINDS.length;
  document.getElementById('src').textContent='Source: '+KINDS[kind]; if(playing){stop();start();} });
function makeSrc(){
  var sr=ac.sampleRate, n=Math.floor(sr*2), b=ac.createBuffer(2,n,sr);
  for(var c=0;c<2;c++){ var d=b.getChannelData(c);
    for(var i=0;i<n;i++){ var t=i/sr, v=0;
      if(kind===0){ [110,138.6,164.8,220].forEach(function(f){ var ph=(t*f)%1; v+=(2*ph-1)*0.16; }); }
      else if(kind===1){ v=Math.sin(2*Math.PI*220*t)*0.5; }
      else if(kind===2){ v=(Math.random()*2-1)*0.28; }
      else { var env=Math.exp(-((t%0.5))*7); [220,330,440].forEach(function(f){ v+=Math.sin(2*Math.PI*f*t)*0.2*env; }); }
      d[i]=v; } }
  /* fb431 — NORMALISE TO THE BUS. Every threshold in Compress and OTT is an ABSOLUTE dBFS
     number calibrated for the -26 dBFS Terrain bus. These sources ran at -9..-16 dBFS, i.e.
     up to 19 dB hot, which puts every band above OTT's UPWARD thresholds so the upward
     computer — the entire point of an OTT — never engages, and what is left is a downward
     compressor REMOVING top end. Measured on this very saw chord at Amount 0.5: -32.5 dBFS
     in gave +10.98 dB and +10.75 dB of high band; -13.7 dBFS in gave -4.67 and -6.39. The
     mockup was auditioning a level the rack never produces. */
  var acc=0,d0=b.getChannelData(0); for(var j=0;j<n;j++) acc+=d0[j]*d0[j];
  var cur=Math.sqrt(acc/n), want=Math.pow(10,-26/20), k=cur>1e-9?want/cur:1;
  for(var c2=0;c2<2;c2++){ var dd=b.getChannelData(c2); for(var j2=0;j2<n;j2++) dd[j2]*=k; }
  var el=document.getElementById('src');
  if(el) el.textContent='Source: '+KINDS[kind]+'  (-26 dBFS, bus level)';
  var s=ac.createBufferSource(); s.buffer=b; s.loop=true; return s;
}
function start(){ srcN=makeSrc(); srcN.connect(node); srcN.connect(dryG); srcN.start(); playing=true;
  document.getElementById('play').textContent='Stop'; }
function stop(){ if(srcN){try{srcN.stop();}catch(e){} srcN.disconnect(); srcN=null;} playing=false;
  document.getElementById('play').textContent='Play'; }
document.getElementById('play').addEventListener('click',function(){ if(!node){fail('Press Start audio first.');return;}
  if(ac.state==='suspended')ac.resume(); playing?stop():start(); });

/* ── the core visual. Driven by whatever the engine actually publishes — no invented data. ── */
function frame(){
  var svg=document.getElementById('cs'); if(svg){
    var W=svg.clientWidth||600,H=svg.clientHeight||120;
    svg.setAttribute('viewBox','0 0 '+W+' '+H);
    var d='', c=viz.curve||viz.mag||null;
    if(c&&c.length){                                     /* EQ: 96 log bins, dB */
      for(var i=0;i<c.length;i++){ var x=i/(c.length-1)*W;
        var y=H*0.5-Math.max(-30,Math.min(30,c[i]))*(H*0.5/30);
        d+=(i?'L':'M')+x.toFixed(1)+' '+y.toFixed(1); }
    } else {
      var g=viz.grDb, gb=viz.grDbBands||viz.grBands||null, lv=viz.lvl||0;
      if(gb&&gb.length){                                 /* OTT: per-band GR */
        for(var b2=0;b2<gb.length;b2++){ var x0=W*(b2+0.12)/gb.length, x1=W*(b2+0.88)/gb.length;
          var yy=H*0.5-Math.max(-24,Math.min(24,gb[b2]))*(H*0.42/24);
          d+='M'+x0.toFixed(1)+' '+yy.toFixed(1)+'L'+x1.toFixed(1)+' '+yy.toFixed(1); }
      } else if(g!==undefined){                          /* Compress: GR trace */
        HIST.push(g); if(HIST.length>140)HIST.shift();
        for(var k=0;k<HIST.length;k++){ var x=k/(HIST.length-1||1)*W;
          var y=H*0.12+Math.max(0,Math.min(24,HIST[k]))*(H*0.76/24);
          d+=(k?'L':'M')+x.toFixed(1)+' '+y.toFixed(1); }
      } else {                                           /* Widen: correlation */
        var cr=(viz.corr!==undefined)?viz.corr:0;
        HIST.push(cr); if(HIST.length>140)HIST.shift();
        for(var k2=0;k2<HIST.length;k2++){ var x2=k2/(HIST.length-1||1)*W;
          var y2=H*0.5-HIST[k2]*(H*0.40);
          d+=(k2?'L':'M')+x2.toFixed(1)+' '+y2.toFixed(1); }
      }
    }
    var el=document.getElementById('cline'); if(el)el.setAttribute('d',d||('M0 '+(H*0.5)+'L'+W+' '+(H*0.5)));
  }
  requestAnimationFrame(frame);
}
var HIST=[];
requestAnimationFrame(frame);
</script></body></html>
