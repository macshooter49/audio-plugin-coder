<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=960">
<title>Wave Rack - Step Sequencer</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg-primary: #0D0D1A;
  --bg-secondary: #141428;
  --bg-cell: #1E1E38;
  --bg-cell-hover: #282850;
  --bg-toolbar: #111122;
  --bg-graph: #0A0A18;
  --grid-line: #2A2A4A;
  --grid-beat: #3A3A5E;
  --text-primary: #E8E8F0;
  --text-secondary: #8888AA;
  --text-dim: #555570;
  --cursor-color: rgba(255, 255, 255, 0.18);
  --mute-active: #EF4444;
  --solo-active: #EAB308;
  --btn-inactive: #3A3A5E;
  --pattern-active: #6366F1;
  --pattern-inactive: #2A2A4A;
  --accent-glow: rgba(255, 255, 255, 0.35);
}

html, body {
  width: 960px;
  height: 560px;
  overflow: hidden;
  background: #000;
  font-family: Arial, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  color: var(--text-primary);
  user-select: none;
  -webkit-user-select: none;
}

#app {
  width: 960px;
  height: 560px;
  background: var(--bg-primary);
  display: flex;
  flex-direction: column;
}

/* ===== TOOLBAR ===== */
#toolbar {
  height: 40px;
  min-height: 40px;
  background: var(--bg-toolbar);
  display: flex;
  align-items: center;
  padding: 0 12px;
  gap: 12px;
  border-bottom: 1px solid var(--grid-line);
}

#toolbar .brand {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-right: auto;
}

#toolbar .brand .logo {
  width: 24px;
  height: 24px;
  background: var(--pattern-active);
  border-radius: 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  font-weight: 700;
  color: #fff;
  letter-spacing: -0.5px;
}

#toolbar .brand .title {
  font-size: 14px;
  font-weight: 700;
  color: var(--text-primary);
  letter-spacing: 1.5px;
}

.pattern-group {
  display: flex;
  gap: 4px;
  margin-right: 16px;
}

.pattern-btn {
  width: 32px;
  height: 28px;
  border: none;
  border-radius: 4px;
  background: var(--pattern-inactive);
  color: var(--text-dim);
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  transition: filter 0.1s ease-out;
}

.pattern-btn:hover { filter: brightness(1.15); }

.pattern-btn.active {
  background: var(--pattern-active);
  color: #fff;
}

.toolbar-control {
  display: flex;
  align-items: center;
  gap: 4px;
}

.toolbar-control label {
  font-size: 10px;
  color: var(--text-secondary);
}

.toolbar-select {
  height: 28px;
  padding: 0 8px;
  background: var(--pattern-inactive);
  color: var(--text-primary);
  border: 1px solid var(--grid-line);
  border-radius: 4px;
  font-size: 11px;
  cursor: pointer;
  outline: none;
}

.toolbar-select:hover { border-color: var(--grid-beat); }

/* ===== MAIN AREA ===== */
#main-area {
  flex: 1;
  display: flex;
  overflow: hidden;
}

/* ===== CHANNEL STRIP ===== */
#channel-strip {
  width: 180px;
  min-width: 180px;
  background: var(--bg-secondary);
  display: flex;
  flex-direction: column;
  border-right: 1px solid var(--grid-line);
}

#channel-header {
  height: 22px;
  min-height: 22px;
  display: flex;
  align-items: center;
  padding: 0 12px;
  border-bottom: 1px solid var(--grid-line);
}

#channel-header span {
  font-size: 9px;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 1px;
}

#channel-rows {
  flex: 1;
  display: flex;
  flex-direction: column;
}

.channel-row {
  flex: 1;
  display: flex;
  align-items: center;
  border-bottom: 1px solid rgba(42, 42, 74, 0.5);
  cursor: pointer;
  transition: background 0.1s ease-out;
  position: relative;
}

.channel-row:hover { background: rgba(255, 255, 255, 0.02); }

.channel-row.selected { background: rgba(99, 102, 241, 0.08); }

.channel-row.muted { opacity: 0.4; }

.channel-color-bar {
  width: 6px;
  align-self: stretch;
  flex-shrink: 0;
}

.channel-info {
  display: flex;
  flex-direction: column;
  padding: 0 0 0 8px;
  min-width: 0;
  flex: 1;
}

.channel-name {
  font-size: 11px;
  font-weight: 500;
  color: var(--text-primary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  line-height: 1.3;
}

.channel-note {
  font-family: 'Menlo', 'Consolas', monospace;
  font-size: 9px;
  color: var(--text-secondary);
  line-height: 1.3;
}

.channel-buttons {
  display: flex;
  gap: 3px;
  padding-right: 8px;
  flex-shrink: 0;
}

.mute-btn, .solo-btn {
  width: 22px;
  height: 22px;
  border: none;
  border-radius: 4px;
  font-size: 9px;
  font-weight: 700;
  cursor: pointer;
  background: var(--btn-inactive);
  color: var(--text-dim);
  transition: filter 0.1s ease-out;
  display: flex;
  align-items: center;
  justify-content: center;
}

.mute-btn:hover, .solo-btn:hover { filter: brightness(1.15); }

.mute-btn.active {
  background: var(--mute-active);
  color: #fff;
}

.solo-btn.active {
  background: var(--solo-active);
  color: #1A1A00;
}

/* ===== GRID AREA ===== */
#grid-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* Step numbers header */
#step-header {
  height: 22px;
  min-height: 22px;
  display: flex;
  align-items: center;
  position: relative;
}

#step-numbers {
  display: flex;
  width: 100%;
  height: 100%;
}

.step-number {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Menlo', 'Consolas', monospace;
  font-size: 9px;
  color: var(--text-dim);
}

.step-number.beat-marker {
  color: var(--text-secondary);
}

/* Step grid */
#step-grid {
  flex: 1;
  display: flex;
  flex-direction: column;
  position: relative;
  padding: 0;
}

.step-row {
  flex: 1;
  display: flex;
  gap: 2px;
  padding: 1px 0;
}

.step-cell {
  flex: 1;
  background: var(--bg-cell);
  border-radius: 3px;
  cursor: pointer;
  transition: background 0.05s ease-out;
  position: relative;
  min-height: 0;
  border: 1px solid transparent;
}

.step-cell:hover {
  background: var(--bg-cell-hover);
}

.step-cell.on {
  border: 1px solid transparent;
}

.step-cell.accent {
  border: 2px solid var(--accent-glow);
}

/* Beat separator lines */
.step-cell.beat-start {
  margin-left: 2px;
}

/* Playback cursor overlay */
#playback-cursor {
  position: absolute;
  top: 0;
  bottom: 0;
  background: var(--cursor-color);
  border-radius: 2px;
  pointer-events: none;
  z-index: 10;
  transition: left 0.03s linear;
}

/* ===== GRAPH EDITOR ===== */
#graph-section {
  display: flex;
  border-top: 1px solid var(--grid-line);
}

#graph-label {
  width: 180px;
  min-width: 180px;
  height: 80px;
  background: var(--bg-secondary);
  border-right: 1px solid var(--grid-line);
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  justify-content: center;
  padding: 0 12px;
}

#graph-label .label-title {
  font-size: 9px;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 4px;
}

.graph-tabs {
  display: flex;
  gap: 4px;
}

.graph-tab {
  font-size: 9px;
  padding: 2px 6px;
  border-radius: 3px;
  border: none;
  cursor: pointer;
  background: transparent;
  color: var(--text-dim);
}

.graph-tab.active {
  background: var(--pattern-active);
  color: #fff;
}

#graph-editor {
  flex: 1;
  height: 80px;
  background: var(--bg-graph);
  display: flex;
  align-items: flex-end;
  gap: 2px;
  padding: 4px 0;
  position: relative;
}

.velocity-bar {
  flex: 1;
  background: rgba(99, 102, 241, 0.5);
  border-radius: 2px 2px 0 0;
  cursor: ns-resize;
  min-width: 0;
  transition: background 0.1s ease-out;
}

.velocity-bar:hover {
  filter: brightness(1.3);
}

/* ===== STATUS BAR ===== */
#status-bar {
  height: 28px;
  min-height: 28px;
  background: var(--bg-secondary);
  border-top: 1px solid var(--grid-line);
  display: flex;
  align-items: center;
  padding: 0 12px;
  gap: 24px;
  font-size: 10px;
}

.status-item {
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--text-secondary);
}

.status-item label {
  color: var(--text-dim);
}

.status-item .value {
  color: var(--text-primary);
  font-family: 'Menlo', 'Consolas', monospace;
  font-size: 11px;
}

#swing-slider {
  width: 80px;
  height: 4px;
  -webkit-appearance: none;
  appearance: none;
  background: var(--grid-line);
  border-radius: 2px;
  outline: none;
  cursor: pointer;
}

#swing-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 12px;
  height: 12px;
  background: var(--text-secondary);
  border-radius: 50%;
  cursor: pointer;
}

#swing-slider::-moz-range-thumb {
  width: 12px;
  height: 12px;
  background: var(--text-secondary);
  border-radius: 50%;
  cursor: pointer;
  border: none;
}

.status-spacer { flex: 1; }

#transport-btn {
  display: flex;
  align-items: center;
  gap: 4px;
  background: none;
  border: 1px solid var(--grid-beat);
  border-radius: 4px;
  padding: 2px 10px;
  cursor: pointer;
  color: var(--text-secondary);
  font-size: 10px;
  transition: border-color 0.15s;
}

#transport-btn:hover {
  border-color: var(--text-secondary);
}

#transport-btn.playing {
  border-color: #34D399;
  color: #34D399;
}

#transport-btn .play-icon {
  font-size: 10px;
}
</style>
</head>
<body>
<div id="app">

  <!-- TOOLBAR -->
  <div id="toolbar">
    <div class="brand">
      <div class="logo">WC</div>
      <div class="title">WAVE RACK</div>
    </div>
    <div class="pattern-group">
      <button class="pattern-btn active" data-pattern="0">A</button>
      <button class="pattern-btn" data-pattern="1">B</button>
      <button class="pattern-btn" data-pattern="2">C</button>
      <button class="pattern-btn" data-pattern="3">D</button>
    </div>
    <div class="toolbar-control">
      <label>Steps:</label>
      <select class="toolbar-select" id="step-count-select">
        <option value="16" selected>16</option>
        <option value="32">32</option>
      </select>
    </div>
    <div class="toolbar-control">
      <label>Res:</label>
      <select class="toolbar-select" id="resolution-select">
        <option value="1/8">1/8</option>
        <option value="1/16" selected>1/16</option>
        <option value="1/32">1/32</option>
        <option value="1/16T">1/16T</option>
      </select>
    </div>
  </div>

  <!-- MAIN AREA -->
  <div id="main-area">

    <!-- CHANNEL STRIP -->
    <div id="channel-strip">
      <div id="channel-header"><span>Channels</span></div>
      <div id="channel-rows"></div>
    </div>

    <!-- GRID AREA -->
    <div id="grid-area">
      <div id="step-header">
        <div id="step-numbers"></div>
      </div>
      <div id="step-grid">
        <div id="playback-cursor"></div>
      </div>
    </div>

  </div>

  <!-- GRAPH EDITOR -->
  <div id="graph-section">
    <div id="graph-label">
      <div class="label-title">Parameter</div>
      <div class="graph-tabs">
        <button class="graph-tab active">Velocity</button>
        <button class="graph-tab">Pitch</button>
        <button class="graph-tab">Length</button>
      </div>
    </div>
    <div id="graph-editor"></div>
  </div>

  <!-- STATUS BAR -->
  <div id="status-bar">
    <div class="status-item">
      <label>Swing:</label>
      <input type="range" id="swing-slider" min="50" max="100" value="50">
      <span id="swing-value" class="value">50%</span>
    </div>
    <div class="status-item">
      <label>BPM:</label>
      <span class="value">128</span>
    </div>
    <div class="status-item">
      <label>Ch:</label>
      <span class="value">8/32</span>
    </div>
    <div class="status-spacer"></div>
    <button id="transport-btn" class="playing">
      <span class="play-icon" id="transport-icon">&#9654;</span>
      <span id="transport-label">Playing</span>
    </button>
  </div>

</div>

<script>
// ===== DATA MODEL =====
const CHANNELS = [
  { name: 'Kick',      note: 'C1',  color: '#FF3B3B' },
  { name: 'Snare',     note: 'D1',  color: '#FFD93D' },
  { name: 'Closed HH', note: 'F#1', color: '#3B82F6' },
  { name: 'Open HH',   note: 'A#1', color: '#E0E0F0' },
  { name: 'Clap',      note: 'D#1', color: '#34D399' },
  { name: 'Rim',       note: 'C#2', color: '#A78BFA' },
  { name: 'Low Tom',   note: 'G1',  color: '#FB923C' },
  { name: 'Mid Tom',   note: 'B1',  color: '#F472B6' }
];

const NUM_STEPS = 16;
const NUM_PATTERNS = 4;

// step state: 0 = off, 1 = on, 2 = accent
// patterns[patternIndex][channelIndex][stepIndex] = 0|1|2
// velocity[patternIndex][channelIndex][stepIndex] = 0..127
let patterns = [];
let velocities = [];
for (let p = 0; p < NUM_PATTERNS; p++) {
  patterns[p] = [];
  velocities[p] = [];
  for (let c = 0; c < CHANNELS.length; c++) {
    patterns[p][c] = new Array(NUM_STEPS).fill(0);
    velocities[p][c] = new Array(NUM_STEPS).fill(100);
  }
}

// Pre-populate Pattern A with a basic beat
// Kick: 0, 4, 8, 12
[0, 4, 8, 12].forEach(s => { patterns[0][0][s] = 1; velocities[0][0][s] = 120; });
// Snare: 4, 12
[4, 12].forEach(s => { patterns[0][1][s] = 1; velocities[0][1][s] = 110; });
// Closed HH: 0, 2, 4, 6, 8, 10, 12, 14
[0, 2, 4, 6, 8, 10, 12, 14].forEach(s => { patterns[0][2][s] = 1; velocities[0][2][s] = 90; });
// Open HH: 7
[7].forEach(s => { patterns[0][3][s] = 1; velocities[0][3][s] = 100; });
// Clap: 4, 12 (accent)
[4, 12].forEach(s => { patterns[0][4][s] = 2; velocities[0][4][s] = 127; });

// State
let activePattern = 0;
let selectedChannel = 0;
let muteState = new Array(CHANNELS.length).fill(false);
let soloState = new Array(CHANNELS.length).fill(false);
let isPlaying = true;
let playbackStep = -1;
let playbackInterval = null;

// ===== RENDER CHANNEL STRIP =====
function renderChannelStrip() {
  const container = document.getElementById('channel-rows');
  container.innerHTML = '';
  CHANNELS.forEach((ch, i) => {
    const row = document.createElement('div');
    row.className = 'channel-row' + (i === selectedChannel ? ' selected' : '') + (muteState[i] ? ' muted' : '');
    row.dataset.channel = i;

    const colorBar = document.createElement('div');
    colorBar.className = 'channel-color-bar';
    colorBar.style.background = ch.color;

    const info = document.createElement('div');
    info.className = 'channel-info';

    const name = document.createElement('div');
    name.className = 'channel-name';
    name.textContent = ch.name;

    const note = document.createElement('div');
    note.className = 'channel-note';
    note.textContent = ch.note;

    info.appendChild(name);
    info.appendChild(note);

    const buttons = document.createElement('div');
    buttons.className = 'channel-buttons';

    const muteBtn = document.createElement('button');
    muteBtn.className = 'mute-btn' + (muteState[i] ? ' active' : '');
    muteBtn.textContent = 'M';
    muteBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      muteState[i] = !muteState[i];
      renderChannelStrip();
      renderStepGrid();
    });

    const soloBtn = document.createElement('button');
    soloBtn.className = 'solo-btn' + (soloState[i] ? ' active' : '');
    soloBtn.textContent = 'S';
    soloBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      soloState[i] = !soloState[i];
      renderChannelStrip();
    });

    buttons.appendChild(muteBtn);
    buttons.appendChild(soloBtn);

    row.appendChild(colorBar);
    row.appendChild(info);
    row.appendChild(buttons);

    row.addEventListener('click', () => {
      selectedChannel = i;
      renderChannelStrip();
      renderGraphEditor();
    });

    container.appendChild(row);
  });
}

// ===== RENDER STEP NUMBERS =====
function renderStepNumbers() {
  const container = document.getElementById('step-numbers');
  container.innerHTML = '';
  for (let s = 0; s < NUM_STEPS; s++) {
    const num = document.createElement('div');
    num.className = 'step-number';
    if (s % 4 === 0) {
      num.classList.add('beat-marker');
      num.textContent = (s / 4 + 1).toString();
    }
    container.appendChild(num);
  }
}

// ===== RENDER STEP GRID =====
function renderStepGrid() {
  const grid = document.getElementById('step-grid');
  // Preserve cursor
  const cursor = document.getElementById('playback-cursor');

  // Remove old rows only
  const oldRows = grid.querySelectorAll('.step-row');
  oldRows.forEach(r => r.remove());

  const pat = patterns[activePattern];
  CHANNELS.forEach((ch, ci) => {
    const row = document.createElement('div');
    row.className = 'step-row';

    for (let s = 0; s < NUM_STEPS; s++) {
      const cell = document.createElement('div');
      cell.className = 'step-cell';
      if (s % 4 === 0 && s > 0) cell.classList.add('beat-start');

      const state = pat[ci][s];
      if (state === 1) {
        cell.classList.add('on');
        cell.style.background = hexToRGBA(ch.color, 0.85);
        cell.style.borderColor = ch.color;
      } else if (state === 2) {
        cell.classList.add('accent');
        cell.style.background = ch.color;
        cell.style.borderColor = 'rgba(255, 255, 255, 0.35)';
      }

      if (muteState[ci]) {
        cell.style.opacity = '0.35';
      }

      cell.dataset.channel = ci;
      cell.dataset.step = s;

      cell.addEventListener('click', (e) => {
        handleStepClick(ci, s, e.shiftKey);
      });

      row.appendChild(cell);
    }
    grid.appendChild(row);
  });

  updateCursorPosition();
}

function handleStepClick(channel, step, isShift) {
  const pat = patterns[activePattern];
  const current = pat[channel][step];

  if (isShift) {
    // Shift+click: cycle to accent or off
    if (current === 2) {
      pat[channel][step] = 0;
      velocities[activePattern][channel][step] = 100;
    } else {
      pat[channel][step] = 2;
      velocities[activePattern][channel][step] = 127;
    }
  } else {
    // Normal click: toggle on/off
    if (current === 0) {
      pat[channel][step] = 1;
      velocities[activePattern][channel][step] = 100;
    } else {
      pat[channel][step] = 0;
      velocities[activePattern][channel][step] = 100;
    }
  }

  renderStepGrid();
  if (channel === selectedChannel) {
    renderGraphEditor();
  }
}

// ===== RENDER GRAPH EDITOR =====
function renderGraphEditor() {
  const container = document.getElementById('graph-editor');
  container.innerHTML = '';
  const ch = CHANNELS[selectedChannel];
  const vel = velocities[activePattern][selectedChannel];
  const pat = patterns[activePattern][selectedChannel];

  for (let s = 0; s < NUM_STEPS; s++) {
    const bar = document.createElement('div');
    bar.className = 'velocity-bar';

    const heightPct = (vel[s] / 127) * 100;
    bar.style.height = (pat[s] > 0 ? heightPct : 8) + '%';

    if (pat[s] > 0) {
      bar.style.background = hexToRGBA(ch.color, 0.6);
    } else {
      bar.style.background = hexToRGBA(ch.color, 0.15);
    }

    bar.dataset.step = s;

    // Click to set velocity
    bar.addEventListener('mousedown', (e) => {
      setVelocityFromMouse(e, s);
      const onMove = (me) => setVelocityFromMouse(me, s);
      const onUp = () => {
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
      };
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    });

    container.appendChild(bar);
  }
}

function setVelocityFromMouse(e, step) {
  const editor = document.getElementById('graph-editor');
  const rect = editor.getBoundingClientRect();
  const y = e.clientY - rect.top;
  const h = rect.height - 8; // account for padding
  let val = Math.round((1 - (y / h)) * 127);
  val = Math.max(0, Math.min(127, val));
  velocities[activePattern][selectedChannel][step] = val;

  // Ensure step is on if we set velocity
  if (val > 0 && patterns[activePattern][selectedChannel][step] === 0) {
    patterns[activePattern][selectedChannel][step] = 1;
    renderStepGrid();
  }

  renderGraphEditor();
}

// ===== PLAYBACK =====
function startPlayback() {
  if (playbackInterval) return;
  const bpm = 128;
  // 1/16 notes: (60000 / bpm) / 4 ms per step
  const msPerStep = (60000 / bpm) / 4;
  playbackStep = -1;
  playbackInterval = setInterval(() => {
    playbackStep = (playbackStep + 1) % NUM_STEPS;
    updateCursorPosition();
  }, msPerStep);
}

function stopPlayback() {
  if (playbackInterval) {
    clearInterval(playbackInterval);
    playbackInterval = null;
  }
  playbackStep = -1;
  updateCursorPosition();
}

function updateCursorPosition() {
  const cursor = document.getElementById('playback-cursor');
  if (playbackStep < 0 || !isPlaying) {
    cursor.style.display = 'none';
    return;
  }
  cursor.style.display = 'block';
  const grid = document.getElementById('step-grid');
  const rows = grid.querySelectorAll('.step-row');
  if (rows.length === 0) return;

  const cells = rows[0].querySelectorAll('.step-cell');
  if (cells.length === 0) return;

  const cell = cells[playbackStep];
  if (!cell) return;

  const gridRect = grid.getBoundingClientRect();
  const cellRect = cell.getBoundingClientRect();

  cursor.style.left = (cellRect.left - gridRect.left) + 'px';
  cursor.style.width = cellRect.width + 'px';
}

// ===== PATTERN SWITCHING =====
document.querySelectorAll('.pattern-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    activePattern = parseInt(btn.dataset.pattern);
    document.querySelectorAll('.pattern-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderStepGrid();
    renderGraphEditor();
  });
});

// ===== TRANSPORT =====
document.getElementById('transport-btn').addEventListener('click', () => {
  isPlaying = !isPlaying;
  const btn = document.getElementById('transport-btn');
  const icon = document.getElementById('transport-icon');
  const label = document.getElementById('transport-label');

  if (isPlaying) {
    btn.classList.add('playing');
    icon.innerHTML = '&#9654;';
    label.textContent = 'Playing';
    startPlayback();
  } else {
    btn.classList.remove('playing');
    icon.innerHTML = '&#9632;';
    label.textContent = 'Stopped';
    stopPlayback();
  }
});

// ===== SWING SLIDER =====
document.getElementById('swing-slider').addEventListener('input', (e) => {
  document.getElementById('swing-value').textContent = e.target.value + '%';
});

// ===== UTILITIES =====
function hexToRGBA(hex, alpha) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  return 'rgba(' + r + ', ' + g + ', ' + b + ', ' + alpha + ')';
}

// ===== WINDOW RESIZE HANDLER =====
window.addEventListener('resize', () => {
  updateCursorPosition();
});

// ===== INIT =====
function init() {
  renderChannelStrip();
  renderStepNumbers();
  renderStepGrid();
  renderGraphEditor();
  if (isPlaying) {
    startPlayback();
  }
}

init();
</script>
