<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=800">
<title>Wave Rack v3</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0E0B1A;
  --bg-glass: rgba(255, 255, 255, 0.04);
  --bg-glass-hover: rgba(255, 255, 255, 0.07);
  --bg-glass-strong: rgba(255, 255, 255, 0.08);
  --bg-cell: rgba(255, 255, 255, 0.045);
  --bg-cell-hover: rgba(255, 255, 255, 0.09);
  --border: rgba(255, 255, 255, 0.06);
  --border-strong: rgba(255, 255, 255, 0.1);
  --text: rgba(255, 255, 255, 0.85);
  --text-mid: rgba(255, 255, 255, 0.5);
  --text-dim: rgba(255, 255, 255, 0.25);
  --purple: #8B5CF6;
  --purple-dim: rgba(139, 92, 246, 0.3);
  --purple-glow: rgba(139, 92, 246, 0.15);
  --green-led: #4ADE80;
  --green-dim: rgba(74, 222, 128, 0.2);
  --mute-on: rgba(239, 68, 68, 0.8);
  --solo-on: rgba(234, 179, 8, 0.8);
  --cursor: rgba(139, 92, 246, 0.12);
  --gap: 6px;
}

html, body {
  width: 800px;
  height: 460px;
  overflow: hidden;
  background: var(--bg);
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  color: var(--text);
  user-select: none;
  -webkit-user-select: none;
}

#app {
  width: 800px;
  height: 460px;
  background: var(--bg);
  display: flex;
  flex-direction: column;
  padding: 6px;
  gap: 4px;
}

/* ===== TOOLBAR ===== */
#toolbar {
  height: 28px;
  min-height: 28px;
  background: var(--bg-glass);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-radius: 8px;
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 8px;
  gap: 6px;
}

.pattern-group { display: flex; gap: 2px; }

.pattern-btn {
  width: 24px;
  height: 20px;
  border: 1px solid transparent;
  border-radius: 5px;
  background: var(--bg-glass);
  color: var(--text-dim);
  font-size: 9px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s ease;
  letter-spacing: 0.3px;
}

.pattern-btn:hover { background: var(--bg-glass-hover); color: var(--text-mid); }

.pattern-btn.active {
  background: var(--purple-dim);
  color: var(--text);
  border-color: rgba(139, 92, 246, 0.3);
  box-shadow: 0 0 8px var(--purple-glow);
}

.sep {
  width: 1px;
  height: 14px;
  background: var(--border);
  margin: 0 2px;
}

.tb-ctrl {
  display: flex;
  align-items: center;
  gap: 3px;
}

.tb-ctrl label {
  font-size: 8px;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.8px;
}

.tb-select {
  height: 20px;
  padding: 0 4px;
  background: var(--bg-glass);
  color: var(--text-mid);
  border: 1px solid var(--border);
  border-radius: 5px;
  font-size: 9px;
  font-family: inherit;
  cursor: pointer;
  outline: none;
}

.tb-select:hover { border-color: var(--border-strong); }

.swing-ctrl {
  display: flex;
  align-items: center;
  gap: 3px;
}

.swing-ctrl label {
  font-size: 8px;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.8px;
}

#swing-slider {
  width: 50px;
  height: 2px;
  -webkit-appearance: none;
  appearance: none;
  background: var(--border);
  border-radius: 1px;
  outline: none;
  cursor: pointer;
}

#swing-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 8px;
  height: 8px;
  background: var(--purple);
  border-radius: 50%;
  cursor: pointer;
  box-shadow: 0 0 4px var(--purple-glow);
}

.swing-val {
  font-size: 8px;
  color: var(--text-dim);
  min-width: 20px;
  font-variant-numeric: tabular-nums;
}

.spacer { flex: 1; }

.bpm-display {
  font-size: 9px;
  color: var(--text-mid);
  font-variant-numeric: tabular-nums;
}

.bpm-display .num {
  color: var(--text);
  font-weight: 500;
}

#transport-btn {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: 5px;
  background: var(--bg-glass);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s ease;
}

#transport-btn:hover { background: var(--bg-glass-hover); }

#transport-btn .tri {
  width: 0; height: 0;
  border-left: 5px solid var(--text-dim);
  border-top: 3.5px solid transparent;
  border-bottom: 3.5px solid transparent;
  margin-left: 1px;
}

#transport-btn.playing {
  border-color: rgba(74, 222, 128, 0.3);
  box-shadow: 0 0 6px rgba(74, 222, 128, 0.1);
}

#transport-btn.playing .tri {
  border-left-color: var(--green-led);
}

/* ===== MAIN ===== */
#main {
  flex: 1;
  display: flex;
  gap: 4px;
  overflow: hidden;
}

/* ===== CHANNELS ===== */
#channels {
  width: 160px;
  min-width: 160px;
  background: var(--bg-glass);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-radius: 8px;
  border: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.ch-row {
  flex: 1;
  display: flex;
  align-items: center;
  padding: 0 6px;
  gap: 4px;
  border-bottom: 1px solid rgba(255,255,255,0.02);
  cursor: pointer;
  transition: background 0.1s ease;
  min-height: 0;
}

.ch-row:last-child { border-bottom: none; }
.ch-row:hover { background: rgba(255,255,255,0.02); }
.ch-row.selected { background: var(--purple-glow); }
.ch-row.muted { opacity: 0.25; }

.ch-led {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--green-dim);
  flex-shrink: 0;
  transition: all 0.15s ease;
}

.ch-led.on {
  background: var(--green-led);
  box-shadow: 0 0 4px rgba(74, 222, 128, 0.4);
}

.ch-name {
  flex: 1;
  font-size: 9px;
  font-weight: 500;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  letter-spacing: 0.2px;
}

.ch-note {
  font-size: 7px;
  color: var(--text-dim);
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.3px;
  flex-shrink: 0;
}

.ch-btns {
  display: flex;
  gap: 2px;
  flex-shrink: 0;
}

.ch-btn {
  width: 14px;
  height: 14px;
  border: none;
  border-radius: 3px;
  font-size: 6px;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(255,255,255,0.06);
  color: var(--text-dim);
  transition: all 0.1s ease;
  letter-spacing: 0;
}

.ch-btn:hover { background: rgba(255,255,255,0.1); }
.ch-btn.m-on { background: var(--mute-on); color: #fff; }
.ch-btn.s-on { background: var(--solo-on); color: #111; }

/* Fader */
.ch-fader {
  width: 22px;
  height: 3px;
  background: rgba(255,255,255,0.06);
  border-radius: 2px;
  position: relative;
  cursor: ew-resize;
  flex-shrink: 0;
  overflow: hidden;
}

.ch-fader-fill {
  position: absolute;
  top: 0; left: 0; bottom: 0;
  background: linear-gradient(90deg, var(--green-dim), var(--green-led));
  border-radius: 2px;
  pointer-events: none;
  opacity: 0.6;
}

/* ===== GRID ===== */
#grid-wrap {
  flex: 1;
  display: flex;
  flex-direction: column;
  background: var(--bg-glass);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-radius: 8px;
  border: 1px solid var(--border);
  overflow: hidden;
}

#step-hdr {
  height: 14px;
  min-height: 14px;
  display: flex;
  padding: 0 3px;
  border-bottom: 1px solid rgba(255,255,255,0.03);
}

.snum-grp {
  display: flex;
  flex: 1;
}

.snum-grp + .snum-grp { margin-left: var(--gap); }

.snum {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 7px;
  color: var(--text-dim);
  font-variant-numeric: tabular-nums;
}

.snum.beat { color: var(--text-mid); font-weight: 600; }

#grid {
  flex: 1;
  display: flex;
  flex-direction: column;
  position: relative;
  padding: 2px 3px;
}

.grid-row {
  flex: 1;
  display: flex;
  padding: 1px 0;
}

.cell-grp {
  display: flex;
  gap: 2px;
  flex: 1;
}

.cell-grp + .cell-grp { margin-left: var(--gap); }

/* Glass step cell */
.cell {
  flex: 1;
  min-height: 0;
  border-radius: 4px;
  cursor: pointer;
  position: relative;
  background: var(--bg-cell);
  border: 1px solid rgba(255, 255, 255, 0.03);
  transition: background 0.08s ease, box-shadow 0.08s ease;
}

.cell:hover {
  background: var(--bg-cell-hover);
  border-color: rgba(255, 255, 255, 0.06);
}

/* ON: channel color glow */
.cell.on {
  border-color: rgba(255, 255, 255, 0.08);
}

/* ACCENT: brighter glow */
.cell.accent {
  border-color: rgba(255, 255, 255, 0.15);
}

/* Cursor */
#cursor {
  position: absolute;
  top: 2px;
  bottom: 2px;
  background: var(--cursor);
  pointer-events: none;
  z-index: 10;
  border-radius: 4px;
  border: 1px solid rgba(139, 92, 246, 0.08);
}

/* ===== GRAPH ===== */
#graph-wrap {
  display: flex;
  gap: 4px;
  height: 50px;
}

#graph-side {
  width: 160px;
  min-width: 160px;
  background: var(--bg-glass);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-radius: 8px;
  border: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 0 8px;
}

#graph-side .g-title {
  font-size: 7px;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.8px;
  margin-bottom: 3px;
}

.g-tabs { display: flex; gap: 2px; }

.g-tab {
  font-size: 8px;
  padding: 2px 5px;
  border-radius: 4px;
  border: none;
  cursor: pointer;
  background: transparent;
  color: var(--text-dim);
  font-family: inherit;
  transition: all 0.1s ease;
}

.g-tab:hover { color: var(--text-mid); }

.g-tab.active {
  background: var(--purple-dim);
  color: var(--text);
}

#graph-bars {
  flex: 1;
  background: var(--bg-glass);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-radius: 8px;
  border: 1px solid var(--border);
  display: flex;
  align-items: flex-end;
  padding: 3px;
  gap: 0;
}

.vbar-grp {
  display: flex;
  gap: 1px;
  flex: 1;
  align-items: flex-end;
  height: 100%;
}

.vbar-grp + .vbar-grp { margin-left: var(--gap); }

.vbar {
  flex: 1;
  border-radius: 2px 2px 0 0;
  cursor: ns-resize;
  min-width: 0;
  min-height: 1px;
  transition: opacity 0.1s ease;
}

.vbar:hover { opacity: 0.9 !important; }

/* ===== STATUS ===== */
#status {
  height: 16px;
  min-height: 16px;
  display: flex;
  align-items: center;
  padding: 0 4px;
  gap: 12px;
}

.st-item {
  font-size: 7px;
  color: var(--text-dim);
  letter-spacing: 0.5px;
}

.st-item .v { color: var(--text-mid); }

.st-spacer { flex: 1; }
</style>
</head>
<body>
<div id="app">

  <div id="toolbar">
    <div class="pattern-group">
      <button class="pattern-btn active" data-p="0">A</button>
      <button class="pattern-btn" data-p="1">B</button>
      <button class="pattern-btn" data-p="2">C</button>
      <button class="pattern-btn" data-p="3">D</button>
    </div>
    <div class="sep"></div>
    <div class="tb-ctrl">
      <label>Steps</label>
      <select class="tb-select" id="sel-steps">
        <option value="16" selected>16</option>
        <option value="32">32</option>
      </select>
    </div>
    <div class="tb-ctrl">
      <label>Res</label>
      <select class="tb-select" id="sel-res">
        <option value="1/16" selected>1/16</option>
        <option value="1/8">1/8</option>
        <option value="1/32">1/32</option>
      </select>
    </div>
    <div class="sep"></div>
    <div class="swing-ctrl">
      <label>Swing</label>
      <input type="range" id="swing-slider" min="50" max="100" value="50">
      <span class="swing-val" id="swing-val">50%</span>
    </div>
    <div class="spacer"></div>
    <span class="bpm-display">BPM <span class="num">128</span></span>
    <div class="sep"></div>
    <button id="transport-btn" class="playing"><span class="tri"></span></button>
  </div>

  <div id="main">
    <div id="channels"></div>
    <div id="grid-wrap">
      <div id="step-hdr"></div>
      <div id="grid"><div id="cursor" style="display:none;"></div></div>
    </div>
  </div>

  <div id="graph-wrap">
    <div id="graph-side">
      <div class="g-title">Graph</div>
      <div class="g-tabs">
        <button class="g-tab active">Vel</button>
        <button class="g-tab">Pitch</button>
        <button class="g-tab">Len</button>
      </div>
    </div>
    <div id="graph-bars"></div>
  </div>

  <div id="status">
    <span class="st-item">Ch <span class="v">8/32</span></span>
    <span class="st-spacer"></span>
    <span class="st-item">Wave Rack v1.0</span>
  </div>

</div>

<script>
const CH = [
  { name:'Kick',      note:'C1',  color:'#FF3B3B' },
  { name:'Snare',     note:'D1',  color:'#FFD93D' },
  { name:'Closed HH', note:'F#1', color:'#3B82F6' },
  { name:'Open HH',   note:'A#1', color:'#C8C0E0' },
  { name:'Clap',      note:'D#1', color:'#34D399' },
  { name:'Rim',       note:'C#1', color:'#A78BFA' },
  { name:'Low Tom',   note:'F1',  color:'#FB923C' },
  { name:'Mid Tom',   note:'B1',  color:'#F472B6' }
];

const NS = 16, SPG = 4, NP = 4;
let pat = [], vel = [];
for (let p = 0; p < NP; p++) {
  pat[p] = []; vel[p] = [];
  for (let c = 0; c < CH.length; c++) {
    pat[p][c] = new Array(NS).fill(0);
    vel[p][c] = new Array(NS).fill(100);
  }
}

// Pattern A
[0,4,8,12].forEach(s => { pat[0][0][s]=1; vel[0][0][s]=120; });
[4,12].forEach(s => { pat[0][1][s]=1; vel[0][1][s]=110; });
[0,2,4,6,8,10,12,14].forEach(s => { pat[0][2][s]=1; vel[0][2][s]=90; });
[7].forEach(s => { pat[0][3][s]=1; vel[0][3][s]=100; });
[4,12].forEach(s => { pat[0][4][s]=2; vel[0][4][s]=127; });

let ap = 0, selCh = 0;
let muted = new Array(CH.length).fill(false);
let solod = new Array(CH.length).fill(false);
let chVol = new Array(CH.length).fill(100);
let playing = true, step = -1, timer = null;

function rgb(hex) {
  return { r:parseInt(hex.slice(1,3),16), g:parseInt(hex.slice(3,5),16), b:parseInt(hex.slice(5,7),16) };
}

// ===== CHANNELS =====
function renderCh() {
  const el = document.getElementById('channels');
  el.innerHTML = '';
  CH.forEach((c, i) => {
    const row = document.createElement('div');
    row.className = 'ch-row' + (i===selCh?' selected':'') + (muted[i]?' muted':'');

    const led = document.createElement('div');
    led.className = 'ch-led' + (pat[ap][i].some(s=>s>0)?' on':'');

    const name = document.createElement('div');
    name.className = 'ch-name';
    name.textContent = c.name;

    const note = document.createElement('div');
    note.className = 'ch-note';
    note.textContent = c.note;

    const btns = document.createElement('div');
    btns.className = 'ch-btns';

    const mb = document.createElement('div');
    mb.className = 'ch-btn' + (muted[i]?' m-on':'');
    mb.textContent = 'M';
    mb.onclick = (e) => { e.stopPropagation(); muted[i]=!muted[i]; renderCh(); renderGrid(); };

    const sb = document.createElement('div');
    sb.className = 'ch-btn' + (solod[i]?' s-on':'');
    sb.textContent = 'S';
    sb.onclick = (e) => { e.stopPropagation(); solod[i]=!solod[i]; renderCh(); };

    btns.appendChild(mb);
    btns.appendChild(sb);

    const fader = document.createElement('div');
    fader.className = 'ch-fader';
    const fill = document.createElement('div');
    fill.className = 'ch-fader-fill';
    fill.style.width = (chVol[i]/127*100)+'%';
    fader.appendChild(fill);

    fader.onmousedown = (e) => {
      e.stopPropagation();
      const set = (ev) => {
        const r = fader.getBoundingClientRect();
        let x = Math.max(0, Math.min(1, (ev.clientX-r.left)/r.width));
        chVol[i] = Math.round(x*127);
        fill.style.width = (x*100)+'%';
      };
      set(e);
      const mv = (ev) => set(ev);
      const up = () => { document.removeEventListener('mousemove',mv); document.removeEventListener('mouseup',up); };
      document.addEventListener('mousemove',mv);
      document.addEventListener('mouseup',up);
    };

    row.appendChild(led);
    row.appendChild(name);
    row.appendChild(note);
    row.appendChild(btns);
    row.appendChild(fader);

    row.onclick = () => { selCh=i; renderCh(); renderGraph(); };
    el.appendChild(row);
  });
}

// ===== STEP NUMBERS =====
function renderNums() {
  const el = document.getElementById('step-hdr');
  el.innerHTML = '';
  const ng = Math.ceil(NS/SPG);
  for (let g=0; g<ng; g++) {
    const grp = document.createElement('div');
    grp.className = 'snum-grp';
    for (let s=0; s<SPG; s++) {
      const idx = g*SPG+s;
      if (idx>=NS) break;
      const n = document.createElement('div');
      n.className = 'snum' + (s===0?' beat':'');
      if (s===0) n.textContent = (g+1);
      grp.appendChild(n);
    }
    el.appendChild(grp);
  }
}

// ===== GRID =====
function renderGrid() {
  const el = document.getElementById('grid');
  const cur = document.getElementById('cursor');
  el.querySelectorAll('.grid-row').forEach(r=>r.remove());

  const ng = Math.ceil(NS/SPG);
  CH.forEach((c, ci) => {
    const row = document.createElement('div');
    row.className = 'grid-row';

    for (let g=0; g<ng; g++) {
      const grp = document.createElement('div');
      grp.className = 'cell-grp';

      for (let s=0; s<SPG; s++) {
        const idx = g*SPG+s;
        if (idx>=NS) break;

        const cell = document.createElement('div');
        cell.className = 'cell';
        const st = pat[ap][ci][idx];
        const co = rgb(c.color);

        if (st === 1) {
          cell.classList.add('on');
          cell.style.background = 'rgba('+co.r+','+co.g+','+co.b+',0.35)';
          cell.style.boxShadow = 'inset 0 0 8px rgba('+co.r+','+co.g+','+co.b+',0.2), 0 0 4px rgba('+co.r+','+co.g+','+co.b+',0.1)';
          cell.style.borderColor = 'rgba('+co.r+','+co.g+','+co.b+',0.25)';
        } else if (st === 2) {
          cell.classList.add('accent');
          cell.style.background = 'rgba('+co.r+','+co.g+','+co.b+',0.55)';
          cell.style.boxShadow = 'inset 0 0 10px rgba('+co.r+','+co.g+','+co.b+',0.3), 0 0 8px rgba('+co.r+','+co.g+','+co.b+',0.2)';
          cell.style.borderColor = 'rgba('+co.r+','+co.g+','+co.b+',0.4)';
        }

        if (muted[ci]) cell.style.opacity = '0.2';

        cell.onclick = (e) => {
          const cur = pat[ap][ci][idx];
          if (e.shiftKey) {
            pat[ap][ci][idx] = cur===2?0:2;
            vel[ap][ci][idx] = cur===2?100:127;
          } else {
            pat[ap][ci][idx] = cur===0?1:0;
            vel[ap][ci][idx] = 100;
          }
          renderGrid(); renderCh();
          if (ci===selCh) renderGraph();
        };

        grp.appendChild(cell);
      }
      row.appendChild(grp);
    }
    el.appendChild(row);
  });
  updateCursor();
}

// ===== GRAPH =====
function renderGraph() {
  const el = document.getElementById('graph-bars');
  el.innerHTML = '';
  const c = rgb(CH[selCh].color);
  const ng = Math.ceil(NS/SPG);

  for (let g=0; g<ng; g++) {
    const grp = document.createElement('div');
    grp.className = 'vbar-grp';

    for (let s=0; s<SPG; s++) {
      const idx = g*SPG+s;
      if (idx>=NS) break;

      const bar = document.createElement('div');
      bar.className = 'vbar';
      const h = (vel[ap][selCh][idx]/127)*100;
      bar.style.height = (pat[ap][selCh][idx]>0 ? h : 5)+'%';

      if (pat[ap][selCh][idx]>0) {
        bar.style.background = 'rgba('+c.r+','+c.g+','+c.b+',0.6)';
        bar.style.boxShadow = '0 0 4px rgba('+c.r+','+c.g+','+c.b+',0.15)';
      } else {
        bar.style.background = 'rgba('+c.r+','+c.g+','+c.b+',0.1)';
      }

      bar.onmousedown = (e) => {
        const set = (ev) => {
          const r = el.getBoundingClientRect();
          let y = (ev.clientY-r.top)/(r.height-6);
          let v = Math.round((1-y)*127);
          v = Math.max(1, Math.min(127, v));
          vel[ap][selCh][idx] = v;
          if (v>0 && pat[ap][selCh][idx]===0) {
            pat[ap][selCh][idx]=1;
            renderGrid(); renderCh();
          }
          renderGraph();
        };
        set(e);
        const mv = (ev) => set(ev);
        const up = () => { document.removeEventListener('mousemove',mv); document.removeEventListener('mouseup',up); };
        document.addEventListener('mousemove',mv);
        document.addEventListener('mouseup',up);
      };

      grp.appendChild(bar);
    }
    el.appendChild(grp);
  }
}

// ===== PLAYBACK =====
function startPlay() {
  if (timer) return;
  step = -1;
  timer = setInterval(() => { step=(step+1)%NS; updateCursor(); }, (60000/128)/4);
}

function stopPlay() {
  if (timer) { clearInterval(timer); timer=null; }
  step = -1; updateCursor();
}

function updateCursor() {
  const cur = document.getElementById('cursor');
  if (step<0 || !playing) { cur.style.display='none'; return; }
  cur.style.display='block';
  const rows = document.querySelectorAll('.grid-row');
  if (!rows.length) return;
  const gIdx = Math.floor(step/SPG), sIdx = step%SPG;
  const grps = rows[0].querySelectorAll('.cell-grp');
  if (!grps[gIdx]) return;
  const cells = grps[gIdx].querySelectorAll('.cell');
  if (!cells[sIdx]) return;
  const gr = document.getElementById('grid').getBoundingClientRect();
  const cr = cells[sIdx].getBoundingClientRect();
  cur.style.left = (cr.left-gr.left)+'px';
  cur.style.width = cr.width+'px';
}

// ===== EVENTS =====
document.querySelectorAll('.pattern-btn').forEach(b => {
  b.onclick = () => {
    ap = parseInt(b.dataset.p);
    document.querySelectorAll('.pattern-btn').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    renderGrid(); renderCh(); renderGraph();
  };
});

document.getElementById('transport-btn').onclick = () => {
  playing = !playing;
  const btn = document.getElementById('transport-btn');
  if (playing) { btn.classList.add('playing'); startPlay(); }
  else { btn.classList.remove('playing'); stopPlay(); }
};

document.getElementById('swing-slider').oninput = (e) => {
  document.getElementById('swing-val').textContent = e.target.value+'%';
};

window.onresize = updateCursor;

// INIT
renderCh(); renderNums(); renderGrid(); renderGraph();
if (playing) startPlay();
</script>
</body>
</html>
