<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=820">
<title>Terrain v2.0 — Light Mode (Revised) Preview</title>
<style>
/* ============ RESET & TOKENS ============ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg-main: #F0EDF4;
  --bg-hero: #1A1525;
  --bg-surface: #EDE9F3;
  --bg-footer: #E8E4F0;
  --bg-glass: rgba(228,223,237,0.90);
  --bg-card: #E4DFE9;
  --bg-card-hover: #DDD7E3;
  --purple-600: #7C5CBF;
  --purple-500: #8B5CF6;
  --purple-400: #A78BFA;
  --border: rgba(124,92,191,0.12);
  --border-strong: rgba(124,92,191,0.20);
  --text-primary: #2A2035;
  --text-secondary: #5C5068;
  --text-muted: #8A7F96;
  --text-dim: #A89BBE;
  --accent-active: #FF7733;
  --knob-inactive: #D0C8DD;
  --knob-active: #7C5CBF;
  --knob-body: #EDE9F3;
  --mesh-line: rgba(139,92,246,0.3);
  --mesh-contour: rgba(167,139,250,0.55);
  --mesh-peak: rgba(124,58,237,0.8);
}

body {
  background: #888;
  font-family: -apple-system, 'SF Pro Display', 'Inter', 'Segoe UI', system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  user-select: none;
  -webkit-user-select: none;
}

#plugin {
  width: 820px;
  height: 640px;
  background: var(--bg-main);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  position: relative;
  box-shadow: 0 8px 40px rgba(0,0,0,0.35);
  border-radius: 4px;
}

/* ============ HEADER (44px) ============ */
#header {
  height: 44px;
  display: flex;
  align-items: center;
  padding: 0 16px;
  background: var(--bg-surface);
  border-bottom: 1px solid rgba(124,92,191,0.15);
  position: relative;
  z-index: 20;
  flex-shrink: 0;
}

.header-left {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 220px;
  flex-shrink: 0;
}

.brand-logo {
  width: 30px;
  height: 30px;
  border-radius: 6px;
  background: linear-gradient(135deg, #7B4DDF 0%, #A78BFA 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.brand-logo-inner {
  width: 16px;
  height: 16px;
  border: 2px solid rgba(255,255,255,0.9);
  border-radius: 3px;
  position: relative;
}
.brand-logo-inner::after {
  content: '';
  position: absolute;
  top: 2px; left: 2px; right: 2px; bottom: 2px;
  border: 1px solid rgba(255,255,255,0.6);
  border-radius: 1px;
}

.brand-name {
  font-weight: 600;
  font-size: 18px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--text-primary);
}

.brand-version {
  font-size: 10px;
  letter-spacing: 1.5px;
  color: var(--text-muted);
  margin-left: -2px;
  padding-top: 3px;
}

.preset-area {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

.preset-nav-btn {
  width: 24px;
  height: 24px;
  border: 1px solid var(--knob-inactive);
  border-radius: 4px;
  background: transparent;
  color: var(--text-secondary);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  transition: all 0.1s;
}
.preset-nav-btn:hover {
  border-color: var(--purple-600);
  color: var(--purple-600);
}

.preset-name {
  font-weight: 500;
  font-size: 12px;
  letter-spacing: 0.5px;
  color: var(--text-primary);
  min-width: 140px;
  text-align: center;
  cursor: pointer;
}

.preset-grid-btn {
  width: 28px;
  height: 28px;
  border: 1px solid var(--knob-inactive);
  border-radius: 5px;
  background: transparent;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}

.header-right {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 6px;
  width: 220px;
  flex-shrink: 0;
}

.preset-save-btn {
  width: 28px;
  height: 28px;
  border: 1px solid var(--knob-inactive);
  border-radius: 5px;
  background: transparent;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-secondary);
  font-size: 14px;
}

.mod-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 3px 10px;
  border-radius: 12px;
  border: 1.5px solid rgba(123,77,223,0.2);
  background: transparent;
  cursor: pointer;
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--text-secondary);
  margin-left: 8px;
  transition: all 0.2s ease;
}
.mod-btn:hover {
  border-color: rgba(123,77,223,0.4);
  color: var(--purple-600);
}
.mod-btn.active {
  background: var(--purple-600);
  border-color: var(--purple-600);
  color: #fff;
}

/* ============ HERO / VISUALIZATION (276px) ============ */
#hero {
  height: 276px;
  background: var(--bg-hero);
  position: relative;
  cursor: crosshair;
  flex-shrink: 0;
  overflow: hidden;
}

#terrain-canvas {
  display: block;
  width: 100%;
  height: 100%;
}

.xy-readout {
  position: absolute;
  bottom: 8px;
  left: 12px;
  font-family: 'SF Mono', 'Menlo', 'Monaco', 'Consolas', monospace;
  font-size: 9px;
  font-weight: 500;
  color: var(--purple-400);
  background: rgba(26,26,46,0.7);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  padding: 3px 8px;
  border-radius: 3px;
  border: 1px solid rgba(139,92,246,0.15);
}

.scope-controls-left {
  position: absolute;
  top: 8px;
  left: 8px;
  display: flex;
  gap: 4px;
  z-index: 5;
}

.scope-btn {
  width: 28px;
  height: 28px;
  border: 1px solid rgba(139,92,246,0.25);
  border-radius: 5px;
  background: rgba(26,26,46,0.6);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--purple-400);
  font-size: 12px;
}

.xy-controls {
  position: absolute;
  top: 8px;
  right: 8px;
  display: flex;
  gap: 4px;
}

.xy-ctrl-btn {
  width: 24px;
  height: 24px;
  border: 1px solid rgba(139,92,246,0.25);
  border-radius: 4px;
  background: rgba(26,26,46,0.6);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--purple-400);
  font-size: 10px;
}
.xy-ctrl-btn.active {
  background: rgba(139,92,246,0.2);
  border-color: var(--purple-500);
  color: #fff;
}

.xy-speed-wrap {
  width: 24px;
  height: 24px;
  cursor: grab;
  border-radius: 50%;
  background: rgba(26,26,46,0.6);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(139,92,246,0.25);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--purple-400);
  font-size: 8px;
}

.crosshair-h, .crosshair-v {
  position: absolute;
  background: rgba(139,92,246,0.3);
  pointer-events: none;
}
.crosshair-h { height: 1px; left: 0; right: 0; top: 50%; }
.crosshair-v { width: 1px; top: 0; bottom: 0; left: 50%; }

/* XY dot */
.xy-dot {
  position: absolute;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--purple-500);
  box-shadow: 0 0 12px rgba(139,92,246,0.6), 0 0 24px rgba(139,92,246,0.3);
  transform: translate(-50%, -50%);
  top: 50%;
  left: 50%;
  pointer-events: none;
}

/* Tooltip in viz area */
#tooltip {
  position: absolute;
  z-index: 25;
  width: 220px;
  bottom: 10px;
  right: 10px;
  background: rgba(26,26,46,0.85);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(139,92,246,0.2);
  border-radius: 8px;
  padding: 10px 12px;
  pointer-events: none;
}
.tooltip-title {
  font-size: 9px;
  font-weight: 500;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--purple-400);
  margin-bottom: 4px;
}
.tooltip-desc {
  font-size: 10px;
  color: rgba(255,255,255,0.6);
  line-height: 1.5;
  margin-bottom: 8px;
}
.tooltip-bar-wrap {
  height: 3px;
  background: rgba(139,92,246,0.2);
  border-radius: 2px;
  overflow: hidden;
  margin-bottom: 3px;
}
.tooltip-bar {
  height: 100%;
  background: var(--purple-500);
  border-radius: 2px;
  width: 62%;
}
.tooltip-pct {
  font-family: 'SF Mono', monospace;
  font-size: 8px;
  color: rgba(167,139,250,0.6);
  text-align: right;
}

/* ============ CONTROLS (272px) ============ */
#controls {
  height: 272px;
  display: flex;
  flex-shrink: 0;
  border-top: none;
}

.control-section {
  flex: 1;
  display: flex;
  flex-direction: column;
  padding: 10px 12px 6px;
  background: var(--bg-main);
  overflow: hidden;
}
.control-section:first-child {
  border-right: 1px solid rgba(124,92,191,0.15);
}

.section-header {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 10px;
  padding: 2px 0;
}

.section-toggle-btn {
  width: 30px;
  height: 30px;
  border-radius: 8px;
  border: 1.5px solid var(--purple-400);
  background: var(--bg-card);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  flex-shrink: 0;
  padding: 0;
  box-shadow: 0 1px 4px rgba(0,0,0,0.08);
}

.section-label {
  font-weight: 500;
  font-size: 9px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--text-secondary);
}

/* Knobs container */
.knobs-container {
  flex: 1;
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  align-items: flex-start;
  align-content: center;
  gap: 4px 8px;
  overflow: hidden;
}

.knob-group {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 80px;
  gap: 2px;
}

.knob-canvas-wrap {
  position: relative;
  width: 56px;
  height: 56px;
  cursor: grab;
}

.knob-value {
  font-family: 'SF Mono', 'Menlo', 'Monaco', 'Consolas', monospace;
  font-weight: 500;
  font-size: 10px;
  color: var(--text-primary);
  text-align: center;
  line-height: 14px;
}

.knob-label {
  font-size: 8px;
  font-weight: 500;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--text-muted);
  text-align: center;
}

/* ============ TAPE SUBTABS & FX NAV ============ */
.tape-subtabs {
  display: flex;
  gap: 2px;
  margin-left: 8px;
}

.tape-subtab {
  font-size: 8px;
  font-weight: 600;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  font-family: inherit;
  padding: 3px 8px;
  border-radius: 4px;
  border: 1px solid var(--knob-inactive);
  background: transparent;
  color: var(--text-dim);
  cursor: pointer;
}
.tape-subtab.active {
  background: rgba(123,77,223,0.12);
  color: var(--text-primary);
  border-color: rgba(123,77,223,0.25);
}

.fx-page-nav {
  display: flex;
  align-items: center;
  gap: 4px;
  margin-left: 4px;
}
.fx-nav-arrow {
  width: 16px;
  height: 16px;
  border-radius: 50%;
  border: 1px solid rgba(123,77,223,0.25);
  background: transparent;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-size: 7px;
  color: var(--text-muted);
  padding: 0;
  line-height: 1;
}
.fx-nav-arrow:hover {
  border-color: var(--purple-600);
  color: var(--purple-600);
  background: rgba(123,77,223,0.06);
}
.fx-page-label {
  font-size: 8px;
  letter-spacing: 1.2px;
  text-transform: uppercase;
  color: var(--purple-600);
  font-weight: 600;
  min-width: 30px;
  text-align: center;
}

/* Tape FX page */
.tape-fx-page {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  height: 100%;
  padding: 2px 0;
}

.tape-viz-row {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 0;
  position: relative;
  width: 100%;
}

.tape-mechanism-wrap {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 0;
  height: 100%;
}

.machine-nav-arrow {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  background: none;
  border: none;
  cursor: pointer;
  font-size: 12px;
  color: var(--text-muted);
  padding: 6px 2px;
  line-height: 1;
  z-index: 2;
}
#machPrev { right: 100%; margin-right: 2px; }
#machNext { left: 100%; margin-left: 2px; }
.machine-nav-arrow:hover { color: var(--purple-600); }

.tape-fx-knobs {
  display: flex;
  justify-content: center;
  gap: 16px;
  padding: 8px 0 4px;
}

/* FX knob groups */
.fx-knob-group {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1px;
}
.fx-knob-value {
  font-size: 9px;
  color: var(--text-primary);
  font-weight: 500;
  text-align: center;
  font-family: 'SF Mono', monospace;
}
.fx-knob-label {
  font-size: 7px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--text-muted);
  font-weight: 600;
}

/* ============ FOOTER (48px) ============ */
#footer {
  height: 48px;
  display: flex;
  align-items: center;
  padding: 0 16px;
  background: var(--bg-footer);
  border-top: 1px solid rgba(124,92,191,0.15);
  flex-shrink: 0;
  gap: 12px;
}

.output-label {
  font-size: 9px;
  font-weight: 500;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--text-secondary);
  flex-shrink: 0;
}

.output-slider-wrap {
  flex: 1;
  height: 6px;
  background: var(--knob-inactive);
  border-radius: 3px;
  cursor: pointer;
  position: relative;
}
.output-slider-fill {
  position: absolute;
  left: 0;
  top: 0;
  height: 100%;
  background: var(--purple-600);
  border-radius: 3px;
  width: 70%;
}
.output-slider-thumb {
  position: absolute;
  top: 50%;
  left: 70%;
  width: 14px;
  height: 14px;
  background: var(--bg-surface);
  border: 2px solid var(--purple-600);
  border-radius: 50%;
  transform: translate(-50%, -50%);
  cursor: grab;
  box-shadow: 0 1px 3px rgba(42,32,53,0.08);
}

.output-value {
  font-family: 'SF Mono', 'Menlo', monospace;
  font-weight: 500;
  font-size: 10px;
  color: var(--text-primary);
  min-width: 52px;
  text-align: right;
  flex-shrink: 0;
}

.output-meters {
  display: flex;
  align-items: center;
  gap: 3px;
  flex-shrink: 0;
}

.meter-channel {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1px;
}

.meter-label {
  font-size: 7px;
  font-weight: 500;
  color: var(--text-dim);
}

.meter-bar-wrap {
  width: 4px;
  height: 24px;
  background: var(--knob-inactive);
  border-radius: 2px;
  overflow: hidden;
  position: relative;
}

.meter-bar {
  position: absolute;
  bottom: 0;
  width: 100%;
  background: var(--purple-400);
  border-radius: 2px;
}

.meter-rms {
  font-family: 'SF Mono', monospace;
  font-size: 7px;
  color: var(--text-dim);
  margin-left: 4px;
  flex-shrink: 0;
}

.footer-divider {
  width: 1px;
  height: 24px;
  background: rgba(124,92,191,0.15);
  flex-shrink: 0;
}

.master-mix-group {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}

.master-mix-label {
  font-size: 9px;
  font-weight: 500;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--text-secondary);
  white-space: nowrap;
}

.master-mix-value {
  font-family: 'SF Mono', monospace;
  font-weight: 500;
  font-size: 10px;
  color: var(--text-primary);
  min-width: 36px;
  text-align: right;
}

.footer-brand {
  font-size: 8px;
  color: var(--text-muted);
  letter-spacing: 0.5px;
  margin-left: auto;
  flex-shrink: 0;
}

/* ============ MODULATION PANEL (272px, replaces controls) ============ */
#mod-panel {
  display: none;
  width: 820px;
  height: 272px;
  flex-shrink: 0;
  background: var(--bg-surface);
  z-index: 15;
}
#mod-panel.open { display: flex; }

.lfo-column {
  flex: 1;
  display: flex;
  flex-direction: column;
  padding: 10px 12px;
  gap: 6px;
  overflow: hidden;
}
.lfo-column + .lfo-column {
  border-left: 1px solid rgba(124,92,191,0.15);
}

.lfo-header {
  display: flex;
  align-items: center;
  gap: 6px;
}
.lfo-color-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  flex-shrink: 0;
}
.lfo-label {
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--text-secondary);
}

.lfo-waveform {
  width: 100%;
  height: 50px;
  border-radius: 6px;
  background: var(--bg-hero);
  border: 1px solid rgba(139,92,246,0.15);
  flex-shrink: 0;
  overflow: hidden;
}

.lfo-shapes {
  display: flex;
  gap: 3px;
  flex-shrink: 0;
  justify-content: center;
}
.shape-btn {
  flex: 1;
  height: 22px;
  border-radius: 4px;
  border: 1px solid var(--knob-inactive);
  background: var(--bg-card);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 8px;
  color: var(--text-dim);
  box-shadow: 0 1px 2px rgba(0,0,0,0.04);
}
.shape-btn.active {
  border-color: var(--purple-600);
  background: rgba(123,77,223,0.08);
  color: var(--purple-600);
  font-weight: 600;
}

.lfo-knobs-row {
  display: flex;
  align-items: flex-start;
  gap: 4px;
  flex-shrink: 0;
  width: 100%;
  justify-content: center;
}

.lfo-controls-row {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
  width: 100%;
}

.rate-sync-toggle {
  display: flex;
  flex: 1;
  border-radius: 6px;
  border: 1px solid var(--knob-inactive);
  overflow: hidden;
}
.rate-sync-opt {
  flex: 1;
  padding: 2px 6px;
  font-size: 7px;
  font-weight: 600;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  text-align: center;
  color: var(--text-muted);
  cursor: pointer;
  background: transparent;
  border: none;
}
.rate-sync-opt.active {
  background: var(--purple-600);
  color: #fff;
}

.polarity-pills {
  display: flex;
  flex: 1;
  border-radius: 6px;
  border: 1px solid var(--knob-inactive);
  overflow: hidden;
}
.polarity-opt {
  flex: 1;
  padding: 2px 7px;
  font-size: 8px;
  font-weight: 600;
  text-align: center;
  color: var(--text-muted);
  cursor: pointer;
  background: transparent;
  border: none;
}
.polarity-opt.active {
  background: var(--purple-600);
  color: #fff;
}

.lfo-targets {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.lfo-target-row {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 2px 6px;
  border-radius: 4px;
  background: var(--bg-main);
  font-size: 8px;
}
.lfo-target-name {
  flex: 1;
  color: var(--text-primary);

<script>
// ============================================================
// CANVAS RENDERING — All visual elements drawn via Canvas API
// ============================================================

const dpr = window.devicePixelRatio || 1;

function setupCanvas(canvas, w, h) {
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  return ctx;
}

// ---- Color palette ----
const C = {
  knobInactive: '#D0C8DD',
  knobActive: '#7C5CBF',
  knobBody: '#EDE9F3',
  textPrimary: '#2A2035',
  textMuted: '#8A7F96',
  textDim: '#A89BBE',
  purple500: '#8B5CF6',
  purple400: '#A78BFA',
  purple600: '#7C5CBF',
  heroGrad1: '#1A1A2E',
  heroGrad2: '#16162A',
  lfoColors: ['#8B5CF6', '#06B6D4', '#F59E0B'],
};

// ============ DRAW KNOB ============
function drawKnob(canvas, value, label, valueText, size, opts) {
  size = size || 56;
  opts = opts || {};
  const ctx = setupCanvas(canvas, size, size);
  const cx = size / 2, cy = size / 2;
  const outerR = size * 0.44;
  const innerR = size * 0.32;
  const lineWidth = size * 0.065;

  // Arc geometry — 270 degree sweep starting at 135 degrees (0.75 PI)
  const startAngle = Math.PI * 0.75;
  const endAngle = Math.PI * 2.25;
  const valueAngle = startAngle + (endAngle - startAngle) * value;

  // Track arc (inactive)
  ctx.beginPath();
  ctx.arc(cx, cy, outerR, startAngle, endAngle, false);
  ctx.strokeStyle = C.knobInactive;
  ctx.lineWidth = lineWidth;
  ctx.lineCap = 'round';
  ctx.stroke();

  // Value arc (active)
  if (value > 0.01) {
    ctx.beginPath();
    ctx.arc(cx, cy, outerR, startAngle, valueAngle, false);
    ctx.strokeStyle = opts.arcColor || C.knobActive;
    ctx.lineWidth = lineWidth;
    ctx.lineCap = 'round';
    ctx.stroke();
  }

  // Knob body (white circle with shadow)
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,0.12)';
  ctx.shadowBlur = 4;
  ctx.shadowOffsetY = 1;
  ctx.beginPath();
  ctx.arc(cx, cy, innerR, 0, Math.PI * 2);
  ctx.fillStyle = C.knobBody;
  ctx.fill();
  ctx.restore();

  // Subtle border
  ctx.beginPath();
  ctx.arc(cx, cy, innerR, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(124,92,191,0.12)';
  ctx.lineWidth = 0.5;
  ctx.stroke();

  // Value text inside knob
  if (valueText) {
    ctx.fillStyle = C.textPrimary;
    ctx.font = `500 ${Math.round(size * 0.17)}px -apple-system, 'SF Pro Display', system-ui, sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(valueText, cx, cy);
  }

  // Indicator notch
  const notchAngle = valueAngle;
  const notchInner = innerR - 2;
  const notchOuter = innerR + 1;
  ctx.beginPath();
  ctx.moveTo(cx + Math.cos(notchAngle) * notchInner, cy + Math.sin(notchAngle) * notchInner);
  ctx.lineTo(cx + Math.cos(notchAngle) * notchOuter, cy + Math.sin(notchAngle) * notchOuter);
  ctx.strokeStyle = opts.arcColor || C.knobActive;
  ctx.lineWidth = 2;
  ctx.lineCap = 'round';
  ctx.stroke();
}

// ============ DRAW MINI KNOB (for mod panel) ============
function drawMiniKnob(canvas, value, size, color) {
  size = size || 42;
  const ctx = setupCanvas(canvas, size, size);
  const cx = size / 2, cy = size / 2;
  const outerR = size * 0.42;
  const innerR = size * 0.28;
  const lw = size * 0.07;

  const startAngle = Math.PI * 0.75;
  const endAngle = Math.PI * 2.25;
  const valueAngle = startAngle + (endAngle - startAngle) * value;

  ctx.beginPath();
  ctx.arc(cx, cy, outerR, startAngle, endAngle, false);
  ctx.strokeStyle = C.knobInactive;
  ctx.lineWidth = lw;
  ctx.lineCap = 'round';
  ctx.stroke();

  if (value > 0.01) {
    ctx.beginPath();
    ctx.arc(cx, cy, outerR, startAngle, valueAngle, false);
    ctx.strokeStyle = color || C.knobActive;
    ctx.lineWidth = lw;
    ctx.lineCap = 'round';
    ctx.stroke();
  }

  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,0.1)';
  ctx.shadowBlur = 3;
  ctx.shadowOffsetY = 1;
  ctx.beginPath();
  ctx.arc(cx, cy, innerR, 0, Math.PI * 2);
  ctx.fillStyle = '#EDE9F3';
  ctx.fill();
  ctx.restore();

  ctx.beginPath();
  ctx.arc(cx, cy, innerR, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(124,92,191,0.12)';
  ctx.lineWidth = 0.5;
  ctx.stroke();
}

// ============ TERRAIN MESH VISUALIZATION ============
let terrainPhase = 0;

function drawTerrain() {
  const canvas = document.getElementById('terrain-canvas');
  const rect = canvas.parentElement.getBoundingClientRect();
  const w = rect.width;
  const h = rect.height;
  const ctx = setupCanvas(canvas, w, h);

  terrainPhase += 0.008;

  // Dark background gradient
  const bgGrad = ctx.createLinearGradient(0, 0, 0, h);
  bgGrad.addColorStop(0, '#1A1A2E');
  bgGrad.addColorStop(0.5, '#16162A');
  bgGrad.addColorStop(1, '#1A1A2E');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, w, h);

  // Subtle radial glow behind mesh
  const radGrad = ctx.createRadialGradient(w * 0.5, h * 0.45, 0, w * 0.5, h * 0.45, w * 0.5);
  radGrad.addColorStop(0, 'rgba(123,77,223,0.08)');
  radGrad.addColorStop(0.5, 'rgba(123,77,223,0.03)');
  radGrad.addColorStop(1, 'transparent');
  ctx.fillStyle = radGrad;
  ctx.fillRect(0, 0, w, h);

  // Terrain mesh — perspective wireframe
  const gridX = 28;
  const gridY = 18;
  const perspective = 0.55;
  const baseY = h * 0.55;
  const amplitude = h * 0.22;

  // Generate heightmap
  const heights = [];
  for (let gy = 0; gy <= gridY; gy++) {
    heights[gy] = [];
    for (let gx = 0; gx <= gridX; gx++) {
      const nx = gx / gridX;
      const ny = gy / gridY;
      const d = Math.sqrt((nx - 0.5) * (nx - 0.5) + (ny - 0.5) * (ny - 0.5));

      let height = 0;
      height += Math.sin(nx * 4 + terrainPhase * 1.2) * 0.3;
      height += Math.sin(ny * 3 + terrainPhase * 0.8) * 0.25;
      height += Math.sin((nx + ny) * 5 + terrainPhase * 1.5) * 0.2;
      height += Math.cos(nx * 7 - terrainPhase * 0.6) * Math.sin(ny * 6 + terrainPhase * 0.4) * 0.25;

      // Center peak
      const peakInfluence = Math.max(0, 1 - d * 2.8);
      height += peakInfluence * 0.8 * (0.8 + 0.2 * Math.sin(terrainPhase * 2));

      // Edge falloff
      const edgeFade = Math.min(nx * 4, (1 - nx) * 4, ny * 3, (1 - ny) * 3, 1);
      height *= edgeFade;

      heights[gy][gx] = height;
    }
  }

  // Project 3D to 2D with perspective
  function project(gx, gy) {
    const nx = gx / gridX;
    const ny = gy / gridY;
    const h_val = heights[gy][gx];

    const x = (nx - 0.5) * w * 0.85;
    const depth = ny;
    const scale = 0.5 + depth * perspective;
    const px = w / 2 + x * scale;
    const py = baseY + (ny - 0.5) * h * 0.5 * scale - h_val * amplitude * scale;
    return { x: px, y: py, h: h_val };
  }

  // Draw grid lines back to front
  for (let gy = 0; gy <= gridY; gy++) {
    const depth = gy / gridY;
    const baseAlpha = 0.12 + depth * 0.25;

    // Horizontal lines
    ctx.beginPath();
    for (let gx = 0; gx <= gridX; gx++) {
      const p = project(gx, gy);
      if (gx === 0) ctx.moveTo(p.x, p.y);
      else ctx.lineTo(p.x, p.y);
    }
    ctx.strokeStyle = `rgba(139,92,246,${baseAlpha})`;
    ctx.lineWidth = 0.6 + depth * 0.4;
    ctx.stroke();
  }

  // Vertical lines
  for (let gx = 0; gx <= gridX; gx++) {
    ctx.beginPath();
    for (let gy = 0; gy <= gridY; gy++) {
      const p = project(gx, gy);
      if (gy === 0) ctx.moveTo(p.x, p.y);
      else ctx.lineTo(p.x, p.y);
    }
    const nx = gx / gridX;
    const alpha = 0.08 + 0.15 * (1 - Math.abs(nx - 0.5) * 2);
    ctx.strokeStyle = `rgba(167,139,250,${alpha})`;
    ctx.lineWidth = 0.4;
    ctx.stroke();
  }

  // Glow on peaks — draw bright dots at high points
  for (let gy = 1; gy < gridY; gy += 2) {
    for (let gx = 1; gx < gridX; gx += 2) {
      const p = project(gx, gy);
      if (p.h > 0.35) {
        const glowAlpha = (p.h - 0.35) * 1.2;
        const glowR = 2 + p.h * 4;
        const glow = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, glowR);
        glow.addColorStop(0, `rgba(167,139,250,${glowAlpha * 0.5})`);
        glow.addColorStop(1, 'transparent');
        ctx.fillStyle = glow;
        ctx.fillRect(p.x - glowR, p.y - glowR, glowR * 2, glowR * 2);
      }
    }
  }

  // Contour highlights at regular height intervals
  for (let gy = 0; gy < gridY; gy++) {
    for (let gx = 0; gx < gridX; gx++) {
      const p1 = project(gx, gy);
      const p2 = project(gx + 1, gy);
      const avgH = (p1.h + p2.h) / 2;
      if (avgH > 0.45) {
        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.strokeStyle = `rgba(124,58,237,${(avgH - 0.45) * 0.8})`;
        ctx.lineWidth = 1.2;
        ctx.stroke();
      }
    }
  }

  requestAnimationFrame(drawTerrain);
}

// ============ TAPE MACHINE ILLUSTRATION ============
function drawTapeMachine() {
  const canvas = document.getElementById('tapeMechCanvas');
  const mechWrap = canvas.parentElement;
  const parentH = mechWrap.parentElement.clientHeight;
  const vizH = Math.min(parentH, 130);
  const vizW = 200;
  const ctx = setupCanvas(canvas, vizW, vizH);

  // Dark filled body (looks great on white/light bg)
  const bodyGrad = ctx.createLinearGradient(0, 0, 0, vizH);
  bodyGrad.addColorStop(0, '#2A2040');
  bodyGrad.addColorStop(0.5, '#1E1834');
  bodyGrad.addColorStop(1, '#2A2040');

  // Main housing
  const hx = 15, hy = 8, hw = vizW - 30, hh = vizH - 16;
  ctx.beginPath();
  ctx.roundRect(hx, hy, hw, hh, 8);
  ctx.fillStyle = bodyGrad;
  ctx.fill();

  // Metallic border
  ctx.beginPath();
  ctx.roundRect(hx, hy, hw, hh, 8);
  ctx.strokeStyle = 'rgba(167,139,250,0.25)';
  ctx.lineWidth = 1;
  ctx.stroke();

  // Tape reels
  const reelY = vizH * 0.4;
  const reelR = vizH * 0.2;
  const lReelX = vizW * 0.32;
  const rReelX = vizW * 0.68;

  // Left reel
  ctx.save();
  ctx.shadowColor = 'rgba(139,92,246,0.3)';
  ctx.shadowBlur = 8;
  ctx.beginPath();
  ctx.arc(lReelX, reelY, reelR, 0, Math.PI * 2);
  ctx.fillStyle = '#0D0B14';
  ctx.fill();
  ctx.restore();

  ctx.beginPath();
  ctx.arc(lReelX, reelY, reelR, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(139,92,246,0.35)';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // Reel spokes
  for (let i = 0; i < 3; i++) {
    const a = (i / 3) * Math.PI * 2 + terrainPhase * 0.5;
    ctx.beginPath();
    ctx.moveTo(lReelX, reelY);
    ctx.lineTo(lReelX + Math.cos(a) * reelR * 0.8, reelY + Math.sin(a) * reelR * 0.8);
    ctx.strokeStyle = 'rgba(139,92,246,0.2)';
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  // Center hub
  ctx.beginPath();
  ctx.arc(lReelX, reelY, reelR * 0.25, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(139,92,246,0.15)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(139,92,246,0.3)';
  ctx.lineWidth = 0.5;
  ctx.stroke();

  // Right reel
  ctx.save();
  ctx.shadowColor = 'rgba(139,92,246,0.3)';
  ctx.shadowBlur = 8;
  ctx.beginPath();
  ctx.arc(rReelX, reelY, reelR, 0, Math.PI * 2);
  ctx.fillStyle = '#0D0B14';
  ctx.fill();
  ctx.restore();

  ctx.beginPath();
  ctx.arc(rReelX, reelY, reelR, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(139,92,246,0.35)';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  for (let i = 0; i < 3; i++) {
    const a = (i / 3) * Math.PI * 2 - terrainPhase * 0.5;
    ctx.beginPath();
    ctx.moveTo(rReelX, reelY);
    ctx.lineTo(rReelX + Math.cos(a) * reelR * 0.8, reelY + Math.sin(a) * reelR * 0.8);
    ctx.strokeStyle = 'rgba(139,92,246,0.2)';
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  ctx.beginPath();
  ctx.arc(rReelX, reelY, reelR * 0.25, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(139,92,246,0.15)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(139,92,246,0.3)';
  ctx.lineWidth = 0.5;
  ctx.stroke();

  // Tape path (connecting reels)
  ctx.beginPath();
  ctx.moveTo(lReelX + reelR, reelY);
  ctx.lineTo(rReelX - reelR, reelY);
  ctx.strokeStyle = 'rgba(167,139,250,0.4)';
  ctx.lineWidth = 2;
  ctx.stroke();

  // Tape head (center bottom)
  const headX = vizW * 0.5;
  const headY = reelY + reelR + 8;
  ctx.beginPath();
  ctx.roundRect(headX - 6, headY - 3, 12, 8, 2);
  ctx.fillStyle = 'rgba(167,139,250,0.2)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(167,139,250,0.3)';
  ctx.lineWidth = 0.5;
  ctx.stroke();

  // Tape from reels to head
  ctx.beginPath();
  ctx.moveTo(lReelX, reelY + reelR);
  ctx.quadraticCurveTo(lReelX + 10, headY, headX - 6, headY);
  ctx.strokeStyle = 'rgba(167,139,250,0.3)';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(rReelX, reelY + reelR);
  ctx.quadraticCurveTo(rReelX - 10, headY, headX + 6, headY);
  ctx.strokeStyle = 'rgba(167,139,250,0.3)';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // Indicator lights (R/Y/G)
  const lightY = hy + 10;
  const lightBaseX = hx + hw - 35;
  const lights = [
    { color: '#EF4444', glow: 'rgba(239,68,68,0.4)' },
    { color: '#F59E0B', glow: 'rgba(245,158,11,0.4)' },
    { color: '#34D399', glow: 'rgba(52,211,153,0.4)' },
  ];
  lights.forEach((l, i) => {
    const lx = lightBaseX + i * 10;
    const flicker = 0.6 + 0.4 * Math.sin(terrainPhase * 3 + i * 2);
    ctx.save();
    ctx.shadowColor = l.glow;
    ctx.shadowBlur = 4 * flicker;
    ctx.beginPath();
    ctx.arc(lx, lightY, 2.5, 0, Math.PI * 2);
    ctx.fillStyle = l.color;
    ctx.globalAlpha = 0.5 + 0.5 * flicker;
    ctx.fill();
    ctx.restore();
  });

  // Machine label
  ctx.fillStyle = 'rgba(167,139,250,0.5)';
  ctx.font = '600 7px -apple-system, system-ui, sans-serif';
  ctx.letterSpacing = '1.5px';
  ctx.fillText('STUDIO  15 IPS', hx + 10, lightY + 2);
}

// ============ LFO WAVEFORM DRAWING ============
function drawLFOWave(canvasId, shape, color, phase) {
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  const parent = canvas.parentElement;
  const w = parent.clientWidth;
  const h = parent.clientHeight || 50;
  const ctx = setupCanvas(canvas, w, h);

  // Dark background (matches viz area)
  ctx.fillStyle = '#1A1A2E';
  ctx.fillRect(0, 0, w, h);

  // Grid lines
  ctx.strokeStyle = 'rgba(139,92,246,0.08)';
  ctx.lineWidth = 0.5;
  ctx.beginPath();
  ctx.moveTo(0, h / 2); ctx.lineTo(w, h / 2);
  ctx.stroke();

  // Waveform
  ctx.beginPath();
  const amp = h * 0.35;
  const cy = h / 2;

  for (let x = 0; x < w; x++) {
    const t = (x / w) * Math.PI * 4 + phase;
    let y;
    switch(shape) {
      case 'sin': y = cy - Math.sin(t) * amp; break;
      case 'tri': y = cy - (2 * Math.abs(2 * ((t / (Math.PI * 2)) % 1) - 1) - 1) * amp; break;
      case 'saw': y = cy - (2 * ((t / (Math.PI * 2)) % 1) - 1) * amp; break;
      case 'sq': y = cy - (Math.sin(t) > 0 ? 1 : -1) * amp; break;
      case 'sh': {
        const seg = Math.floor(t / (Math.PI * 0.5));
        const seed = Math.sin(seg * 12.9898 + 78.233) * 43758.5453;
        y = cy - (seed % 1) * 2 * amp + amp;
        break;
      }
      default: y = cy - Math.sin(t) * amp;
    }
    if (x === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // Glow
  ctx.shadowColor = color;
  ctx.shadowBlur = 6;
  ctx.stroke();
  ctx.shadowBlur = 0;
}

// ============ DRAW TAPE REEL (loop content) ============
function drawTapeReel() {
  const canvas = document.getElementById('tape-reel-canvas');
  if (!canvas) return;
  const ctx = setupCanvas(canvas, 200, 48);

  // Dual reel visualization
  const reelR = 16;
  const lx = 60, rx = 140, cy = 24;

  [lx, rx].forEach((x, idx) => {
    ctx.beginPath();
    ctx.arc(x, cy, reelR, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(123,77,223,0.06)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(123,77,223,0.2)';
    ctx.lineWidth = 1;
    ctx.stroke();

    // Spokes
    for (let s = 0; s < 3; s++) {
      const a = (s / 3) * Math.PI * 2;
      ctx.beginPath();
      ctx.moveTo(x, cy);
      ctx.lineTo(x + Math.cos(a) * reelR * 0.8, cy + Math.sin(a) * reelR * 0.8);
      ctx.strokeStyle = 'rgba(123,77,223,0.12)';
      ctx.lineWidth = 0.8;
      ctx.stroke();
    }

    // Center hub
    ctx.beginPath();
    ctx.arc(x, cy, 4, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(123,77,223,0.15)';
    ctx.fill();
  });

  // Tape connecting
  ctx.beginPath();
  ctx.moveTo(lx + reelR, cy);
  ctx.lineTo(rx - reelR, cy);
  ctx.strokeStyle = 'rgba(123,77,223,0.25)';
  ctx.lineWidth = 1.5;
  ctx.stroke();
}

  presets.forEach(p => {
    const card = document.createElement('div');
    card.className = 'preset-card' + (p.selected ? ' selected' : '') + (p.user ? ' user-preset' : '');
    card.innerHTML = `<div class="preset-card-name">${p.name}</div><div class="preset-card-cat">${p.cat}</div>`;
    grid.appendChild(card);
  });
}

// ============ VIEW STATE TOGGLES (demo) ============
let modOpen = false;
let presetsOpen = false;
let loopView = false;

function toggleMod() {
  modOpen = !modOpen;
  const panel = document.getElementById('mod-panel');
  const controls = document.getElementById('controls');
  const btn = document.getElementById('mod-btn');
  const demoBtn = document.getElementById('demo-mod-btn');

  if (modOpen) {
    panel.classList.add('open');
    controls.style.display = 'none';
    btn.classList.add('active');
    demoBtn.classList.add('active-demo');
  } else {
    panel.classList.remove('open');
    controls.style.display = 'flex';
    btn.classList.remove('active');
    demoBtn.classList.remove('active-demo');
  }
}

function togglePresets() {
  presetsOpen = !presetsOpen;
  const browser = document.getElementById('preset-browser');
  const demoBtn = document.getElementById('demo-preset-btn');
  if (presetsOpen) {
    browser.classList.add('open');
    demoBtn.classList.add('active-demo');
  } else {
    browser.classList.remove('open');
    demoBtn.classList.remove('active-demo');
  }
}

function toggleLoop() {
  loopView = !loopView;
  const fxContainer = document.getElementById('tape-fx-container');
  const loopContent = document.getElementById('tape-loop-content');
  const fxNav = document.getElementById('fxPageNav');
  const subtabs = document.querySelectorAll('.tape-subtab');
  const demoBtn = document.getElementById('demo-loop-btn');

  if (loopView) {
    fxContainer.style.display = 'none';
    loopContent.classList.add('visible');
    fxNav.style.display = 'none';
    subtabs[0].classList.remove('active');
    subtabs[1].classList.add('active');
    demoBtn.classList.add('active-demo');
  } else {
    fxContainer.style.display = 'flex';
    loopContent.classList.remove('visible');
    fxNav.style.display = 'flex';
    subtabs[0].classList.add('active');
    subtabs[1].classList.remove('active');
    demoBtn.classList.remove('active-demo');
  }
}

function showFxTab() {
  if (loopView) toggleLoop();
}
function showLoopTab() {
  if (!loopView) toggleLoop();
}

// ============ ANIMATE METERS ============
let meterPhase = 0;
function animateMeters() {
  meterPhase += 0.05;
  const mL = document.getElementById('meter-l');
  const mR = document.getElementById('meter-r');
  if (mL) mL.style.height = (35 + 25 * Math.sin(meterPhase * 1.3)) + '%';
  if (mR) mR.style.height = (30 + 22 * Math.sin(meterPhase * 1.1 + 0.5)) + '%';
  requestAnimationFrame(animateMeters);
}

// ============ INIT ============
function init() {
  drawGridIcon();
  drawToggleIcon('grain-icon', true);
  drawToggleIcon('tape-icon', true);
  buildGrainKnobs();
  buildTapeFxKnobs();
  buildLoopKnobs();
  buildLFOKnobs();
  drawTapeMachine();
  drawTapeReel();
  drawTransportIcons();
  drawOutputIcon();
  drawMixKnob();
  populatePresets();

  // LFO waveforms (on dark background)
  let lfoPhase = 0;
  function animateLFOs() {
    lfoPhase += 0.03;
    drawLFOWave('lfo-wave-0', 'sin', C.lfoColors[0], lfoPhase);
    drawLFOWave('lfo-wave-1', 'tri', C.lfoColors[1], lfoPhase * 0.7);
    drawLFOWave('lfo-wave-2', 'sh', C.lfoColors[2], lfoPhase * 0.5);
    requestAnimationFrame(animateLFOs);
  }
  animateLFOs();

  // Terrain animation
  drawTerrain();

  // Meter animation
  animateMeters();

  // Redraw tape machine periodically (for reel rotation)
  setInterval(drawTapeMachine, 60);
}

window.addEventListener('DOMContentLoaded', init);
</script>
