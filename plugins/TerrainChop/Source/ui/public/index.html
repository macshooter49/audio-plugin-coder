<!DOCTYPE html>
<html lang="en" class="card-only">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width">
<title>Terrain Chop</title>
<style>
/* ═══ Terrain Chop — the fb106 CHOP "Ribbon" card AS the plugin.
   Faithful extraction from Terrain's Source/ui/public/index.html (the normative
   source): the shared .ti-card kit + the card skin, verbatim. Page = the card,
   pinned 0,0 on the house night background (the fb82 card-only law). ═══ */
:root{--purple-400:#B794FF;}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html,body{margin:0;padding:0;}
html.card-only .ti-popcard{visibility:visible!important;}   /* fb231 — a panel-hosted card must survive the card-only visibility sweep */
/* ═══ fb92 — EXTENSION CARDS v2: the locked four-card design system.
   ARP "Constellation" · GLITCH "Monitor" · ROBIN "Wheel" · CHOP "Ribbon".
   Glass + white ink + #B794FF-only + hairline digits + Prophet group boxes +
   measured rails + MIX in every header. The legacy shell classes
   (arp-ext/chop-ext/gli-ext/rbn-ext) stay ON the elements — they are the
   pop-out CONTRACT (CARDS map, edge handoff, card-only boot) — but every
   visual rule lives on the shared .ti-card kit below. ═══ */
.ti-card{position:fixed;z-index:2147483645;width:316px;border-radius:14px;
  background:linear-gradient(180deg,rgba(38,34,62,.84),rgba(28,25,50,.92));
  -webkit-backdrop-filter:blur(22px) saturate(1.15);backdrop-filter:blur(22px) saturate(1.15);
  border:1px solid rgba(255,255,255,.14);
  box-shadow:0 24px 60px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.07);
  overflow:hidden;display:none;user-select:none;-webkit-user-select:none;
  font-family:-apple-system,'SF Pro Text','Helvetica Neue',sans-serif;
  font-variant-numeric:tabular-nums;}
.ti-card.open{display:block;}
.ti-card .h{display:flex;align-items:center;gap:6px;padding:10px 10px 9px;
  border-bottom:1px solid rgba(255,255,255,.08);cursor:grab;}
.ti-card .h.grab{cursor:grabbing;}
.ti-card .h .g{letter-spacing:2px;color:rgba(255,255,255,.30);font-size:10px;}
.ti-card .h .dot{width:5px;height:5px;border-radius:50%;background:#B794FF;}
.ti-card .h .tt{font-size:9px;letter-spacing:1.8px;color:rgba(255,255,255,.92);text-transform:uppercase;font-weight:600;white-space:nowrap;}
.ti-card .h .pset{flex:1 1 auto;min-width:0;display:flex;align-items:center;justify-content:center;gap:4px;cursor:default;}
.ti-card .h .pset .pa{color:rgba(255,255,255,.42);font-size:12px;line-height:1;cursor:pointer;padding:0 1px;transition:color .15s ease;}
.ti-card .h .pset .pa:hover{color:#fff;}
.ti-card .h .pset .pn{max-width:104px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-size:9px;letter-spacing:.4px;color:rgba(255,255,255,.9);
  cursor:pointer;padding:2px 5px;border:1px solid transparent;border-radius:6px;transition:border-color .15s ease;}
.ti-card .h .pset .pn:hover{border-color:rgba(255,255,255,.28);}
/* fb133 — preset menu = the Import-browser grammar VERBATIM (Max: "look like this one"):
   rgba(22,20,34,.72) glass, blur(20) sat(1.4), dim rows -> white pill + a leading dot when
   current, dim hover wash, and the exact 5px translucent sliders (no chunky white bars). */
.pmenu{position:fixed;z-index:2147483646;min-width:176px;max-width:206px;max-height:340px;overflow-y:auto;
  /* fb139 — long names ellipsize inside the row; they can NEVER widen the menu (Max) */
  background:rgba(22,20,34,0.72);-webkit-backdrop-filter:blur(20px) saturate(1.4);backdrop-filter:blur(20px) saturate(1.4);
  border:1px solid rgba(255,255,255,0.11);border-radius:12px;
  box-shadow:0 20px 50px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.06);
  padding:5px;font-family:-apple-system,'SF Pro Text','Helvetica Neue',sans-serif;}
.pmenu .ps{font-size:7px;letter-spacing:1.4px;text-transform:uppercase;color:rgba(255,255,255,.30);padding:6px 9px 3px;}
.pmenu .pi{display:flex;align-items:center;gap:7px;padding:6px 9px;border-radius:6px;cursor:pointer;
  font-size:9.5px;letter-spacing:.5px;color:rgba(255,255,255,.5);transition:.1s;}
.pmenu .pi .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.pmenu .pi:hover{color:rgba(255,255,255,.86);background:rgba(255,255,255,0.05);}
.pmenu .pi.cur{color:#FFFFFF;background:rgba(255,255,255,0.07);}
.pmenu .pi.cur::before{content:'•';color:#fff;font-size:9px;line-height:1;flex:none;}
.pmenu .pi .dx{color:rgba(255,255,255,.30);font-size:9px;display:none;flex:none;}
.pmenu .pi:hover .dx{display:block;}
.pmenu .pi .dx:hover{color:#fff;}
.pmenu .psave{justify-content:center;margin-bottom:3px;
  border-bottom:1px solid rgba(255,255,255,0.07);border-radius:6px 6px 0 0;}
.pmenu::-webkit-scrollbar{width:5px;height:5px;}
.pmenu::-webkit-scrollbar-track{background:transparent;}
.pmenu::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.13);border-radius:3px;}
.pmenu::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,0.30);}
.pmenu .pinp{width:130px;background:transparent;border:none;outline:none;color:#fff;font:inherit;text-align:center;}
.ti-card .mix{margin-left:auto;display:flex;align-items:baseline;gap:4px;cursor:ew-resize;
  font-size:6.5px;letter-spacing:1.2px;text-transform:uppercase;color:rgba(255,255,255,.40);}
.ti-card .mix b{font-size:11px;font-weight:200;letter-spacing:.3px;color:rgba(255,255,255,.92);
  font-family:-apple-system,'SF Pro Display',sans-serif;min-width:27px;text-align:right;}
.ti-card .h .pop{position:relative;top:1px;margin-left:12px;font-size:7px;   /* fb236 — MEASURED: ink center was +1.92px below the header line at 2px (title/Init/100%/x all within ±0.35); 1px = the optical center between Max's two readings */letter-spacing:1.2px;text-transform:uppercase;
  color:rgba(255,255,255,.45);font-weight:500;cursor:pointer;line-height:1;white-space:nowrap;}
.ti-card .h .x{margin-left:10px;color:rgba(255,255,255,.80);font-size:12px;cursor:pointer;line-height:1;}
.ti-card .h .pop:hover,.ti-card .h .x:hover{color:#fff;}
.mv-ext .h .x{color:rgba(255,255,255,.85);}
.ti-card .b{padding:12px 14px 14px;display:flex;flex-direction:column;}
.arp-ext .b,.gli-ext .b{gap:12px;}

/* tabs + panes (hero persists; the control band swaps) */
.ti-card .tabs{display:flex;justify-content:center;gap:26px;}
.rbn-ext .tabs{margin:10px 0 12px;}
.chop-ext .tabs{margin:0 0 12px;}
.ti-card .tab{position:relative;font-size:8px;letter-spacing:1.8px;text-transform:uppercase;
  color:rgba(255,255,255,.40);font-weight:500;padding-bottom:5px;cursor:pointer;transition:color .12s;}
.ti-card .tab:hover{color:rgba(255,255,255,.70);}
.ti-card .tab.on{color:rgba(255,255,255,.95);}
.ti-card .tab.on::after{content:'';position:absolute;left:50%;transform:translateX(-50%);
  bottom:0;width:14px;height:2px;border-radius:1px;background:#B794FF;}
.ti-card .pane{display:none;}
.ti-card .pane.on{display:flex;flex-direction:column;}
.arp-ext .pane.on,.gli-ext .pane.on{gap:12px;}
.ti-card .pane.on{justify-content:center;}   /* equalized spare air splits evenly — never a bottom hole */
/* fb100 — dead space feeds the BOXES: row sections and trailing boxes stretch to
   fill the equalized pane; interiors stay centered — air inside an outline reads
   structured, a naked gap between sections doesn't */
.ti-card .pane.on>.gboxrow,.ti-card .pane.on>.ctlrow{flex:1 1 auto;}
.ti-card .pane.on>.gbox:last-child{flex:1 1 auto;display:flex;flex-direction:column;justify-content:center;}
.ti-card .gboxrow{display:grid;gap:8px;align-items:stretch;}
.ti-card .gboxrow .gbox{display:flex;flex-direction:column;justify-content:center;}   /* stretched boxes center their innards */
.gli-ext .pane[data-p="fx"] .gboxrow{grid-template-columns:1.32fr 1fr;}
.gli-ext .pane[data-p="motion"] .gboxrow{grid-template-columns:1fr 1fr;}
.gli-ext .outg{gap:8px 7px;padding:2px 4px;}                       /* fb129 — Out fills its box */
.gli-ext .outg .step{font-size:8px;}
.chop-ext .pane[data-p="shape"] .gboxrow{grid-template-columns:1.3fr 1fr;}
.chop-ext .pane .gboxrow .gbox{padding:12px 6px 8px;}

/* Prophet group box: hairline outline, label interrupts the border top-center */
.ti-card .gbox{position:relative;border:1px solid rgba(255,255,255,.15);border-radius:9px;}
.ti-card .gbl{position:absolute;top:-4px;left:50%;transform:translateX(-50%);
  font-size:6px;letter-spacing:1.6px;text-transform:uppercase;line-height:8px;
  color:rgba(255,255,255,.52);background:#232045;padding:0 6px;white-space:nowrap;pointer-events:none;}
.chop-ext .pane>.gbox+.gbox,.rbn-ext .pane>.gbox+.gbox{margin-top:13px;}
.arp-ext .pane .gbox,.gli-ext .pane .gbox{padding:12px 8px 10px;}

/* utility grids for in-system pane content */
.ti-card .gr3{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;}
.ti-card .gr4{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;}
.ti-card .mt8{margin-top:8px;}

/* connector tree (Prophet traces) */
.ti-card .tree{height:12px;position:relative;}
.ti-card .tree svg{position:absolute;inset:0;width:100%;height:100%;}

/* the measured-rails cell skeleton: control zone → label rail → value rail */
.ti-card .cell{display:flex;flex-direction:column;align-items:center;}
.ti-card .ctl{display:flex;align-items:flex-end;justify-content:center;width:100%;}
.ti-card .cell .lb{font-size:6.5px;letter-spacing:1.3px;text-transform:uppercase;
  color:rgba(255,255,255,.45);line-height:1;margin-top:6px;}
.ti-card .cell .vl{font-size:9px;color:rgba(255,255,255,.90);font-weight:500;line-height:1;margin-top:4px;min-height:9px;}
.ti-card .big{font-size:44px;font-weight:100;letter-spacing:.5px;color:rgba(255,255,255,.95);
  font-family:-apple-system,'SF Pro Display',sans-serif;line-height:.82;cursor:ns-resize;}
.ti-card .big i{font-style:normal;font-size:16px;font-weight:200;color:rgba(255,255,255,.42);}
.ti-card .k svg,.ti-card .kn{cursor:ns-resize;}

/* hairline knob ring (r=14 · rotate 128 — the locked ring) sizes per card */
.arp-ext .k svg{width:34px;height:34px;display:block;}
.gli-ext .k svg{width:32px;height:32px;display:block;}
.rbn-ext .k svg{width:30px;height:30px;display:block;}
.chop-ext .k svg{width:30px;height:30px;display:block;}

/* fb143 — THE slider: the osc right-click Volume/Pan/Semitone glass slider, cloned
   EXACTLY (Max: "the exact same ones on everything — same colors, same notches").
   16px hit zone · 2px track @ .16 white · purple fill · 2×9 white BAR marker ·
   1×7 centre notch on bipolar cells. No balls, no glow — the .oscq grammar verbatim. */
.ti-card .tr{position:relative;height:16px;width:100%;cursor:ew-resize;}
.ti-card .tr::before{content:'';position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);
  height:2px;border-radius:1px;background:rgba(255,255,255,0.16);}
.ti-card .tr u{position:absolute;left:50%;top:50%;width:1px;height:7px;transform:translate(-50%,-50%);
  background:rgba(255,255,255,0.28);pointer-events:none;}
.ti-card .tr i{position:absolute;top:50%;transform:translateY(-50%);height:2px;border-radius:1px;
  background:rgba(255,255,255,.92);pointer-events:none;}   /* fb147 — WHITE like the knob arc (Max: all card knobs + sliders white; the MENU slider keeps its purple) */
.ti-card .tr b{position:absolute;top:50%;width:2px;height:9px;border-radius:1px;background:#fff;
  transform:translate(-50%,-50%);pointer-events:none;}
/* fb149 — the pop-out LFO PALETTE (?card=mod): park it beside a popped card and drag */
.ti-card.mod-pal{width:300px;padding:10px 12px 12px;}
.mod-pal .h{display:flex;align-items:center;justify-content:space-between;cursor:grab;padding-bottom:8px;}
.mod-pal .h .ttl{font-size:9px;letter-spacing:2px;color:rgba(255,255,255,.55);text-transform:uppercase;}
.mod-pal .h .x{cursor:pointer;color:rgba(255,255,255,.45);font-size:11px;padding:2px 4px;}
.mod-pal .h .x:hover{color:#fff;}
.mod-pal .chips{display:flex;gap:6px;}
.mod-pal .chips .c{flex:1;text-align:center;font-size:11px;font-weight:400;color:rgba(255,255,255,.45);
  border:1px solid rgba(255,255,255,.18);border-radius:6px;padding:6px 0;cursor:grab;transition:.12s;}
.mod-pal .chips .c:hover{color:#fff;border-color:rgba(255,255,255,.45);}
.mod-pal .chips .c.act{color:#fff;border-color:var(--purple-400);}   /* the button law */
.mod-pal .hint{margin-top:8px;font-size:7.5px;letter-spacing:.3px;color:rgba(255,255,255,.35);text-align:center;}
/* fb144 — the VERTICAL cut of THE slider (chop Depth): identical grammar rotated 90° */
.ti-card .vsl{position:relative;width:16px;min-height:30px;flex:1 1 auto;align-self:center;cursor:ns-resize;}
.ti-card .vsl::before{content:'';position:absolute;top:0;bottom:0;left:50%;transform:translateX(-50%);
  width:2px;border-radius:1px;background:rgba(255,255,255,0.16);}
.ti-card .vsl u{position:absolute;left:50%;top:50%;width:7px;height:1px;transform:translate(-50%,-50%);
  background:rgba(255,255,255,0.28);pointer-events:none;}
.ti-card .vsl i{position:absolute;left:50%;transform:translateX(-50%);width:2px;border-radius:1px;
  background:rgba(255,255,255,.92);pointer-events:none;}   /* fb147 — WHITE like the knob arc */
.ti-card .vsl b{position:absolute;left:50%;width:9px;height:2px;border-radius:1px;background:#fff;
  transform:translate(-50%,50%);pointer-events:none;}


/* value picker (fb95): a quiet box that opens the NATIVE Apple dropdown —
   the micro ‹ › arrows are gone (click → SEE the options, never click-and-switch) */
.ti-card .step{position:relative;width:100%;height:20px;border:1px solid rgba(255,255,255,.18);border-radius:6px;
  font-size:7.5px;letter-spacing:.2px;color:rgba(255,255,255,.88);white-space:nowrap;transition:border-color .15s;}
.ti-card .step:hover{border-color:rgba(255,255,255,.50);}
.ti-card .step em{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-style:normal;pointer-events:none;padding:0 4px;overflow:hidden;}   /* fb138 — symmetric: the 11px chevron reserve pushed every value LEFT of center (Max's eye) */
.ti-card .step select{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;
  -webkit-appearance:none;appearance:none;border:none;background:transparent;}

/* toggle pill: purple dot = on */
.ti-card .togrow{display:grid;grid-template-columns:1fr 1fr;gap:5px;}
.ti-card .tog{height:20px;border:1px solid rgba(255,255,255,.20);border-radius:6px;
  display:flex;align-items:center;justify-content:center;gap:4px;cursor:pointer;
  font-size:6.5px;letter-spacing:1px;text-transform:uppercase;color:rgba(255,255,255,.72);
  transition:color .15s,border-color .15s;}
.ti-card .tog:not(.off){border-color:rgba(255,255,255,.85);color:#fff;}
.ti-card .tog.off{color:rgba(255,255,255,.38);}
.ti-card .tog i{display:none;}   /* fb99 — no dot: the lit outline IS the on-state */

/* momentary button (Roll) */

/* pattern dots + chain (family furniture) */
.ti-card .gl{font-size:6.5px;letter-spacing:1.4px;text-transform:uppercase;color:rgba(255,255,255,.32);}
.ti-card .slotrow{display:flex;align-items:center;justify-content:space-between;padding:0 3px;}
.rbn-ext .slotrow,.chop-ext .slotrow{margin-top:12px;}
.ti-card .sd{display:flex;flex-direction:column;align-items:center;gap:4px;width:20px;cursor:pointer;}
.ti-card .sd i{width:7px;height:7px;border-radius:50%;border:1px solid rgba(255,255,255,.26);transition:background .12s,border-color .12s;}
.ti-card .sd:hover i{border-color:rgba(255,255,255,.55);}
.ti-card .sd.on i{background:rgba(255,255,255,.92);border-color:transparent;}
.ti-card .sd b{font-size:6.5px;font-weight:400;color:rgba(255,255,255,.35);}
.ti-card .sd.on b{color:rgba(255,255,255,.85);}
.ti-card .chain{display:flex;align-items:center;gap:7px;margin-top:7px;}
.ti-card .chip{min-width:15px;height:15px;padding:0 4px;border:1px solid rgba(255,255,255,.18);border-radius:4px;
  display:flex;align-items:center;justify-content:center;font-size:7px;color:rgba(255,255,255,.55);cursor:pointer;transition:border-color .12s,color .12s;}
.ti-card .chip:hover{color:rgba(255,255,255,.85);}
.ti-card .chip.cur{border-color:#B794FF;color:#fff;text-shadow:0 0 3px rgba(255,255,255,.35);}   /* fb125 button law */
.ti-card .arr{color:rgba(255,255,255,.25);font-size:8px;}
.ti-card .add{margin-left:auto;color:rgba(255,255,255,.40);font-size:10px;cursor:pointer;}
.ti-card .add:hover{color:rgba(255,255,255,.85);}

/* bottom-right resize grip (fb95): invisible zone; hairline corner on hover */
.ti-card .rsz{position:absolute;right:0;bottom:0;width:18px;height:18px;cursor:nwse-resize;z-index:9;}
.ti-card .rsz::after{content:'';position:absolute;right:4px;bottom:4px;width:7px;height:7px;
  border-right:1px solid rgba(255,255,255,0);border-bottom:1px solid rgba(255,255,255,0);
  border-radius:0 0 2px 0;transition:border-color .15s;}
.ti-card .rsz:hover::after{border-right-color:rgba(255,255,255,.45);border-bottom-color:rgba(255,255,255,.45);}

/* ═══ fb98 — RIGID GRIDS: a name or value can NEVER resize a track or outline
   (fr tracks have a min-content floor; minmax(0,1fr) removes it) ═══ */
.ti-card .cell,.ti-card .gbox{min-width:0;}
.ti-card .cell .lb,.ti-card .cell .vl{white-space:nowrap;max-width:100%;overflow:hidden;text-align:center;}
.ti-card .gr3{grid-template-columns:repeat(3,minmax(0,1fr));}
/* fb137 — glitch Out box: the pills must live INSIDE the box (Max's screenshot) */
.gli-ext .outg{gap:4px;}
.gli-ext .outg .step{box-sizing:border-box;min-width:0;}
.gli-ext .outg .step em{font-size:8px;letter-spacing:.2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 1px;}
.ti-card .gr4{grid-template-columns:repeat(4,minmax(0,1fr));}
.ti-card .togrow{grid-template-columns:repeat(2,minmax(0,1fr));}
.gli-ext .fx{grid-template-columns:repeat(8,minmax(0,1fr));}
.rbn-ext .fx{grid-template-columns:repeat(4,minmax(0,1fr));}
.arp-ext .knobs{grid-template-columns:repeat(4,minmax(0,1fr));}
.gli-ext .grid5{grid-template-columns:72px repeat(6,minmax(0,1fr));}
.rbn-ext .hum .in{grid-template-columns:repeat(3,minmax(0,1fr));}
.rbn-ext .pane[data-p="behavior"] .in,.rbn-ext .pane[data-p="order"] .in{grid-template-columns:repeat(4,minmax(0,1fr));}
.rbn-ext .feel .cells{grid-template-columns:repeat(3,minmax(0,1fr));}
.rbn-ext .ctlrow{grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);}
.chop-ext .ctlrow{grid-template-columns:minmax(0,1fr) minmax(0,1.12fr);}
.chop-ext .carve .cells{grid-template-columns:repeat(2,minmax(0,1fr));}
.chop-ext .depth .in{grid-template-columns:repeat(4,minmax(0,1fr));}
.chop-ext .pane .kin{grid-template-columns:repeat(4,minmax(0,1fr));}
.chop-ext .pane .kin3{grid-template-columns:repeat(2,minmax(0,1fr));}
.chop-ext .lanes{grid-template-columns:repeat(6,minmax(0,1fr));}
.gli-ext .pane[data-p="fx"] .gboxrow{grid-template-columns:minmax(0,1.32fr) minmax(0,1fr);}
.gli-ext .pane[data-p="motion"] .gboxrow{grid-template-columns:minmax(0,1fr) minmax(0,1fr);}
.gli-ext .pane[data-p="motion"] .cell .lb{letter-spacing:.8px;}   /* fb138 — QUANT/CLOCK fit their 4-col cells */
/* fb146 — Motion = full-height verticals (the same fill grammar as chop Shape, scoped .on) */
.gli-ext .pane[data-p="motion"].on .gbox{display:flex;flex-direction:column;}
.gli-ext .pane[data-p="motion"].on .gr4,.gli-ext .pane[data-p="motion"].on .gr3{flex:1;align-items:stretch;}
.gli-ext .pane[data-p="motion"].on .cell{justify-content:flex-end;gap:5px;}
.gli-ext .grid5 .cell .lb{letter-spacing:.8px;}   /* fb144 — STREAK/STEREO fit their cells (the fb138 Clock treatment) */
.chop-ext .pane[data-p="shape"] .gboxrow{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);}
/* tabs: EQUAL THIRDS — the middle tab rides the card's exact centerline; the
   underline centers on the INK (letter-spacing leaves a phantom trailing px) */
.ti-card .tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));justify-items:center;
  width:196px;align-self:center;gap:0;}
.ti-card .tab.on::after{left:calc(50% - 0.9px);}
/* GLITCH chance value: natural kerning (mockup-exact "50%"), whole block right-anchored
   in its cell — digits grow LEFT into open space; % and the label never move. */
.gli-ext .big{white-space:nowrap;}
.gli-ext .big.three{font-size:33px;}   /* "100%" stays inside its cell */
.gli-ext .chcell .ctl{justify-content:flex-end;padding-right:12px;}

/* ── ARP · Constellation ── */

        eventType: SliderControl_sliderDragStartedEventId,
      });

        eventType: SliderControl_sliderDragEndedEventId,

      /* card shell: header (⠿ · dot · title · MIX · Pop Out · ✕) + body + drag/handoff */
      function shell(cfg){

          +'<div class="h"><span class="g">⠿</span><span class="dot"></span><span class="tt">'+cfg.title+'</span>'

          if(mxe) mxe.setAttribute('data-mod-dest',String(MODDEST[cfg.mixId])); }   /* fb145 — the MIX header is a target too */
        /* fb95 — card scale: default BIGGER (1.2×); the bottom-right grip drags
           0.85–1.8×, double-click = default; persisted per card. Popped windows
           follow via __tiPushCardSize (CSS zoom doesn't fire ResizeObserver). */
        var Z0=1.2, zoom=Z0;
        try{ var zs=parseFloat(localStorage.getItem('tiZoom_'+cfg.id)); if(zs>0)zoom=Math.max(.85,Math.min(1.8,zs)); }catch(e){}
        function applyZoom(){
          try{ var zMax=Math.min(1.8,(screen.availWidth-40)/card.offsetWidth,(screen.availHeight-60)/card.offsetHeight);
            if(zMax>0.85&&zoom>zMax)zoom=zMax; }catch(e){}
          card.style.zoom=zoom; if(window.__tiPushCardSize)window.__tiPushCardSize(); }
        applyZoom();
        var grip=el('<div class="rsz" title="Drag to resize the card \u00b7 double-click = default"></div>');
        card.appendChild(grip);
        (function(){ var gd=false,gsx=0,gsy=0,gz0=zoom;
          grip.addEventListener('pointerdown',function(e){ gd=true; gsx=e.clientX; gsy=e.clientY; gz0=zoom;
            try{ grip.setPointerCapture(e.pointerId); }catch(_){}
            e.preventDefault(); e.stopPropagation(); });
          grip.addEventListener('pointermove',function(e){ if(!gd)return;
            zoom=Math.max(.85,Math.min(1.8,gz0+((e.clientX-gsx)+(e.clientY-gsy))/560)); applyZoom(); });
          function gup(){ if(!gd)return; gd=false; try{ localStorage.setItem('tiZoom_'+cfg.id,String(zoom)); }catch(e){} }
          grip.addEventListener('pointerup',gup); grip.addEventListener('pointercancel',gup);
          grip.addEventListener('dblclick',function(e){ zoom=Z0; applyZoom();
            try{ localStorage.setItem('tiZoom_'+cfg.id,String(zoom)); }catch(_){}
            e.preventDefault(); e.stopPropagation(); });
        })();
        card.querySelector('.x').addEventListener('click',function(){ if(!window.__cardOnly) card.classList.remove('open'); });
        var h=card.querySelector('.h'), pos=null;
        h.addEventListener('mousedown',function(e){
          if(e.target.closest&&e.target.closest('.x,.pop,.mix'))return;
          if(window.__cardOnly)return;                       // popped: native window drag owns the header
          e.preventDefault(); h.classList.add('grab');
          var r=card.getBoundingClientRect(), dx=e.clientX-r.left, dy=e.clientY-r.top;
          function mv(ev){ if(window.__cardEdgeHandoff&&window.__cardEdgeHandoff(cfg.id,card,ev,dx,dy)){ up(); return; }
            pos={x:Math.max(4,Math.min(window.__vw()-card.getBoundingClientRect().width-4,ev.clientX-dx)),
                 y:Math.max(4,Math.min(window.__vh()-40,ev.clientY-dy))};
            card.style.left=pos.x+'px'; card.style.top=pos.y+'px'; }
          function up(){ h.classList.remove('grab'); document.removeEventListener('mousemove',mv); document.removeEventListener('mouseup',up); }
          document.addEventListener('mousemove',mv); document.addEventListener('mouseup',up); });
        if(cfg.mixLabel){ var mxl=card.querySelector('.mix');
          if(mxl&&mxl.firstChild&&mxl.firstChild.nodeType===3) mxl.firstChild.textContent=cfg.mixLabel+' '; }   /* fb232 — the LFO card's MIX slot holds Depth (Max: 'the depth can be the mix') */
        mixBind(card,cfg.mixId,cfg.mixDef,cfg.mixFmt);

            if(!card.__eqPanes){ card.__eqPanes=1; requestAnimationFrame(function(){ try{
              /* measure each pane under its REAL .on CSS (flex-direction/gap live
                 on .pane.on — a bare display:flex measures as a ROW and lies) */
              var ps=card.querySelectorAll('.pane'), hMax=0,
                  zf=parseFloat(card.style.zoom)||1;   // rects are post-zoom; minHeight is layout px
              EA(ps,function(p2){ var on=p2.classList.contains('on');
                if(!on){ p2.style.visibility='hidden'; p2.classList.add('on'); }
                hMax=Math.max(hMax,p2.getBoundingClientRect().height/zf);   // fractional — offsetHeight rounds and leaves 0.5px shifts
                if(!on){ p2.classList.remove('on'); p2.style.visibility=''; } });
              if(hMax>0){ hMax=Math.ceil(hMax*4)/4;

      /* pattern dots (12 slots, store/recall) + chain (click chip = jump ·
         dblclick chip = remove · + = append current slot · auto-advances on loop) */
      function slotsChain(getSnap,setSnap){
        var wrap=el('<div><div class="slotrow"></div>'
          +'<div class="chain"><span class="gl" style="margin-right:2px">Chain</span><span class="seq" style="display:flex;gap:7px;align-items:center"></span><span class="add" title="Add current pattern to the chain">+</span></div></div>');
        var row=wrap.querySelector('.slotrow'), seq=wrap.querySelector('.seq'), addB=wrap.querySelector('.add');
        var store={}, cur=1, chain=[1], cpos=0;
        for(var i=1;i<=12;i++){ var s=el('<span class="sd'+(i===1?' on':'')+'"><i></i><b>'+i+'</b></span>');
          (function(n){ s.addEventListener('click',function(){ select(n); }); })(i); row.appendChild(s); }
        function paintDots(){ EA(row.children,function(d,i){ d.classList.toggle('on',(i+1)===cur); }); }
        var lastChipDrag=0;
        function paintChain(){ seq.innerHTML='';
          for(var i=0;i<chain.length;i++){
            if(i)seq.appendChild(el('<span class="arr">›</span>'));
            (function(ix){
              var c=el('<span class="chip'+(ix===cpos?' cur':'')+'" data-i="'+ix
                +'" title="Click and type 1-12 (0 removes) · Enter saves · drag up or down also works">'+chain[ix]+'</span>');
              /* fb130 — Max: "click it and just put a number in there" — an in-place
                 editor: the number opens SELECTED (the blue highlight), type, Enter. */
              function beginEdit(){
                if(c.querySelector('input'))return;
                var inp=document.createElement('input');
                inp.type='text'; inp.maxLength=2; inp.value=String(chain[ix]);
                inp.style.cssText='width:14px;background:transparent;border:none;outline:none;color:#fff;font:inherit;font-size:inherit;text-align:center;padding:0;margin:0;';
                c.textContent=''; c.appendChild(inp);
                try{ inp.focus(); inp.select(); }catch(e){}
                window.__tiActiveInp=inp; if(window.__tiEditArm)window.__tiEditArm(1);
                /* fb136 — arming the key bridge steals OS focus and BLURS the input in-host,
                   which insta-committed the fresh editor (Max: "I have to click twice").
                   Blur owns nothing now: Enter/Escape + click-away close the edit, and a
                   refocus tick keeps the number highlighted after the arming blur. */
                setTimeout(function(){ try{ inp.focus(); inp.select(); }catch(e){} },80);
                var closed=false;
                function out(ev){ if(!c.contains(ev.target)) done(true); }
                setTimeout(function(){ document.addEventListener('pointerdown',out,true); },0);
                function done(commit){ if(closed)return; closed=true;
                  document.removeEventListener('pointerdown',out,true);
                  window.__tiActiveInp=null; if(window.__tiEditArm)window.__tiEditArm(0);
                  var v=parseInt(inp.value,10);
                  if(commit&&(inp.value.trim()===''||v===0)&&chain.length>1){
                    chain.splice(ix,1); if(cpos>=chain.length)cpos=chain.length-1; paintChain(); return; }
                  if(commit&&v>=1&&v<=12){ chain[ix]=v; if(ix===cpos)select(v); }
                  paintChain(); }
                inp.addEventListener('keydown',function(ev){ ev.stopPropagation();
                  if(ev.key==='Enter')done(true); else if(ev.key==='Escape')done(false); });
                inp.addEventListener('pointerdown',function(ev){ ev.stopPropagation(); });
              }
              c.addEventListener('click',function(ev){ ev.stopPropagation();
                if(Date.now()-lastChipDrag<300)return; beginEdit(); });
              dragify(c,{get:function(){ return (chain[ix]-1)/11; },
                set:function(n){ if(c.querySelector('input'))return;
                  var v=1+Math.round(n*11);
                  if(v!==chain[ix]){ chain[ix]=v; c.textContent=String(v); lastChipDrag=Date.now();
                    if(ix===cpos)select(v); } },
                span:80});

          return '<span class="lane'+(i?'':' on')+'" data-l="'+l[0]+'">'+l[1]+'</span>'; }).join('')+'</div>');
        var ctlrow=TIC.el('<div class="ctlrow"></div>');
        var carve=TIC.el('<div class="gbox carve"><span class="gbl">Carve</span><div class="togrow"></div><div class="cells"></div></div>');
        carve.querySelector('.togrow').appendChild(TIC.togEl(S,'always','Always'));
        carve.querySelector('.togrow').appendChild(TIC.togEl(S,'catch','Catch'));
        var cc=carve.querySelector('.cells');
        var tmC=TIC.el('<div class="cell"><span class="lb">Time</span></div>');   /* fb107 — the chop grid division, front and center */
        tmC.insertBefore(TIC.stepEl(S,'time',RATE_DIV_RICH),tmC.firstChild); cc.appendChild(tmC);
        var slC=TIC.el('<div class="cell"><span class="lb">Slices</span></div>');
        slC.insertBefore(TIC.stepEl(S,'slices',SLICEL),slC.firstChild); cc.appendChild(slC);
        var lpC=TIC.el('<div class="cell"><span class="lb">Loop</span></div>');
        lpC.insertBefore(TIC.stepEl(S,'loop',LOOPL),lpC.firstChild); cc.appendChild(lpC);
        var mdC=TIC.el('<div class="cell"><span class="lb">Mode</span></div>');
        mdC.insertBefore(TIC.stepEl(S,'mode',['Step','Ping','Rand','Walk']),mdC.firstChild); cc.appendChild(mdC);
        var depth=TIC.el('<div class="gbox depth"><span class="gbl">Order · Depth</span><div class="in"></div></div>');
        function fillDepth(){ var l=S.v.lane, nm=null;
          LANES.forEach(function(x){ if(x[0]===l)nm=x[1]; });
          depth.querySelector('.gbl').textContent=nm+' · Depth';
          var g=depth.querySelector('.in'); g.innerHTML='';
          DEPTH[l].forEach(function(d){ g.appendChild(TIC.vsCell(S,l+'_'+d[0],d[1],DFMT[d[0]]||TIC.inum(0,100),d[2])); });
          TIC.applyTips(depth,TIPS); }
        lanesEl.addEventListener('click',function(e){ var b=e.target.closest('.lane'); if(!b)return;
          TIC.EA(lanesEl.querySelectorAll('.lane'),function(x){ x.classList.toggle('on',x===b); });
          S.set('lane',b.getAttribute('data-l')); fillDepth(); });
        fillDepth();
        ctlrow.appendChild(carve); ctlrow.appendChild(depth);
        tp.panes.slice.appendChild(lanesEl); tp.panes.slice.appendChild(ctlrow);

        /* SCAN pane */
        var mem=TIC.el('<div class="gbox"><span class="gbl">Memory</span><div class="kin"></div></div>');
        mem.querySelector('.kin').appendChild(TIC.knobCell(S,'scan','Scan',function(n){
          return n>0.98?'Now':TIC.pct(n); },1));
        mem.querySelector('.kin').appendChild(TIC.knobCell(S,'auto','Wander',TIC.inum(0,100),0));
        mem.querySelector('.kin').appendChild(TIC.knobCell(S,'spreadM','Spread',TIC.inum(0,100),0));
        mem.querySelector('.kin').appendChild(TIC.knobCell(S,'feed','Speed',TIC.inum(0,100),0));
        var cap=TIC.el('<div class="gbox"><span class="gbl">Capture</span><div class="gr4"></div></div>');
        cap.querySelector('.gr4').appendChild(TIC.togEl(S,'freeze','Freeze'));
        cap.querySelector('.gr4').appendChild(TIC.togEl(S,'collect','Collect'));
        var wipeB=TIC.el('<div class="tog off"><i></i>Wipe</div>');
        wipeB.addEventListener('click',function(){ sim.off+=997;
          if(chopWipeFn){ try{ chopWipeFn(); }catch(e){} }        /* fb106 — clears the DSP memory */
          wipeB.classList.remove('off');
          setTimeout(function(){ wipeB.classList.add('off'); },180); });
        cap.querySelector('.gr4').appendChild(wipeB);
        var rpC=TIC.el('<div style="display:flex;align-items:center"></div>');
        rpC.appendChild(TIC.stepEl(S,'rpts',['1','2','3','4'],function(v){ return 'Rpts '+v; }));
        cap.querySelector('.gr4').appendChild(rpC);
        tp.panes.scan.appendChild(mem); tp.panes.scan.appendChild(cap);

        /* SHAPE pane */
        /* fb145 — Character + Bus = full-height VERTICAL glass sliders (Max: "fills this
           entire space from top to bottom"); the Filter picker is GONE (Max: "fuck a
           filter — the terrain patcher will own filtering"; FLOW_CHOP_FILTER stays
           registered + wired, defaulting Off, like the glitch fb129 precedent). */
        var ch=TIC.el('<div class="gbox"><span class="gbl">Character</span><div class="kin"></div></div>');
        ch.querySelector('.kin').appendChild(TIC.vsCell(S,'stepsC','Crush',TIC.inum(0,100),0));
        ch.querySelector('.kin').appendChild(TIC.vsCell(S,'detune','Detune',TIC.inum(0,100),0));
        ch.querySelector('.kin').appendChild(TIC.vsCell(S,'wow','Wow',TIC.inum(0,100),0));
        ch.querySelector('.kin').appendChild(TIC.vsCell(S,'smooth','Smooth',TIC.inum(0,100),.15));
        var bus=TIC.el('<div class="gbox"><span class="gbl">Bus</span><div class="kin3"></div></div>');
        bus.querySelector('.kin3').appendChild(TIC.vsCell(S,'grit','Grit',TIC.inum(0,100),0));
        bus.querySelector('.kin3').appendChild(TIC.vsCell(S,'trimC','Trim',TIC.inum(0,100),.5));
        var shRow=TIC.el('<div class="gboxrow"></div>');
        shRow.appendChild(ch); shRow.appendChild(bus);
        tp.panes.shape.appendChild(shRow);

        /* THE RIBBON — persistent below the panes */
        var rib=TIC.el('<div class="ribbon"><svg viewBox="0 0 288 52" preserveAspectRatio="none"></svg></div>');
        var rsvg=rib.querySelector('svg');
        function ribbonPaint(){
          var s='', cellW=280/MEM, ws=winStart(), wl=4+ws*cellW, ww=loopLen()*cellW, wr=wl+ww, n=nSlices();
          s+='<rect x="4" y="6" width="280" height="30" rx="5" fill="none" stroke="rgba(255,255,255,.28)" stroke-width="1"/>';
          /* the memory waveform: dim past, bright inside the loop window */
          function seg(x0,x1,op){ if(x1-x0<3)return '';
            var p=''; for(var x=x0;x<=x1;x+=3){ var v=waveAt((x+sim.off)*.09);
              p+=(p?' L':'M')+x.toFixed(1)+','+(21-v*9).toFixed(1); }
            return '<path d="'+p+'" fill="none" stroke="rgba(255,255,255,'+op+')" stroke-width="1"/>'; }
          s+=seg(6,wl-1,'.28'); s+=seg(wr+1,282,'.28');
          s+='<rect x="'+wl.toFixed(1)+'" y="6.5" width="'+ww.toFixed(1)+'" height="29" fill="rgba(255,255,255,.055)"/>';
          s+=seg(wl,wr,'.85');
          for(var i=1;i<n;i++){ var dx=wl+i*(ww/n);
            s+='<line x1="'+dx.toFixed(1)+'" y1="6" x2="'+dx.toFixed(1)+'" y2="36" stroke="rgba(255,255,255,.16)" stroke-width="1"/>'; }
          s+='<rect class="nubL" x="'+(wl-3).toFixed(1)+'" y="2" width="6" height="3" rx="1" fill="rgba(255,255,255,.40)"/>';
          s+='<rect class="nubR" x="'+(wr-3).toFixed(1)+'" y="2" width="6" height="3" rx="1" fill="rgba(255,255,255,.40)"/>';
          s+='<line x1="'+wl.toFixed(1)+'" y1="6" x2="'+wl.toFixed(1)+'" y2="36" stroke="rgba(255,255,255,.45)" stroke-width="1" stroke-dasharray="3 2"/>';
          s+='<line x1="'+wr.toFixed(1)+'" y1="6" x2="'+wr.toFixed(1)+'" y2="36" stroke="rgba(255,255,255,.30)" stroke-width="1"/>';
          var subW=ww/n, px=wl+(sim.sub+sim.frac)*subW;
          if(px>wr)px=wr;
          s+='<line x1="'+px.toFixed(1)+'" y1="4" x2="'+px.toFixed(1)+'" y2="38" stroke="#B794FF" stroke-width="1.4"/>';
          for(var j=0;j<n;j++){ var lx=wl+(j+.5)*subW;
            s+='<circle cx="'+lx.toFixed(1)+'" cy="45" r="1.5" fill="'+(j===sim.sub?'#B794FF':'rgba(255,255,255,.18)')+'"/>'; }
          rsvg.innerHTML=s; }
        /* ribbon touch: drag window = Scan · drag nubs = Loop · tap a slice = jump */
        (function(){
          var mode2=null, downX=0, scan0=0, moved=false;
          function rx(e){ var r=rsvg.getBoundingClientRect(); return (e.clientX-r.left)/r.width*288; }
          rsvg.style.cursor='ew-resize';
          rsvg.addEventListener('pointerdown',function(e){
            var x=rx(e), cellW=280/MEM, ws=winStart(), wl=4+ws*cellW, wr=wl+loopLen()*cellW;
            moved=false; downX=x; scan0=S.v.scan;
            if(Math.abs(x-wl)<6&&x<wl+4) mode2='nl';
            else if(Math.abs(x-wr)<6) mode2='nr';
            else if(x>wl&&x<wr) mode2='win';
            else mode2='jump';
            try{ rsvg.setPointerCapture(e.pointerId); }catch(_){}
            e.preventDefault(); });
          rsvg.addEventListener('pointermove',function(e){ if(!mode2)return;
            var x=rx(e), cellW=280/MEM; if(Math.abs(x-downX)>2)moved=true;
            if(mode2==='win'||mode2==='jump'){
              var span=(MEM-loopLen())*cellW; if(span<=0)return;
              S.set('scan',TIC.C01(scan0+(x-downX)/span)); ribbonPaint(); }
            else { var ws=winStart(), wl=4+ws*cellW;
              if(mode2==='nr'){ var cells=Math.round((x-wl)/cellW);
                for(var i2=0;i2<LOOPL.length;i2++){ if(LOOPL[i2]>=cells){ S.set('loop',i2); break; } }
                if(cells>LOOPL[LOOPL.length-1])S.set('loop',LOOPL.length-1); }
              else { var wr2=wl+loopLen()*cellW, cells2=Math.round((wr2-x)/cellW);
                for(var i3=0;i3<LOOPL.length;i3++){ if(LOOPL[i3]>=cells2){ S.set('loop',i3); break; } } }
              ribbonPaint(); } });
          rsvg.addEventListener('pointerup',function(e){
            if(mode2&&!moved){ var x=rx(e), cellW=280/MEM, ws=winStart(), wl=4+ws*cellW, ww=loopLen()*cellW;
              if(x>wl&&x<wl+ww){ var n=nSlices(); sim.sub=Math.max(0,Math.min(n-1,Math.floor((x-wl)/(ww/n)))); sim.frac=0; ribbonPaint(); } }
            mode2=null; });
        })();
        S.on(function(k){ if(k==='slices'||k==='loop'||k==='scan'){ var n=nSlices();
          if(sim.sub>=n)sim.sub=0; ribbonPaint(); } });

        var snapGet=function(){ var o={}; for(var k in S.v)o[k]=S.v[k]; return JSON.stringify(o); };
        var snapSet=function(s){ var o=JSON.parse(s); for(var k in o)S.set(k,o[k]); fillDepth(); ribbonPaint(); };
        var sc=TIC.slotsChain(snapGet,snapSet);
        /* fb132 — factory bank (fb107 research: Gross Beat slot-1 law, Beat Repeat's
           Chance lesson, chop-culture flips; Speed = slowdown 0..1, Scan 1 = Now) */
        var CHOP_PRESETS=[
          {name:'Init',v:{}},
          {name:'Half-Time',v:{time:5,'catch':1,always:0,feed:.33,smooth:.3,fltr:1,trim_length:1,trim_curve:.2}},
          {name:'Doubles',v:{lane:'rpt',time:8,rpt_chance:.35,rpt_count:.33,rpt_decay:.15,rpt_curve:.4,trim_length:.9}},
          {name:'Gate 16ths',v:{lane:'trim',slices:6,loop:6,trim_length:.55,trim_curve:.85,trim_gate:.4}},
          {name:'Triplet Roll',v:{time:5,slices:2,rpt_chance:1,rpt_count:.66,rpt_decay:.2,rpt_curve:.6,trim_curve:.3}},
          {name:'Reverse Flip',v:{lane:'rev',time:8,rev_chance:.3,rev_run:.33,rev_snap:1,rev_spread:.2,
            order_lock:.7,order_seed:.5}},
          {name:'Tape Drop',v:{lane:'pitch',time:2,slices:0,'catch':1,always:0,feed:.5,pitch_range:1,
            pitch_glide:.85,trim_length:1,trim_curve:.2,fltr:1,smooth:.4}},
          {name:'Riser Stutter',v:{time:8,'catch':1,always:0,rpt_chance:1,rpt_count:1,rpt_decay:0,
            rpt_curve:.8,pitch_range:.6,pitch_glide:.5,trim_length:.7}},
          {name:'Scatter Fill',v:{slices:6,'catch':1,always:0,mode:3,auto:.4,spreadM:.6,order_spread:.7,
            order_seed:.3,drop_density:.1,drop_grain:.3,drop_spray:.4}},
          {name:'Freeze Juggle',v:{time:8,loop:1,mode:2,freeze:1,scan:.55,auto:.1,trim_length:.9,
            trim_curve:.3,smooth:.25}},
          {name:'Ghost Chance',v:{slices:6,rev_chance:.1,rev_run:0,rev_snap:1,rpt_chance:.15,rpt_count:.33,
            rpt_decay:.4,pitch_range:.25,pitch_glide:.2,drop_density:.05,trim_random:.1,detune:.08}},
          {name:'Verse Flip',v:{},
            slots:{1:{},2:{rev_chance:.5,rev_run:.33,rev_snap:1},3:{order_spread:.8,order_seed:.35},
                   4:{rpt_chance:.8,rpt_count:.66,rpt_decay:.25}},
            chain:[1,1,2,3,1,1,2,4]},
          {name:'IDM Machine',v:{slices:6,mode:3,order_spread:.8,order_seed:.3,rev_chance:.25,rev_run:.33,
            rpt_chance:.4,rpt_count:.5,rpt_decay:.3,drop_density:.15,drop_grain:.25,detune:.2,grit:.3,
            wow:.15,smooth:.2},
            slots:{1:{},2:{time:14,rpt_chance:.7},3:{rev_chance:.5,drop_density:.3,spreadM:.5}},
            chain:[1,2,1,3]} ];
        TIC.presets({id:'chop',sh:sh,S:S,DEF:DEF,snapGet:snapGet,snapSet:snapSet,sc:sc,factory:CHOP_PRESETS});
        TIC.cardSync('chop',sc,S,sh.card);

        /* fb106 — DSP WIRING: every Ribbon control ↔ its APVTS param through
           __synSliderShim (post-ceiling law — works identically on both surfaces).
           steps>0 = index param (stored as INDEX, sent idx/N). Slot recall replays
           through S.set, so the chain re-pushes every param for free. */
        (function(){
          var PRE={order:'O',pitch:'P',rev:'RV',trim:'T',rpt:'R',drop:'D'};
          var KN={spread:'SPREAD',bias:'BIAS',lock:'LOCK',seed:'SEED',range:'RANGE',steps:'STEPS',
                  glide:'GLIDE',quant:'QUANT',chance:'ODDS',run:'RUN',snap:'SNAP',length:'LEN',
                  curve:'CURVE',random:'RAND',gate:'GATE',count:'COUNT',decay:'DECAY',
                  density:'AMT',grain:'SIZE',spray:'SPRAY',tone:'TONE'};
          var BIND={ time:['FLOW_SEQ_RATE',18,1],   /* fb107 — shares the front chop-grid knob (relay when docked) */
                     'catch':['FLOW_CHOP_CATCH',1], slices:['FLOW_CHOP_SLICES',6], loop:['FLOW_CHOP_LOOP',6],
                     mode:['FLOW_CHOP_MODE',3], rpts:['FLOW_CHOP_RPTS',3], fltr:['FLOW_CHOP_FILTER',3],
                     freeze:['FLOW_CHOP_FREEZE',1], collect:['FLOW_CHOP_COLLECT',1],
                     scan:['FLOW_CHOP_SCAN',0], auto:['FLOW_CHOP_WANDER',0], spreadM:['FLOW_CHOP_SPREAD',0],
                     feed:['FLOW_CHOP_SPEED',0], stepsC:['FLOW_CHOP_STEPS',0], detune:['FLOW_CHOP_DETUNE',0],
                     wow:['FLOW_CHOP_WOW',0], smooth:['FLOW_CHOP_SMOOTH',0], grit:['FLOW_CHOP_GRIT',0],
                     trimC:['FLOW_CHOP_TRIM',0] };
          for(var L in DEPTH) DEPTH[L].forEach(function(d){
            BIND[L+'_'+d[0]]=['FLOW_CHOP_'+PRE[L]+'_'+KN[d[0]],0]; });
          window.__chopProbe={S:S,DEF:DEF,sim:sim,BIND:BIND};   /* probe surface — the ui_suite reads state + the bind map */
          TIC.stampMod(sh.card,BIND);   /* fb145 — LFO drop targets */
          Object.keys(BIND).forEach(function(key){
            var pid=BIND[key][0], steps=BIND[key][1], relay=BIND[key][2], h=null;
            if(relay&&!window.__cardOnly&&J){ try{ h=J.getSliderState(pid); }catch(e){} }
            if(!h&&window.__synSliderShim) h=window.__synSliderShim(pid, steps?(S.v[key]/steps):S.v[key]);
            if(!h)return;
            var fromParam=false;   /* fb124 — echo guard: a param-originated set must NOT
              re-push to the param, or drifting round-trips self-oscillate (the chaos-knob
              "moving like an LFO" fight) */
            var toUI=function(){ try{ var v=h.getNormalisedValue();
              fromParam=true; S.set(key, steps?Math.round(v*steps):v); fromParam=false; }catch(e){ fromParam=false; } };
            toUI();
            if(h.valueChangedEvent&&h.valueChangedEvent.addListener) h.valueChangedEvent.addListener(toUI);
            S.on(function(k,v){ if(k!==key||fromParam)return; try{ h.setNormalisedValue(steps?(v/steps):v); }catch(e){} });
          });
          /* Always/Catch = one radio pair (Catch is the param; Always = not-Catch) */
          S.on(function(k,v){
            if(k==='catch'){ if(v){ if(S.v.always)S.set('always',0); } else if(!S.v.always)S.set('always',1); }
            else if(k==='always'){ if(v){ if(S.v['catch'])S.set('catch',0); } else if(!S.v['catch'])S.set('catch',1); }
          });
          if(S.v.always&&S.v['catch'])S.set('always',0);
        })();
        var chopFeedFn=null, chopWipeFn=null;
        try{ if(window.Juce&&window.Juce.getNativeFunction){
          chopFeedFn=window.Juce.getNativeFunction('getChopFeed');
          chopWipeFn=window.Juce.getNativeFunction('chopWipe'); } }catch(e){}

        sh.body.appendChild(tp.tabs);
        sh.body.appendChild(tp.panes.slice); sh.body.appendChild(tp.panes.scan); sh.body.appendChild(tp.panes.shape);
        sh.body.appendChild(rib); sh.body.appendChild(sc.el);

        /* fb106 — LIVE ribbon: rAF-poll the DSP feed (getChopFeed). In CHOP mode
           the playhead and active slice ride the REAL grid clock (BPM, geometry,
           drops and all); the chain steps on every window wrap. Other FLOW modes:
           gentle self-clock so the card never looks dead. */
        var acc=0, feed=null, feedBusy=false, prevSub=0;
        var start=TIC.runLoop(sh.card,function(dt){
          if(!S.v.freeze) sim.off+=dt*(22+S.v.feed*30);
          if(window.__chopFeedSynthetic){ feed=window.__chopFeedSynthetic; }   /* probe surface — the ui_suite injects the DSP feed */
          else if(chopFeedFn&&!feedBusy){ feedBusy=true;
            try{ Promise.resolve(chopFeedFn()).then(function(fs){ feedBusy=false;
              try{ feed=JSON.parse(fs); }catch(e){} }).catch(function(){ feedBusy=false; }); }
            catch(e){ feedBusy=false; } }
          var n=nSlices();
          if(feed&&feed.on===1){
            var sub=Math.floor(feed.s)%n;
            sim.frac=Math.max(0,Math.min(1,feed.s-Math.floor(feed.s)));
            if(feed.pl===1||feed.a===1)sc.__actT=performance.now();   /* fb141 — playing OR audio = life */
            var go=(performance.now()-(sc.__actT||0)<1500)?1:0;
            if(go===1&&sc.__pl!==1)sc.restart(); sc.__pl=go;   /* silence -> life retriggers the chain */
            if(go===1&&sub<prevSub) sc.advance();   /* chain steps on window wrap — frozen only in true silence */
            if(sub!==prevSub){ prevSub=sub; }
            sim.sub=sub;
            ribbonPaint();
          } else {
            var sps=8;                                  // fallback grid clock
            if(!S.v.always){ sim.idle+=dt; if(sim.idle%3>1.6){ ribbonPaint(); return; } }
            acc+=dt*sps; sim.frac=Math.min(1,acc);
            while(acc>=1){ acc-=1;
              var m=S.v.mode;
              if(m===0){ sim.sub=(sim.sub+1)%n; if(sim.sub===0&&!feed)sc.advance(); }
              else if(m===1){ sim.sub+=sim.dirV; if(sim.sub>=n-1){sim.sub=n-1;sim.dirV=-1;} if(sim.sub<=0){sim.sub=0;sim.dirV=1;} }
              else if(m===2){ sim.sub=Math.floor(Math.random()*n); }
              else { sim.sub=Math.max(0,Math.min(n-1,sim.sub+(Math.random()<.5?-1:1))); } }
            ribbonPaint();
          }
        });
        ribbonPaint();
        TIC.applyTips(sh.card,TIPS);
        return { open:function(){ sh.open(); start(); } }; }
      return { open:function(){ if(!built)built=build(); built.open(); },
               ensure:function(){ if(!built)built=build(); } };   /* fb168 — the dice build the card HIDDEN so its state exists before first open */
    })();

    /* ── BOOT: this page IS the card (the fb82 card-only grammar; the native-window
       plumbing is swapped for the plugin editor). resizeCardWindow is honored IF the
       C++ registered it — otherwise the card sits at its natural size and the resize
       grip hides (a grown card would clip against a fixed editor). ── */
    (function(){
      function reg(n){ try{ return window.__JUCE__.initialisationData.__juce__functions.indexOf(n)>=0; }catch(e){ return false; } }
      function boot(){
        try{ chopCardObj.open(); }catch(e){ setTimeout(boot,150); return; }
        var card=document.querySelector('.chop-ext');
        if(!card||!card.classList.contains('open')){ setTimeout(boot,150); return; }
        card.classList.add('ti-popcard');
        document.documentElement.classList.add('card-only-late');   /* body-level glass (the preset menu) must stay visible */
        var p=card.querySelector('.h .pop'); if(p)p.style.display='none';   /* no pop-out — this window IS the card */
        var x=card.querySelector('.h .x'); if(x)x.style.display='none';
        var rs=null;
        if(reg('resizeCardWindow')){ try{ rs=window.Juce.getNativeFunction('resizeCardWindow'); }catch(e){} }
        function push(){ if(rs){ try{ var rr=card.getBoundingClientRect(); rs(Math.ceil(rr.width),Math.ceil(rr.height)); }catch(e){} } }
        window.__tiPushCardSize=push;
        if(rs){ if(window.ResizeObserver){ try{ new ResizeObserver(push).observe(card); }catch(e){ setInterval(push,600); } } else { setInterval(push,600); } push(); }
        else { var g=card.querySelector('.rsz'); if(g)g.style.display='none'; }
        window.__cardEl=card;   /* probe surface */
      }
      if(document.readyState==='loading'){ document.addEventListener('DOMContentLoaded',function(){ setTimeout(boot,60); }); }
      else setTimeout(boot,60);
    })();
})();
</script>
