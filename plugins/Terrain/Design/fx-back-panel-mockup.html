<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terrain — FX Back Panels mockup (fb275)</title>
<style>
  :root{
    --bg-main:#1A1A2E; --bg-surface:#232340; --purple-400:#B794FF; --purple-500:#8B5CF6;
    --border-strong:rgba(88,88,128,0.5); --border:rgba(88,88,128,0.35);
    --text-primary:#E0DCE8; --text-secondary:#9B93B0; --text-muted:#6B6080; --text-dim:#504870; --bg-hero:#232340;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; background:#12121f; }
  body{ font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif;
        color:var(--text-primary); display:flex; flex-direction:column; align-items:center; gap:16px; padding:30px 22px 44px; }
  .cap{ color:var(--text-dim); font-size:12px; letter-spacing:.04em; text-align:center; line-height:1.6; max-width:820px; }
  .cap b{ color:var(--text-secondary); font-weight:500; }
  .cap .k{ color:var(--purple-400); }
  .stage{ background:var(--bg-main); border-radius:12px; padding:20px; display:flex; gap:16px; align-items:stretch;
          box-shadow:0 24px 60px rgba(0,0,0,.5); }
  .cell{ position:relative; }
  .stage-lbl{ position:absolute; margin-top:-16px; font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--text-dim); }

  /* ==== REAL FX-RACK CSS (fxr-*, fb275) ==== */
  #syn-panel .fxr-dev{ flex:0 0 272px; height:192px; background:transparent; border:1px solid var(--border-strong); border-radius:8px; display:flex; flex-direction:column; transition:border-color .15s, opacity .15s; position:relative; }
  #syn-panel .fxr-dev:hover{ border-color:rgba(255,255,255,.34); }

  /* HEADER — one centerline: equal-height boxes + align-items:center, NO per-element top nudges */
  #syn-panel .fxr-head{ display:flex; align-items:center; gap:6px; padding:5px 8px 4px; height:26px; }
  #syn-panel .fxr-grip{ color:var(--text-dim); font-size:11px; line-height:1; letter-spacing:-2px; cursor:grab; user-select:none; display:flex; align-items:center; }
  #syn-panel .fxr-name{ font-size:11.5px; color:var(--text-primary); font-weight:500; white-space:nowrap; line-height:1; display:flex; align-items:center; }
  #syn-panel .fxr-type{ position:relative; font-size:9px; color:var(--text-secondary); border:1px solid var(--border-strong); border-radius:9px; padding:0 7px; height:16px; display:flex; align-items:center; gap:4px; cursor:pointer; font-weight:300; line-height:1; white-space:nowrap; margin-left:3px; }   /* fb275 — pills +3px right off "Reverb" */
  #syn-panel .fxr-type .fxr-car{ color:var(--text-muted); font-size:8px; position:relative; top:.5px; }
  #syn-panel .fxr-tw{ display:grid; align-items:center; justify-items:center; }
  #syn-panel .fxr-tw > span{ grid-area:1/1; white-space:nowrap; display:inline-flex; align-items:center; gap:4px; }
  #syn-panel .fxr-tg{ visibility:hidden; pointer-events:none; }
  #syn-panel .fxr-preset{ position:relative; display:flex; align-items:center; gap:5px; max-width:88px; height:16px; border:1px solid var(--border-strong); border-radius:9px; padding:0 9px; cursor:pointer; line-height:1; overflow:hidden; }
  #syn-panel .fxr-preset .fxr-star{ color:var(--purple-400); font-size:8px; line-height:1; position:relative; top:-1px; }   /* fb275 — ✦ up 1px only */
  #syn-panel .fxr-preset .fxr-pname{ font-size:9px; color:var(--text-secondary); font-weight:300; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #syn-panel .fxr-preset .fxr-car{ color:var(--text-muted); font-size:8px; margin-left:auto; position:relative; top:.5px; }
  #syn-panel .fxr-spacer{ flex:1; }
  #syn-panel .fxr-headr{ display:flex; align-items:center; gap:9px; }
  #syn-panel .fxr-pwr{ width:9px; height:9px; border-radius:50%; border:1px solid var(--purple-400); background:var(--purple-400); box-shadow:0 0 6px rgba(183,148,255,.5); cursor:pointer; flex:0 0 auto; }
  /* +, ←, ✕ = IDENTICAL 14px SVG boxes, glyph centered at (7,7). +⇄← swaps which svg shows; box never moves. */
  #syn-panel .fxr-swap, #syn-panel .fxr-x{ width:14px; height:14px; display:grid; place-items:center; cursor:pointer; padding:0; background:transparent; border:none; }
  #syn-panel .fxr-swap svg, #syn-panel .fxr-x svg{ grid-area:1/1; width:14px; height:14px; display:block; }
  #syn-panel .fxr-swap{ color:var(--text-muted); transition:color .12s, filter .12s; }
  #syn-panel .fxr-swap .ic-arrow{ display:none; }
  #syn-panel .fxr-swap.act .ic-plus{ display:none; }
  #syn-panel .fxr-swap.act .ic-arrow{ display:block; }
  #syn-panel .fxr-swap:hover{ color:var(--purple-400); filter:drop-shadow(0 0 5px rgba(167,139,250,.6)); }
  #syn-panel .fxr-swap.act{ color:#fff; }
  #syn-panel .fxr-x{ color:var(--text-muted); transition:color .12s; }
  #syn-panel .fxr-x:hover{ color:#EF4444; }

  #syn-panel .fxr-core{ flex:1 1 0; min-height:0; margin:1px 10px 0; position:relative; overflow:hidden; color:var(--text-primary); }
  #syn-panel .fxr-core svg{ position:absolute; inset:0; width:100%; height:100%; display:block; }
  #syn-panel .fxr-ctrls{ display:flex; align-items:flex-end; gap:10px; padding:5px 10px 9px; }
  #syn-panel .fxr-knobs{ flex:1; display:grid; grid-template-columns:repeat(4,1fr); align-items:end; min-width:0; }
  #syn-panel .fxr-knob{ display:flex; flex-direction:column; align-items:center; gap:4px; min-width:0; }
  #syn-panel .fxr-dial{ width:29px; height:29px; cursor:ns-resize; }
  #syn-panel .fxr-dial svg{ width:100%; height:100%; display:block; }
  #syn-panel .fxr-lab{ font-size:7px; letter-spacing:.01em; color:var(--text-secondary); white-space:nowrap; text-align:center; font-weight:400; }
  #syn-panel .fxr-divider{ flex:0 0 auto; width:1px; height:92%; align-self:center; position:relative; left:-3.5px; background:var(--border-strong); }
  #syn-panel .fxr-rightcol{ flex:0 0 92px; display:flex; flex-direction:column; align-items:stretch; justify-content:flex-end; gap:6px; }
  #syn-panel .fxr-pills{ display:flex; gap:5px; width:100%; }
  #syn-panel .fxr-pill{ flex:1; height:18px; display:flex; align-items:center; justify-content:center; background:transparent; border:1px solid var(--border-strong); border-radius:9px; font-size:8.5px; letter-spacing:.03em; color:var(--text-muted); font-weight:300; cursor:pointer; }
  #syn-panel .fxr-pill.fxr-on{ border-color:var(--purple-400); color:var(--text-primary); text-shadow:0 0 4px rgba(255,255,255,.5); }
  #syn-panel .fxr-route{ display:flex; gap:3px; width:100%; }
  #syn-panel .fxr-r{ flex:1; height:14px; display:flex; align-items:center; justify-content:center; font-size:8px; font-weight:400; color:var(--text-muted); border:1px solid var(--border-strong); border-radius:3px; cursor:pointer; }
  #syn-panel .fxr-r.fxr-on{ color:var(--text-primary); border-color:var(--purple-400); text-shadow:0 0 4px rgba(255,255,255,.5); }

  /* ==== BACK PANEL (official) — 2 dropdowns + 8-knob 4×2 grid + 3 column separators ==== */
  #syn-panel .fxr-back{ display:none; flex:1 1 0; min-height:0; flex-direction:column; padding:7px 12px 9px; }
  #syn-panel .fxr-dev.swapped .fxr-core, #syn-panel .fxr-dev.swapped .fxr-ctrls{ display:none; }
  #syn-panel .fxr-dev.swapped .fxr-back{ display:flex; }
  #syn-panel .fxr-bk-row{ display:flex; justify-content:space-between; align-items:center; flex:0 0 auto; padding:0 2px 2px; }
  #syn-panel .fxr-bk-sel{ display:inline-flex; align-items:center; gap:6px; cursor:pointer; line-height:1; }
  #syn-panel .fxr-bk-sel .fxr-bk-k{ font-size:8.5px; color:var(--text-muted); font-weight:300; letter-spacing:.02em; }
  #syn-panel .fxr-bk-vwrap{ position:relative; display:inline-flex; align-items:center; }
  #syn-panel .fxr-bk-sel .fxr-bk-v{ display:inline-flex; align-items:center; gap:4px; font-size:9.5px; color:var(--text-primary); font-weight:400; }
  #syn-panel .fxr-bk-sel .fxr-bk-v .fxr-car{ color:var(--text-muted); font-size:8px; }
  #syn-panel .fxr-bk-sel:hover .fxr-bk-v{ color:#fff; }
  /* native <select> overlay — real dropdown, NOT click-to-rotate (engine-select idiom) */
  #syn-panel .fxr-type-native, #syn-panel .fxr-bk-native{ position:absolute; inset:0; width:100%; height:100%; margin:0; padding:0; border:none; background:transparent; color:transparent; opacity:0; cursor:pointer; -webkit-appearance:none; appearance:none; font-size:9px; }
  #syn-panel .fxr-type-native:focus, #syn-panel .fxr-bk-native:focus{ outline:none; }
  #syn-panel .fxr-bk-grid{ flex:1 1 0; min-height:0; display:grid; grid-template-columns:1fr 11px 1fr 11px 1fr 11px 1fr; grid-template-rows:1fr 1fr; align-items:center; justify-items:center; }
  #syn-panel .fxr-bk-sep{ grid-row:1 / 3; width:1px; align-self:stretch; justify-self:center; background:var(--border-strong); margin:5px 0; }
  #syn-panel .fxr-bk-knob{ display:flex; flex-direction:column; align-items:center; gap:5px; }
  #syn-panel .fxr-bk-knob .fxr-dial{ width:32px; height:32px; cursor:ns-resize; }
  #syn-panel .fxr-bk-knob .fxr-lab{ font-size:7.5px; }

  @keyframes fxrTap{0%,100%{opacity:.3}50%{opacity:1}}
  @keyframes fxrRide{0%{offset-distance:0%}100%{offset-distance:100%}}
  @keyframes fxrGlow{0%,100%{opacity:.4}50%{opacity:1}}
  @keyframes fxrScan{0%{transform:translateX(0);opacity:0}10%{opacity:.9}90%{opacity:.9}100%{transform:translateX(188px);opacity:0}}
  @keyframes fxrBloom{0%,100%{opacity:0}50%{opacity:.5}}
</style>
</head>
<body>
  <div class="cap">
    <b>Terrain FX — official back panel on all three devices</b> &nbsp;·&nbsp; real plugin CSS + JS, standalone preview (fb275, not built)<br>
    All three shown flipped to the BACK. Click <span class="k">←</span> to see the front. The <b>type</b>, <b>Character</b> &amp; <b>Mod Sync</b> are real dropdowns (click them). Knobs drag.
  </div>
  <div id="syn-panel">
    <div class="stage">
      <div class="cell"><span class="stage-lbl">Reverb — back</span><div id="dev0"></div></div>
      <div class="cell"><span class="stage-lbl">Delay — back</span><div id="dev1"></div></div>
      <div class="cell"><span class="stage-lbl">Saturate — back</span><div id="dev2"></div></div>
    </div>
  </div>

<script>
function knobSVG(pct){
  pct=Math.max(0,Math.min(100,Math.round(pct)));
  var cx=15,cy=15,r=11.5;
  function pt(deg){var a=deg*Math.PI/180;return [cx+r*Math.cos(a),cy+r*Math.sin(a)];}
  var t0=pt(135),t1=pt(405),v1=pt(135+270*pct/100),large=(270*pct/100)>180?1:0;
  return '<svg viewBox="0 0 30 30">'
   +'<path d="M'+t0[0].toFixed(1)+' '+t0[1].toFixed(1)+' A '+r+' '+r+' 0 1 1 '+t1[0].toFixed(1)+' '+t1[1].toFixed(1)+'" fill="none" stroke="var(--border-strong)" stroke-width="2" stroke-linecap="round"/>'
   +'<path d="M'+t0[0].toFixed(1)+' '+t0[1].toFixed(1)+' A '+r+' '+r+' 0 '+large+' 1 '+v1[0].toFixed(1)+' '+v1[1].toFixed(1)+'" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>'
   +'<text x="15" y="15.4" text-anchor="middle" dominant-baseline="central" font-family="-apple-system,\'SF Pro Display\',sans-serif" font-size="8" font-weight="300" fill="var(--text-secondary)">'+pct+'</text></svg>';
}
var IC_PLUS ='<svg class="ic-plus" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><line x1="7" y1="2.6" x2="7" y2="11.4"/><line x1="2.6" y1="7" x2="11.4" y2="7"/></svg>';
var IC_ARROW='<svg class="ic-arrow" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><line x1="2.6" y1="7" x2="11.4" y2="7"/><polyline points="6.4,3.4 2.6,7 6.4,10.6"/></svg>';
var IC_X    ='<svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><line x1="3.3" y1="3.3" x2="10.7" y2="10.7"/><line x1="10.7" y1="3.3" x2="3.3" y2="10.7"/></svg>';
var CORES={
  reverb:function(){
    var W=226,H=78,cols=20,rows=6,gap=1.4,cw=W/cols,ch=H/rows,white='',bloom='';
    for(var c=0;c<cols;c++)for(var r=0;r<rows;r++){
      var bass=r/(rows-1),decay=Math.exp(-c/(4.5+bass*9));
      var op=Math.max(0.05,Math.min(0.9,decay*(0.62+0.30*Math.sin(c*1.7+r*2.1)*0.5+0.15)));
      var x=(c*cw+gap/2).toFixed(2),y=(r*ch+gap/2).toFixed(2),w=(cw-gap).toFixed(2),h=(ch-gap).toFixed(2);
      white+='<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="1" fill="currentColor" opacity="'+op.toFixed(3)+'"/>';
      if(op>0.24){var d=((c*0.13+(r%2)*0.42+r*0.05)%3.4).toFixed(2);
        bloom+='<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="1" fill="var(--purple-400)" opacity="0" style="animation:fxrBloom 3.4s ease-in-out infinite '+d+'s"/>';}
    }
    return '<svg viewBox="0 0 226 78" preserveAspectRatio="none">'+white+bloom+'</svg>';
  },
  delay:function(){
    return '<svg viewBox="0 0 226 78" preserveAspectRatio="none">'
     +'<line x1="10" y1="39" x2="216" y2="39" stroke="var(--border)" stroke-width="1"/>'
     +'<g stroke="currentColor" stroke-linecap="round">'
     +'<line x1="26" y1="39" x2="26" y2="10" stroke-width="1.5" opacity=".92" style="animation:fxrTap 2.4s ease-in-out infinite"/>'
     +'<line x1="60" y1="39" x2="60" y2="62" stroke-width="1.4" opacity=".72" style="animation:fxrTap 2.4s ease-in-out infinite .3s"/>'
     +'<line x1="94" y1="39" x2="94" y2="18" stroke-width="1.3" opacity=".54" style="animation:fxrTap 2.4s ease-in-out infinite .6s"/>'
     +'<line x1="128" y1="39" x2="128" y2="56" stroke-width="1.2" opacity=".4" style="animation:fxrTap 2.4s ease-in-out infinite .9s"/>'
     +'<line x1="162" y1="39" x2="162" y2="26" stroke-width="1.1" opacity=".28" style="animation:fxrTap 2.4s ease-in-out infinite 1.2s"/></g>'
     +'<line x1="10" y1="12" x2="10" y2="66" stroke="var(--purple-400)" stroke-width="1" opacity=".5" style="animation:fxrScan 3.4s linear infinite"/></svg>';
  },
  saturate:function(){
    return '<svg viewBox="0 0 226 78" preserveAspectRatio="none">'
     +'<line x1="14" y1="66" x2="212" y2="66" stroke="var(--border)" stroke-width="1"/>'
     +'<line x1="14" y1="66" x2="14" y2="8" stroke="var(--border)" stroke-width="1"/>'
     +'<path d="M14 66 C 62 56, 80 20, 150 13 C 176 10, 194 10, 212 10" fill="none" stroke="currentColor" stroke-width="1.6"/>'
     +'<circle r="2.6" fill="var(--purple-400)" style="offset-path:path(\'M14 66 C 62 56, 80 20, 150 13 C 176 10, 194 10, 212 10\'); animation:fxrRide 2.6s ease-in-out infinite alternate; filter:drop-shadow(0 0 4px rgba(183,148,255,.7))"/></svg>';
  }
};
var DEVS=[
 {name:'Reverb',core:'reverb',type:'Hall',types:['Room','Plate','Hall','Convolution'],preset:'Cave',
  pills:[{t:'Mod',on:true},{t:'Freeze',on:false}],route:[1,1,1,1,1,1],knobs:[{l:'Size',v:30},{l:'Decay',v:55},{l:'Damp',v:8},{l:'Mix',v:100}],
  back:{d1:{k:'Character',v:'Smooth',opts:['Smooth','Dark','Bright','Vintage','Modern']},
        d2:{k:'Mod Sync',v:'Free',opts:['Free','1/2','1/4','1/8','1/16']},
        knobs:[['Low Cut',18],['Hi Cut',80],['Pre-Dly',30],['Diffuse',66],['Density',52],['Width',82],['Rate',42],['Depth',26]]}},
 {name:'Delay',core:'delay',type:'BBD',types:['Digital','BBD','Tape','Ping-Pong'],preset:'Slap',
  pills:[{t:'Sync',on:true},{t:'Ping',on:false}],route:[1,1,0,0,0,0],knobs:[{l:'Time',v:50},{l:'Fdbk',v:58},{l:'Tone',v:44},{l:'Mix',v:34}],
  back:{d1:{k:'Character',v:'Tape',opts:['Clean','Tape','BBD','Digital','Diffuse']},
        d2:{k:'Mod Sync',v:'Free',opts:['Free','1/2','1/4','1/8','1/16']},
        knobs:[['Low Cut',22],['Hi Cut',72],['Spread',60],['Width',78],['Mod Rate',40],['Mod Depth',30],['Wow',18],['Ducking',26]]}},
 {name:'Saturate',core:'saturate',type:'Tube',types:['Tube','Tape','Diode','Fold','Fuzz'],preset:'Grit',
  pills:[{t:'Pre',on:true},{t:'Auto',on:false}],route:[1,0,0,0,0,0],knobs:[{l:'Drive',v:60},{l:'Warmth',v:46},{l:'Bias',v:50},{l:'Mix',v:100}],
  back:{d1:{k:'Character',v:'Warm',opts:['Warm','Neutral','Bright','Aggressive']},
        d2:{k:'Oversample',v:'4×',opts:['1×','2×','4×','8×']},
        knobs:[['Low Cut',12],['Hi Cut',88],['Tilt',50],['Bias',50],['Symmetry',50],['Emphasis',40],['Dynamics',55],['Width',70]]}}
];
var RLBL=['A','B','C','D','S','N'];

function bkKnob(l,v,col,row){ return '<div class="fxr-bk-knob" style="grid-column:'+col+';grid-row:'+row+'"><div class="fxr-dial" data-k="'+l+'">'+knobSVG(v)+'</div><span class="fxr-lab">'+l+'</span></div>'; }
function bkSep(col){ return '<div class="fxr-bk-sep" style="grid-column:'+col+'"></div>'; }
function bkSel(sel){
  var opts=sel.opts.map(function(o){return '<option'+(o===sel.v?' selected':'')+'>'+o+'</option>';}).join('');
  return '<div class="fxr-bk-sel"><span class="fxr-bk-k">'+sel.k+'</span>'
    +'<span class="fxr-bk-vwrap"><span class="fxr-bk-v">'+sel.v+'<span class="fxr-car">▾</span></span>'
    +'<select class="fxr-bk-native">'+opts+'</select></span></div>';
}
function backHTML(d){ var b=d.back, K=b.knobs, cols=[1,3,5,7];
  var grid=''; for(var i=0;i<4;i++){ grid+=bkKnob(K[i][0],K[i][1],cols[i],1)+bkKnob(K[i+4][0],K[i+4][1],cols[i],2); if(i<3) grid+=bkSep(cols[i]+1); }
  return '<div class="fxr-back">'
    +'<div class="fxr-bk-row">'+bkSel(b.d1)+bkSel(b.d2)+'</div>'
    +'<div class="fxr-bk-grid">'+grid+'</div>'
  +'</div>';
}
function devHTML(d){
  var pills=d.pills.map(function(p){return '<span class="fxr-pill'+(p.on?' fxr-on':'')+'"><span class="fxr-t">'+p.t+'</span></span>';}).join('');
  var route=d.route.map(function(on,i){return '<span class="fxr-r'+(on?' fxr-on':'')+'" data-r="'+i+'"><span class="fxr-t">'+RLBL[i]+'</span></span>';}).join('');
  var knobs=d.knobs.map(function(k,i){return '<div class="fxr-knob"><div class="fxr-dial" data-k="'+i+'">'+knobSVG(k.v)+'</div><span class="fxr-lab">'+k.l+'</span></div>';}).join('');
  var topts=d.types.map(function(t){return '<option'+(t===d.type?' selected':'')+'>'+t+'</option>';}).join('');
  return '<div class="fxr-dev" data-dev="0">'
    +'<div class="fxr-head">'
      +'<span class="fxr-grip">⋮⋮</span><span class="fxr-name">'+d.name+'</span>'
      +'<span class="fxr-type"><span class="fxr-tw"><span class="fxr-tl">'+d.type+'<span class="fxr-car">▾</span></span>'+d.types.map(function(t){return '<span class="fxr-tg">'+t+'<span class="fxr-car">▾</span></span>';}).join('')+'</span><select class="fxr-type-native">'+topts+'</select></span>'
      +'<span class="fxr-preset" data-act="preset"><span class="fxr-star">✦</span><span class="fxr-pname">'+d.preset+'</span><span class="fxr-car">▾</span></span>'
      +'<span class="fxr-spacer"></span>'
      +'<span class="fxr-headr"><span class="fxr-swap" data-act="swap" title="More parameters">'+IC_PLUS+IC_ARROW+'</span><span class="fxr-pwr" data-act="pwr"></span><span class="fxr-x" data-act="x" title="Remove">'+IC_X+'</span></span>'
    +'</div>'
    +'<div class="fxr-core">'+CORES[d.core]()+'</div>'
    +backHTML(d)
    +'<div class="fxr-ctrls">'
      +'<div class="fxr-knobs">'+knobs+'</div>'
      +'<div class="fxr-divider"></div>'
      +'<div class="fxr-rightcol"><div class="fxr-pills">'+pills+'</div><div class="fxr-route">'+route+'</div></div>'
    +'</div></div>';
}
DEVS.forEach(function(d,i){
  var host=document.getElementById('dev'+i); host.innerHTML=devHTML(d);
  var dev=host.querySelector('.fxr-dev'); dev.classList.add('swapped'); dev.querySelector('.fxr-swap').classList.add('act');
});

var panel=document.getElementById('syn-panel');
panel.addEventListener('click',function(e){
  var sw=e.target.closest('.fxr-swap'); if(sw){ var dev=sw.closest('.fxr-dev'); dev.classList.toggle('swapped'); sw.classList.toggle('act'); }
});
panel.addEventListener('change',function(e){
  var t=e.target;
  if(t.classList.contains('fxr-type-native')){ var tl=t.closest('.fxr-type').querySelector('.fxr-tl'); if(tl&&tl.firstChild) tl.firstChild.nodeValue=t.value; }
  if(t.classList.contains('fxr-bk-native')){ var v=t.closest('.fxr-bk-sel').querySelector('.fxr-bk-v'); if(v&&v.firstChild) v.firstChild.nodeValue=t.value; }
});
panel.addEventListener('pointerdown',function(e){
  var dial=e.target.closest('.fxr-dial'); if(!dial) return; e.preventDefault();
  var startY=e.clientY,startV=parseInt(dial.querySelector('text').textContent,10)||0;
  function mv(ev){ var v=Math.max(0,Math.min(100,startV+(startY-ev.clientY)*0.6)); dial.innerHTML=knobSVG(v); }
  function up(){ document.removeEventListener('pointermove',mv); document.removeEventListener('pointerup',up); }
  document.addEventListener('pointermove',mv); document.addEventListener('pointerup',up);
});
</script>
</body>
</html>
