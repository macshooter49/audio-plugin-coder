<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Studio Viz — Filled Design Preview</title>
<style>
  body {
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    background: #F3F0F8;
    font-family: -apple-system, system-ui, sans-serif;
  }
  .frame {
    background: rgba(255,255,255,0.85);
    border-radius: 16px;
    padding: 16px;
    box-shadow: 0 4px 24px rgba(139,92,246,0.08);
  }
  canvas { display: block; border-radius: 10px; }
  .label { text-align: center; color: #8B5CF6; font-size: 11px; margin-top: 8px; opacity: 0.6; }
</style>
</head>
<body>
<div class="frame">
  <canvas id="c" width="720" height="440"></canvas>
  <div class="label">Studio Reel-to-Reel — Terrain v2.2 Preview</div>
</div>
<script>
var DPR = window.devicePixelRatio || 1;
var canvas = document.getElementById('c');
var W = 360, H = 220;
canvas.width = W * DPR;
canvas.height = H * DPR;
canvas.style.width = W + 'px';
canvas.style.height = H + 'px';

var wow = 0.35, sat = 0.4, hiss = 0.5;

function drawStudioViz(ctx, w, h, t) {
  ctx.clearRect(0, 0, w * DPR, h * DPR);
  ctx.save();
  ctx.scale(DPR, DPR);
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';

  var maxH = h * 0.85;
  var sc = Math.min(maxH / 160, w / 220);

  var pulse = 0.88 + Math.sin(t * 1.5) * 0.12;
  var fastPulse = 0.9 + Math.sin(t * 3.2) * 0.1;
  var jit = function(s) { return (Math.random() - 0.5) * wow * (s || 2); };

  // ━━━━ CABINET (3D isometric — filled) ━━━━
  var fW = 110 * sc;
  var fH = 140 * sc;
  var dX = 18 * sc;
  var dY = -12 * sc;

  var fL = (w - fW - dX) / 2;
  var fT = (h - fH) / 2 + 4;
  var fR = fL + fW;
  var fB = fT + fH;

  // Right side face — filled dark
  var sideGrad = ctx.createLinearGradient(fR, fT, fR + dX, fT);
  sideGrad.addColorStop(0, 'rgba(42, 20, 62, 0.85)');
  sideGrad.addColorStop(1, 'rgba(30, 14, 48, 0.75)');
  ctx.beginPath();
  ctx.moveTo(fR, fT);
  ctx.lineTo(fR + dX, fT + dY);
  ctx.lineTo(fR + dX, fB + dY);
  ctx.lineTo(fR, fB);
  ctx.closePath();
  ctx.fillStyle = sideGrad;
  ctx.fill();
  ctx.strokeStyle = 'rgba(167, 139, 250, 0.35)';
  ctx.lineWidth = 1.0;
  ctx.stroke();

  // Top face — filled lighter
  var topGrad = ctx.createLinearGradient(fL, fT, fL, fT + dY);
  topGrad.addColorStop(0, 'rgba(58, 32, 80, 0.7)');
  topGrad.addColorStop(1, 'rgba(48, 24, 70, 0.5)');
  ctx.beginPath();
  ctx.moveTo(fL, fT);
  ctx.lineTo(fL + dX, fT + dY);
  ctx.lineTo(fR + dX, fT + dY);
  ctx.lineTo(fR, fT);
  ctx.closePath();
  ctx.fillStyle = topGrad;
  ctx.fill();
  ctx.strokeStyle = 'rgba(167, 139, 250, 0.3)';
  ctx.lineWidth = 1.0;
  ctx.stroke();

  // Front face — main body, dark gradient
  var frontGrad = ctx.createLinearGradient(fL, fT, fL, fB);
  frontGrad.addColorStop(0, 'rgba(55, 28, 78, 0.88)');
  frontGrad.addColorStop(0.3, 'rgba(42, 20, 62, 0.92)');
  frontGrad.addColorStop(1, 'rgba(30, 14, 48, 0.95)');
  ctx.beginPath();
  ctx.moveTo(fL, fT);
  ctx.lineTo(fR, fT);
  ctx.lineTo(fR, fB);
  ctx.lineTo(fL, fB);
  ctx.closePath();
  ctx.fillStyle = frontGrad;
  ctx.fill();
  ctx.strokeStyle = 'rgba(167, 139, 250, 0.4)';
  ctx.lineWidth = 1.2;
  ctx.stroke();

  // Subtle wood grain on front face
  ctx.globalAlpha = 0.04;
  for (var gi = 0; gi < 10; gi++) {
    var gy = fT + fH * (gi / 10) + Math.sin(gi * 1.7) * 2;
    ctx.beginPath();
    ctx.moveTo(fL + 4, gy);
    ctx.bezierCurveTo(
      fL + fW * 0.3, gy + Math.sin(gi * 2.3) * 2.5,
      fL + fW * 0.7, gy - Math.sin(gi * 1.8) * 1.8,
      fR - 4, gy + Math.sin(gi * 3.1) * 1.5
    );
    ctx.strokeStyle = 'rgba(200, 180, 220, 1)';
    ctx.lineWidth = 0.7;
    ctx.stroke();
  }
  ctx.globalAlpha = 1.0;

  // Base trim — darker ledge
  var baseH = fH * 0.05;
  var baseGrad = ctx.createLinearGradient(fL, fB - baseH, fL, fB);
  baseGrad.addColorStop(0, 'rgba(88, 28, 135, 0.3)');
  baseGrad.addColorStop(1, 'rgba(60, 20, 90, 0.4)');
  ctx.fillStyle = baseGrad;
  ctx.fillRect(fL, fB - baseH, fW, baseH);
  ctx.strokeStyle = 'rgba(167, 139, 250, 0.2)';
  ctx.lineWidth = 0.5;
  ctx.beginPath();
  ctx.moveTo(fL, fB - baseH);
  ctx.lineTo(fR, fB - baseH);
  ctx.stroke();

  // ━━━━ REELS ━━━━
  var reelR = fW * 0.19;
  var reelCY = fT + fH * 0.22;
  var reelLx = fL + fW * 0.30;
  var reelRx = fL + fW * 0.70;
  var spokeAngle = t * 1.2;

  var supplyTR = reelR * (0.5 + Math.sin(t * 0.15) * 0.04);
  var takeupTR = reelR * (0.78 - Math.sin(t * 0.15) * 0.04);

  for (var ri = 0; ri < 2; ri++) {
    var rcx = ri === 0 ? reelLx : reelRx;
    var tapeAmt = ri === 0 ? supplyTR : takeupTR;

    // Tape wound — filled gradient
    if (tapeAmt > 4) {
      var tapeGrad = ctx.createRadialGradient(rcx, reelCY, 0, rcx, reelCY, tapeAmt);
      tapeGrad.addColorStop(0, 'rgba(139, 92, 246, ' + (0.18 * pulse) + ')');
      tapeGrad.addColorStop(0.7, 'rgba(88, 28, 135, ' + (0.1 * pulse) + ')');
      tapeGrad.addColorStop(1, 'rgba(88, 28, 135, 0.04)');
      ctx.beginPath();
      ctx.arc(rcx, reelCY, tapeAmt, 0, Math.PI * 2);
      ctx.fillStyle = tapeGrad;
      ctx.fill();
      ctx.strokeStyle = 'rgba(167, 139, 250, ' + (0.2 * pulse) + ')';
      ctx.lineWidth = 0.5;
      ctx.stroke();
    }

    // Reel flange — filled metallic disc
    var flangeGrad = ctx.createRadialGradient(rcx - 3 * sc, reelCY - 3 * sc, 0, rcx, reelCY, reelR);
    flangeGrad.addColorStop(0, 'rgba(196, 181, 253, ' + (0.18 * pulse) + ')');
    flangeGrad.addColorStop(0.5, 'rgba(139, 92, 246, ' + (0.08 * pulse) + ')');
    flangeGrad.addColorStop(1, 'rgba(88, 28, 135, 0.03)');
    ctx.beginPath();
    ctx.arc(rcx, reelCY, reelR, 0, Math.PI * 2);
    ctx.fillStyle = flangeGrad;
    ctx.fill();

    // Outer flange ring — glowing
    ctx.shadowColor = 'rgba(167, 139, 250, 0.45)';
    ctx.shadowBlur = 6;
    ctx.beginPath();
    ctx.arc(rcx + jit(0.3), reelCY + jit(0.3), reelR, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(167, 139, 250, ' + (0.7 * pulse) + ')';
    ctx.lineWidth = 1.3;
    ctx.stroke();
    ctx.shadowBlur = 0;

    // 3 spokes — rotating
    for (var si = 0; si < 3; si++) {
      var a = spokeAngle + si * Math.PI * 2 / 3;
      var hubD = reelR * 0.25;
      var flangeD = reelR * 0.88;
      ctx.beginPath();
      ctx.moveTo(rcx + Math.cos(a) * hubD, reelCY + Math.sin(a) * hubD);
      ctx.lineTo(rcx + Math.cos(a) * flangeD, reelCY + Math.sin(a) * flangeD);
      ctx.strokeStyle = 'rgba(196, 181, 253, ' + (0.4 * pulse) + ')';
      ctx.lineWidth = 0.9;
      ctx.stroke();
    }

    // Hub — filled bright
    ctx.shadowColor = 'rgba(196, 181, 253, 0.5)';
    ctx.shadowBlur = 4;
    ctx.beginPath();
    ctx.arc(rcx, reelCY, reelR * 0.22, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(58, 32, 80, 0.6)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(196, 181, 253, ' + (0.65 * pulse) + ')';
    ctx.lineWidth = 0.9;
    ctx.stroke();
    ctx.shadowBlur = 0;

    // Center spindle
    ctx.shadowColor = 'rgba(196, 181, 253, 0.5)';
    ctx.shadowBlur = 3;
    ctx.beginPath();
    ctx.arc(rcx, reelCY, 2, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(196, 181, 253, ' + (0.7 * pulse) + ')';
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  // ━━━━ TAPE PATH ━━━━
  var headY = fT + fH * 0.40;
  var headCX = fL + fW * 0.5;
  var gLx = fL + fW * 0.24;
  var gRx = fL + fW * 0.76;
  var gY = fT + fH * 0.34;

  // Tape glow underlayer
  ctx.shadowColor = 'rgba(139, 92, 246, 0.3)';
  ctx.shadowBlur = 5;
  ctx.beginPath();
  ctx.moveTo(reelLx + supplyTR * 0.7, reelCY + supplyTR * 0.7);
  ctx.lineTo(gLx, gY);
  ctx.lineTo(headCX, headY + 4 * sc);
  ctx.lineTo(gRx, gY);
  ctx.lineTo(reelRx - takeupTR * 0.7, reelCY + takeupTR * 0.7);
  ctx.strokeStyle = 'rgba(139, 92, 246, 0.1)';
  ctx.lineWidth = 4;
  ctx.stroke();
  ctx.shadowBlur = 0;

  // Actual tape path with wobble
  ctx.beginPath();
  ctx.moveTo(reelLx + supplyTR * 0.7, reelCY + supplyTR * 0.7);
  ctx.lineTo(gLx, gY);
  ctx.lineTo(headCX - 12 * sc, headY);
  var wobSegs = 16;
  for (var ws = 0; ws <= wobSegs; ws++) {
    var f = ws / wobSegs;
    var mx = (headCX - 12 * sc) + (24 * sc) * f;
    var wb = wow * 2 * Math.sin(t * 3 + f * Math.PI * 5) * Math.sin(f * Math.PI);
    ctx.lineTo(mx + jit(0.2), headY + wb + jit(0.2));
  }
  ctx.lineTo(gRx, gY);
  ctx.lineTo(reelRx - takeupTR * 0.7, reelCY + takeupTR * 0.7);
  ctx.strokeStyle = 'rgba(196, 181, 253, ' + (0.8 * pulse) + ')';
  ctx.lineWidth = 1.1;
  ctx.stroke();

  // Guide rollers — filled
  var guidePoints = [{x:gLx,y:gY}, {x:gRx,y:gY}];
  for (var gpi = 0; gpi < guidePoints.length; gpi++) {
    var gp = guidePoints[gpi];
    ctx.shadowColor = 'rgba(196, 181, 253, 0.4)';
    ctx.shadowBlur = 3;
    ctx.beginPath();
    ctx.arc(gp.x, gp.y, 2.5, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(88, 28, 135, 0.5)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(196, 181, 253, ' + (0.6 * pulse) + ')';
    ctx.lineWidth = 0.7;
    ctx.stroke();
    ctx.shadowBlur = 0;
  }

  // ━━━━ HEAD ASSEMBLY — filled block ━━━━
  var hdW = 26 * sc;
  var hdH = 6 * sc;

  ctx.shadowColor = 'rgba(196, 181, 253, 0.4)';
  ctx.shadowBlur = 5;
  var headGrad = ctx.createLinearGradient(headCX - hdW/2, headY, headCX + hdW/2, headY);
  headGrad.addColorStop(0, 'rgba(58, 32, 80, 0.7)');
  headGrad.addColorStop(0.5, 'rgba(50, 25, 72, 0.8)');
  headGrad.addColorStop(1, 'rgba(58, 32, 80, 0.7)');
  ctx.beginPath();
  ctx.rect(headCX - hdW/2, headY - hdH/2, hdW, hdH);
  ctx.fillStyle = headGrad;
  ctx.fill();
  ctx.strokeStyle = 'rgba(196, 181, 253, ' + (0.6 * pulse) + ')';
  ctx.lineWidth = 0.7;
  ctx.stroke();
  ctx.shadowBlur = 0;

  // Head gaps (3 heads)
  for (var hi = 0; hi < 3; hi++) {
    var hgx = headCX - 5 * sc + hi * 5 * sc;
    ctx.beginPath();
    ctx.moveTo(hgx, headY - hdH/2 + 1.5);
    ctx.lineTo(hgx, headY + hdH/2 - 1.5);
    ctx.strokeStyle = 'rgba(196, 181, 253, ' + (0.35 * pulse) + ')';
    ctx.lineWidth = 0.6;
    ctx.stroke();
  }

  // Saturation glow on head
  if (sat > 0.02) {
    var glowR = 10 * sc + sat * 14 * sc;
    var satGrad = ctx.createRadialGradient(headCX, headY, 0, headCX, headY, glowR);
    satGrad.addColorStop(0, 'rgba(139, 92, 246, ' + (sat * 0.22) + ')');
    satGrad.addColorStop(1, 'rgba(139, 92, 246, 0)');
    ctx.fillStyle = satGrad;
    ctx.beginPath();
    ctx.arc(headCX, headY, glowR, 0, Math.PI * 2);
    ctx.fill();
  }

  // ━━━━ HORIZONTAL SLOT — filled ━━━━
  var slotY = fT + fH * 0.50;
  var slotW = fW * 0.7;
  var slotH = fH * 0.05;
  ctx.beginPath();
  ctx.rect(fL + (fW - slotW)/2, slotY, slotW, slotH);
  ctx.fillStyle = 'rgba(20, 8, 35, 0.5)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(167, 139, 250, ' + (0.2 * pulse) + ')';
  ctx.lineWidth = 0.5;
  ctx.stroke();

  // ━━━━ VU METERS — filled ━━━━
  var vuW = 18 * sc;
  var vuH = 12 * sc;
  var vuY = fT + fH * 0.60;
  var vuLx = fL + fW * 0.22;
  var vuRxP = fL + fW * 0.52;

  for (var vi = 0; vi < 2; vi++) {
    var vx = vi === 0 ? vuLx : vuRxP;

    // VU body — dark filled
    ctx.beginPath();
    ctx.rect(vx, vuY, vuW, vuH);
    ctx.fillStyle = 'rgba(20, 8, 35, 0.55)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(167, 139, 250, ' + (0.35 * pulse) + ')';
    ctx.lineWidth = 0.6;
    ctx.stroke();

    var vCx = vx + vuW / 2;
    var vCy = vuY + vuH * 0.85;
    var arcR = vuW * 0.35;

    // VU arc
    ctx.beginPath();
    ctx.arc(vCx, vCy, arcR, Math.PI + 0.3, -0.3);
    ctx.strokeStyle = 'rgba(167, 139, 250, ' + (0.25 * pulse) + ')';
    ctx.lineWidth = 0.4;
    ctx.stroke();

    // Tick marks
    for (var ti = 0; ti <= 6; ti++) {
      var ta = Math.PI + 0.3 + (ti / 6) * (Math.PI - 0.6);
      ctx.beginPath();
      ctx.moveTo(vCx + Math.cos(ta) * (arcR - 1.5), vCy + Math.sin(ta) * (arcR - 1.5));
      ctx.lineTo(vCx + Math.cos(ta) * arcR, vCy + Math.sin(ta) * arcR);
      ctx.strokeStyle = 'rgba(196, 181, 253, ' + (0.2 + (ti > 4 ? 0.15 : 0)) + ')';
      ctx.lineWidth = 0.3;
      ctx.stroke();
    }

    // Needle — glowing
    var nv = sat * 0.5 + hiss * 0.3 + Math.sin(t * 2.5 + vi * 1.3) * 0.08;
    var na = Math.PI + 0.3 + Math.min(1, nv) * (Math.PI - 0.6);
    ctx.shadowColor = 'rgba(196, 181, 253, 0.3)';
    ctx.shadowBlur = 2;
    ctx.beginPath();
    ctx.moveTo(vCx, vCy);
    ctx.lineTo(vCx + Math.cos(na) * (arcR + 1), vCy + Math.sin(na) * (arcR + 1));
    ctx.strokeStyle = 'rgba(196, 181, 253, ' + (0.6 * pulse) + ')';
    ctx.lineWidth = 0.6;
    ctx.stroke();
    ctx.shadowBlur = 0;

    // Pivot
    ctx.beginPath();
    ctx.arc(vCx, vCy, 0.9, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(196, 181, 253, 0.5)';
    ctx.fill();
  }

  // ━━━━ TRANSPORT BUTTONS — filled ━━━━
  var btnY = fT + fH * 0.76;
  var btnSz = 5 * sc;
  var btnGap = btnSz + 2 * sc;
  var btnStartX = fL + fW * 0.5 - (btnGap * 2.5);

  for (var bi = 0; bi < 5; bi++) {
    var bx = btnStartX + bi * btnGap;
    // All purple tones — brand consistent
    var btnAlpha = 0.25 + bi * 0.04;
    var btnGradV = ctx.createLinearGradient(bx, btnY, bx, btnY + btnSz);
    btnGradV.addColorStop(0, 'rgba(139, 92, 246, ' + (btnAlpha + 0.1) + ')');
    btnGradV.addColorStop(1, 'rgba(88, 28, 135, ' + btnAlpha + ')');
    ctx.beginPath();
    ctx.roundRect(bx, btnY, btnSz, btnSz, 1);
    ctx.fillStyle = btnGradV;
    ctx.fill();
    ctx.strokeStyle = 'rgba(167, 139, 250, ' + (0.3 * pulse) + ')';
    ctx.lineWidth = 0.5;
    ctx.stroke();
  }

  // ━━━━ SPARKS (hiss) ━━━━
  if (hiss > 0.02) {
    var nSparks = Math.floor(hiss * 24);
    for (var ski = 0; ski < nSparks; ski++) {
      var skpX = fL + fW * 0.1 + Math.sin(t * 4.3 + ski * 3.1) * fW * 0.4;
      var skpY = fT + fH * 0.1 + Math.cos(t * 3.7 + ski * 2.7) * fH * 0.4;
      var skpLen = 2 + Math.sin(t * 6 + ski) * 1.5;
      var skpA = t * 2 + ski * 1.4;
      var spkAlpha = hiss * 0.5 + Math.sin(t * 8 + ski) * 0.1;
      ctx.shadowColor = 'rgba(167,139,250,0.3)';
      ctx.shadowBlur = 2;
      ctx.beginPath();
      ctx.moveTo(skpX, skpY);
      ctx.lineTo(skpX + Math.cos(skpA) * skpLen, skpY + Math.sin(skpA) * skpLen);
      ctx.lineTo(skpX + Math.cos(skpA + 0.8) * skpLen * 0.6, skpY + Math.sin(skpA + 0.8) * skpLen * 0.6);
      ctx.strokeStyle = 'rgba(196,181,253,' + spkAlpha + ')';
      ctx.lineWidth = 0.5;
      ctx.stroke();
    }
    ctx.shadowBlur = 0;
  }

  // ━━━━ NAMEPLATE ━━━━
  var npW = 40 * sc;
  var npH = 8 * sc;
  var npX = fL + fW / 2 - npW / 2;
  var npY = fB - baseH - 12 * sc;

  ctx.beginPath();
  ctx.rect(npX, npY, npW, npH);
  ctx.fillStyle = 'rgba(139, 92, 246, 0.08)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(167, 139, 250, ' + (0.3 * pulse) + ')';
  ctx.lineWidth = 0.4;
  ctx.stroke();

  ctx.font = '500 ' + Math.max(4, 4 * sc) + 'px -apple-system, system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = 'rgba(196, 181, 253, ' + (0.6 * pulse) + ')';
  ctx.fillText('S T U D I O', fL + fW / 2, npY + npH / 2);

  // Side face vent lines — subtle
  ctx.globalAlpha = 0.12;
  for (var vli = 0; vli < 5; vli++) {
    var vy = fT + fH * (0.55 + vli * 0.06);
    ctx.beginPath();
    ctx.moveTo(fR + 3, vy + dY * (vy - fT) / fH);
    ctx.lineTo(fR + dX - 3, vy + dY);
    ctx.strokeStyle = 'rgba(167, 139, 250, 1)';
    ctx.lineWidth = 0.5;
    ctx.stroke();
  }
  ctx.globalAlpha = 1.0;

  // ━━━━ INDICATOR LIGHTS (vintage R/Y/G) ━━━━
  var indY = fT + fH * 0.89;
  var indStartX = fL + fW * 0.72;
  var indGap = 6.5 * sc;
  var indR = 2.2 * sc;

  // Each light: color, base brightness tied to a parameter, unique flicker phase
  var lights = [
    { r: 239, g: 68, b: 68, param: hiss, phase: 0 },       // Red — hiss
    { r: 234, g: 179, b: 8, param: sat, phase: 2.1 },       // Yellow — saturation
    { r: 34, g: 197, b: 94, param: wow, phase: 4.3 },       // Green — wow
  ];

  for (var li = 0; li < lights.length; li++) {
    var light = lights[li];
    var lx = indStartX + li * indGap;
    var ly = indY;

    // Vintage flicker: base brightness from param, with random-ish dips
    var baseBright = 0.3 + light.param * 0.5;
    // Multi-frequency flicker — occasionally dips low like a dying bulb
    var flicker = Math.sin(t * 3.7 + light.phase) * 0.12
                + Math.sin(t * 7.3 + light.phase * 1.6) * 0.08
                + Math.sin(t * 13.1 + light.phase * 2.4) * 0.05;
    // Occasional deeper dip (vintage brownout)
    var brownout = Math.pow(Math.sin(t * 0.8 + light.phase * 3.1), 8) * 0.35;
    var brightness = Math.max(0.08, baseBright + flicker - brownout);

    // Dark socket recess
    ctx.beginPath();
    ctx.arc(lx, ly, indR + 0.8, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(15, 6, 25, 0.5)';
    ctx.fill();

    // Glow halo
    ctx.shadowColor = 'rgba(' + light.r + ',' + light.g + ',' + light.b + ',' + (brightness * 0.6) + ')';
    ctx.shadowBlur = 6 * brightness;

    // The light itself
    ctx.beginPath();
    ctx.arc(lx, ly, indR, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(' + light.r + ',' + light.g + ',' + light.b + ',' + brightness + ')';
    ctx.fill();

    // Hot center highlight
    ctx.beginPath();
    ctx.arc(lx - 0.5, ly - 0.5, indR * 0.4, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255, 255, 255, ' + (brightness * 0.3) + ')';
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  ctx.restore();
}

var time = 0;
function animate() {
  time += 1 / 60;
  var ctx = canvas.getContext('2d');
  drawStudioViz(ctx, W, H, time);
  requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
