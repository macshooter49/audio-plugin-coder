<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>Terrain Settings (mockup)</title>
<!--
  TERRAIN · SETTINGS — standalone, interactive, AUDIBLE mockup (Design/, not wired into the plugin).
  Opens by double-click in Safari. No imports, no libraries. Research: .ideas/settings-research.md.
  What you can HEAR: Audio & MIDI → Test audio (a real Web Audio chime, left / both / right), the velocity
  keys under the curve (MIDI & Controllers), the computer keyboard (A W S E D F T G Y H U J K), and — in Chrome —
  any real MIDI keyboard you tick under MIDI inputs (Web MIDI; Safari has none, so the ports are mocked there).
  NO NEW FURNITURE — every control below is a copy of one Terrain already ships (index.html line refs):
     header, pills, dice, gear ........... #header 7093-7131, .mod-btn 3518-3567, .settings-btn / .dice-btn 3570-3598,
                                           drawSettingsIcon 15485 (the gear, verbatim)
     the settings surface ................ #tp-b, the PRESET BROWSER'S glass sheet 1664-1780 + markup 42397: .tb toolbar,
                                           .sw search, .count, .ibtn ×, .rail .sec/.ri (the bank rail = the category rail),
                                           .insp inspector (.nm .sub .kv .k .v .notes .acts) = the context column
     fields ............................... #tp-sheet .tp-in (the Save sheet's field, 1856) — text AND pick-from-menu fields
     buttons .............................. .tp-btn / .tp-btn.pri (1818-1826)      choices ... .tp-chip / .active (1689-1695)
     tags ................................. .tp-row .tag (purple 9px, 1755)         toast ..... #tp-toast (1918)
     menus ................................ .pmenu glass (.ps/.pi/.pi.cur bullet) + the house clamp (flips up at the bottom)
     sheets ............................... #tp-sheet .tp-card (the Save sheet: registration + the Save preset demo)
     progress ............................. #tp-load .bar (the preset loading bar)
     number drag .......................... the Settings "Pitch bend range" row (7206-7209): drag the number, double-click resets
     slider / meter / dots / knob / keys .. .ti-card kit: .tr (+ i.lv lamp), .sd slot dot, TIC.knobSVG + dragify, .gbox/.gbl,
                                           .fxb tiles (the keys), .crv = the Shaper screen (velocity curve)
  Mockup-only (outside the 820×656 box): the "build status" switch under the window, which tags every row
  live (exists in Terrain today) or new (needs C++) and adds the where/stored/C++ lines to the inspector.
-->
<style>
/* ═══ tokens — index.html :root[data-theme=dark] (1339-1366), verbatim ═══ */
:root{
  --bg-main:#1A1A2E; --bg-hero:#12121F; --bg-surface:#232340; --bg-footer:#1E1E36; --bg-card:#2A2A48;
  --purple-600:#9B6DFF; --purple-500:#8B5CF6; --purple-400:#B794FF;
  --border:rgba(58,58,88,0.5); --border-strong:rgba(88,88,128,0.5);
  --text-primary:#E0DCE8; --text-secondary:#9B93B0; --text-muted:#6B6080; --text-dim:#504870;
  --text-soft:#C4BDD6; --rose:#f43f5e;
  --menu-bg:rgba(22,20,34,0.72); --menu-fg:#fff; --menu-fg-dim:rgba(255,255,255,.78); --menu-fg-faint:rgba(255,255,255,.50);
  --menu-line:rgba(255,255,255,0.11); --menu-wash:rgba(139,92,246,0.18); --sel-fg:#B794FF;
  --edge:rgba(255,255,255,0.45); --edge-soft:rgba(255,255,255,0.22); --on-fg:#fff; --wash:rgba(18,18,31,0.82);
  --ghost:rgba(255,255,255,0.55); --ghost-dim:rgba(255,255,255,0.34); --gray:#9b93a8;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{background:#0d0d18;}
body{background:#0d0d18;font-family:-apple-system,'SF Pro Display','Inter','Segoe UI',system-ui,sans-serif;-webkit-font-smoothing:antialiased;
  min-height:100vh;display:flex;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none;}
#plugin{width:820px;height:656px;position:relative;overflow:hidden;
  background:radial-gradient(ellipse at top, rgba(139,92,246,0.04), transparent 60%), var(--bg-main);
  box-shadow:0 30px 80px rgba(0,0,0,.6);border-radius:6px;}
button,input{font-family:inherit;}

/* ═══ HEADER — #header / .header-left / .header-preset / .header-right (1397-1617), as the mod-matrix mockup ═══ */
#header{height:44px;display:flex;align-items:center;padding:0 16px;justify-content:flex-end;background:transparent;position:relative;z-index:20;}
.header-left{position:absolute;left:50%;top:0;height:44px;transform:translateX(-50%);display:flex;align-items:center;gap:8px;}
.brand-name{font-weight:600;font-size:18px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-primary);}
.brand-version{font-size:10px;letter-spacing:1.5px;color:var(--text-muted);margin-left:-2px;padding-top:3px;}
.header-preset{position:absolute;left:16px;top:0;height:44px;display:flex;align-items:center;gap:6px;}
.preset-nav-btn,.preset-save-btn{height:24px;min-width:20px;border:1px solid transparent;background:transparent;color:var(--text-secondary);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;transition:all .1s;font-family:inherit;}
.preset-save-btn{font-size:16px;line-height:1;}
.preset-nav-btn:hover,.preset-save-btn:hover{color:var(--purple-400);}
.preset-name{font-weight:500;font-size:13px;letter-spacing:.4px;color:var(--text-primary);text-align:center;cursor:pointer;transition:opacity .15s,color .15s;
  min-width:0;width:128px;max-width:236px;padding:0 6px;height:28px;line-height:28px;border-radius:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.preset-name:hover{color:var(--purple-400);}
.header-right{display:flex;align-items:center;justify-content:flex-end;gap:6px;flex-shrink:0;}
.mod-btn{position:relative;display:flex;align-items:center;justify-content:center;padding:3px 10px;border-radius:12px;border:1.5px solid rgba(139,92,246,0.2);
  background:transparent;cursor:pointer;font-size:9px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-secondary);
  padding-left:11.5px;padding-right:10px;margin-left:12px;transition:all 0.2s ease;flex-shrink:0;font-family:inherit;}
.mod-btn:hover{border-color:rgba(139,92,246,0.4);color:var(--purple-500);}
.mod-btn.active{background:transparent;border-color:var(--purple-400);color:var(--on-fg);}
/* .settings-btn / .dice-btn (3570-3598), verbatim */
.settings-btn{background:none;border:none;border-radius:6px;padding:4px;cursor:pointer;display:flex;align-items:center;justify-content:center;width:32px;height:28px;flex-shrink:0;margin-left:6px;}
.settings-btn:hover{background:none;opacity:.8;}
.dice-btn{color:var(--text-secondary);}
.dice-btn svg{width:19.5px;height:19.5px;display:block;}
.dice-btn:hover{color:var(--text-secondary);}
#dice-btn + .settings-btn{margin-left:0;}

/* ═══ .pmenu glass (4033-4053) + .tp-menu rows (1623-1648), verbatim ═══ */
.pmenu{position:fixed;z-index:2147483646;min-width:176px;max-width:206px;max-height:340px;overflow-y:auto;
  background:rgba(22,20,34,0.72);-webkit-backdrop-filter:blur(20px) saturate(1.4);backdrop-filter:blur(20px) saturate(1.4);
  border:1px solid rgba(255,255,255,0.11);border-radius:12px;box-shadow:0 20px 50px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.06);
  padding:5px;font-family:-apple-system,'SF Pro Text','Helvetica Neue',sans-serif;}
.pmenu .ps{font-size:9px;font-weight:500;letter-spacing:0;color:rgba(255,255,255,.50);padding:8px 9px 3px;}
.pmenu .pi{display:flex;align-items:center;gap:7px;padding:6px 9px;border-radius:6px;cursor:pointer;font-size:9.5px;letter-spacing:.5px;color:rgba(255,255,255,.5);transition:.1s;}
.pmenu .pi .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.pmenu .pi:hover{color:rgba(255,255,255,.86);background:rgba(255,255,255,0.05);}
.pmenu .pi.cur{color:#FFFFFF;background:rgba(255,255,255,0.07);}
.pmenu .pi.cur::before{content:'•';color:#fff;font-size:9px;line-height:1;flex:none;}
.pmenu .pi .ct{color:rgba(255,255,255,.26);font-size:8px;letter-spacing:0;flex:none;}
.pmenu .pi.off{opacity:.4;pointer-events:none;}
.pmenu::-webkit-scrollbar{width:5px;height:5px;} .pmenu::-webkit-scrollbar-track{background:transparent;}
.pmenu::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.13);border-radius:3px;}

/* ═══ the .ti-card kit (3937-4330) — only the pieces used here, verbatim ═══ */
.ti-card{font-family:-apple-system,'SF Pro Text','Helvetica Neue',sans-serif;font-variant-numeric:tabular-nums;user-select:none;-webkit-user-select:none;}
.ti-card .gbox{position:relative;border:1px solid rgba(255,255,255,.15);border-radius:9px;}
.ti-card .gbl{position:absolute;top:-4px;left:50%;transform:translateX(-50%);font-size:6px;letter-spacing:1.6px;text-transform:uppercase;line-height:8px;
  color:rgba(255,255,255,.92);background:#1A1A2E;padding:0 6px;white-space:nowrap;pointer-events:none;}
.ti-card .cell{display:flex;flex-direction:column;align-items:center;min-width:0;}
.ti-card .ctl{display:flex;align-items:flex-end;justify-content:center;width:100%;}
.ti-card .cell .lb{font-size:6.5px;letter-spacing:1.3px;text-transform:uppercase;color:rgba(255,255,255,.45);line-height:1;margin-top:6px;}
.ti-card .cell .vl{font-size:9px;color:rgba(255,255,255,.90);font-weight:500;line-height:1;margin-top:4px;min-height:9px;}
.ti-card .cell .lb,.ti-card .cell .vl{white-space:nowrap;max-width:100%;overflow:hidden;text-align:center;text-overflow:ellipsis;}
.ti-card .k svg{width:30px;height:30px;display:block;cursor:ns-resize;}
.ti-card .tr{position:relative;height:16px;width:100%;cursor:ew-resize;}
.ti-card .tr::before{content:'';position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);height:2px;border-radius:1px;background:rgba(255,255,255,0.16);}
.ti-card .tr u{position:absolute;left:50%;top:50%;width:1px;height:7px;transform:translate(-50%,-50%);background:rgba(255,255,255,0.28);pointer-events:none;}
.ti-card .tr i{position:absolute;top:50%;transform:translateY(-50%);height:2px;border-radius:1px;background:rgba(255,255,255,.92);pointer-events:none;}
.ti-card .tr b{position:absolute;top:50%;width:2px;height:9px;border-radius:1px;background:#fff;transform:translate(-50%,-50%);pointer-events:none;}
.ti-card .sd{display:flex;flex-direction:column;align-items:center;gap:4px;width:20px;cursor:pointer;}
.ti-card .sd i{width:7px;height:7px;border-radius:50%;border:1px solid rgba(255,255,255,.26);transition:background .12s,border-color .12s;}
.ti-card .sd:hover i{border-color:rgba(255,255,255,.55);}
.ti-card .sd.on i{background:rgba(255,255,255,.92);border-color:transparent;}
.ti-card .fxb{border:1px solid rgba(255,255,255,.20);border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;text-transform:uppercase;
  color:rgba(255,255,255,.50);transition:background .12s,color .12s,border-color .12s;}
.ti-card .fxb:hover{color:rgba(255,255,255,.85);}
.ti-card .fxb.on{background:rgba(255,255,255,.92);border-color:transparent;color:#1A1A2E;font-weight:600;}
.ti-card i.lv{background:#B794FF!important;box-shadow:0 0 4px rgba(183,148,255,.65);}
.ti-card .k svg .km{stroke:#B794FF;}
/* the Shaper screen (.shp-ext .screen + .mv-stroke) — the mod-matrix CRV box, grown */
.crv{position:relative;border-radius:4px;background:#0F0F1C;border:1px solid rgba(255,255,255,.06);overflow:hidden;cursor:ns-resize;touch-action:none;}
.crv svg{position:absolute;inset:0;width:100%;height:100%;display:block;}
.crv .mv-stroke{fill:none;stroke:#ECE8F2;stroke-width:1.2;filter:drop-shadow(0 0 2px rgba(183,148,255,0.85));vector-effect:non-scaling-stroke;}
.crv .grid line{stroke:rgba(255,255,255,.065);stroke-width:1;vector-effect:non-scaling-stroke;}
.crv .dt{fill:#fff;}

/* ═══ the synth page behind the glass (the mod-matrix mockup's #syn) ═══ */
#syn{position:absolute;left:0;right:0;top:44px;bottom:0;padding:14px 14px 14px;display:grid;grid-template-rows:repeat(4,minmax(0,1fr));gap:16px;}
#syn .row{display:grid;gap:10px;}
#syn .gbox{display:flex;align-items:center;justify-content:space-around;padding:12px 6px 8px;}
#syn .cell{flex:1;}

/* ═══ THE SETTINGS SURFACE = #tp-b, the preset browser's glass sheet (1664-1780), verbatim ═══ */
.tp-glass{background:var(--menu-bg);-webkit-backdrop-filter:blur(20px) saturate(1.4);backdrop-filter:blur(20px) saturate(1.4);}
#tp-b{position:absolute;left:0;right:0;top:44px;bottom:0;z-index:2000;display:none;flex-direction:column;color:var(--text-primary);font-family:inherit;}
#tp-b.on{display:flex;}
#tp-b .tb{height:38px;display:flex;align-items:center;gap:4px;padding:0 16px;border-bottom:1px solid var(--menu-line);flex:none;}
#tp-b .sw{position:relative;flex:1;max-width:300px;}
#tp-b .sw::before{content:'';position:absolute;left:1px;top:50%;transform:translateY(-50%);width:11px;height:11px;border:1.5px solid var(--text-secondary);border-radius:50%;pointer-events:none;}
#tp-b .sw::after{content:'';position:absolute;left:10px;top:calc(50% + 4px);width:4px;height:1.5px;background:var(--text-secondary);transform:rotate(45deg);pointer-events:none;}
#tp-b .search{width:100%;height:26px;border:none;border-radius:5px;padding:0 8px 0 21px;font-size:11.5px;background:transparent;color:var(--text-primary);outline:none;}
#tp-b .search::placeholder{color:var(--text-muted);}
#tp-b .count{margin-left:auto;font-size:10px;color:var(--text-soft);white-space:nowrap;margin-right:4px;}
#tp-b .count b{color:var(--text-primary);font-weight:500;}
#tp-b .ibtn{width:26px;height:26px;border:none;border-radius:5px;background:transparent;color:var(--text-soft);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;transition:color .15s,box-shadow .15s;}
#tp-b .ibtn:hover{color:var(--text-primary);box-shadow:inset 0 0 0 1px var(--edge-soft);}
#tp-b .ibtn svg{width:15px;height:15px;}
.tp-chip{padding:4px 9px;border:1px solid var(--edge-soft);border-radius:4px;background:transparent;font-size:9.5px;font-weight:500;color:var(--text-soft);cursor:pointer;transition:color .15s,border-color .15s;white-space:nowrap;line-height:1.2;flex:none;font-family:inherit;
  max-width:100%;overflow:hidden;text-overflow:ellipsis;}
.tp-chip:hover{color:var(--text-primary);}
.tp-chip.active{background:transparent;border-color:var(--purple-400);color:var(--on-fg);}
.tp-chip.add{border-style:dashed;color:var(--purple-400);padding:0;width:22px;height:20px;display:flex;align-items:center;justify-content:center;margin-right:2px;}
.tp-chip.add svg{width:11px;height:11px;}
.tp-chip.add:hover{border-color:var(--purple-400);color:var(--on-fg);}
#tp-b .body{flex:1;min-height:0;display:flex;}
#tp-b .rail{width:138px;flex:none;border-right:1px solid var(--menu-line);overflow-y:auto;padding:8px 0 12px;scrollbar-width:none;}
#tp-b .rail::-webkit-scrollbar,#tp-b .insp::-webkit-scrollbar{width:0;height:0;display:none;}
#tp-b .rail .sec{font-size:10px;font-weight:500;color:var(--text-soft);padding:12px 16px 5px;}
#tp-b .rail .ri{display:flex;align-items:center;gap:7px;height:23px;padding:0 16px 0 14px;cursor:pointer;font-size:10.5px;color:var(--text-soft);border-left:2px solid transparent;transition:color .1s,background .1s;}
#tp-b .rail .ri .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
#tp-b .rail .ri .ct{font-size:9.5px;color:var(--text-secondary);}
#tp-b .rail .ri:hover{color:var(--text-primary);background:rgba(127,127,160,0.07);}
#tp-b .rail .ri.cur{color:var(--sel-fg);border-left-color:var(--purple-500);background:transparent;}
#tp-b .rail .ri.cur .ct{color:var(--sel-fg);}
#tp-b .rail .ri svg{width:11px;height:11px;flex:none;}
.tp-row .tag,.tag{font-size:9px;font-weight:500;color:var(--purple-400);flex:none;}
.tp-row .tag.user,.tag.user{color:var(--text-secondary);}
#tp-b .insp{width:224px;flex:none;border-left:1px solid var(--menu-line);display:flex;flex-direction:column;overflow:hidden;}
#tp-b .iscroll{flex:1;min-height:0;overflow-y:auto;padding:14px 18px 14px;}
#tp-b .iscroll::-webkit-scrollbar{width:5px;height:5px;}
#tp-b .iscroll::-webkit-scrollbar-track{background:transparent;}
#tp-b .iscroll::-webkit-scrollbar-thumb{background:rgba(127,127,160,0.25);border-radius:3px;}
#tp-b .iscroll::-webkit-scrollbar-thumb:hover{background:rgba(127,127,160,0.45);}
#tp-b .insp .nm{font-size:13px;font-weight:500;color:var(--text-primary);line-height:1.3;letter-spacing:.2px;}
#tp-b .insp .sub{margin-top:3px;min-height:14px;font-size:10px;font-weight:500;color:var(--text-secondary);line-height:14px;}
#tp-b .insp .kv{display:grid;grid-template-columns:52px 1fr;row-gap:5px;column-gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--menu-line);}
#tp-b .insp .k{font-size:10px;font-weight:500;color:var(--text-soft);line-height:14px;}
#tp-b .insp .v{font-size:10.5px;color:var(--text-primary);line-height:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#tp-b .insp .notes{margin-top:12px;padding-top:12px;border-top:1px solid var(--menu-line);}
#tp-b .insp .notes .k{margin-bottom:4px;}
.tp-notebox{min-height:34px;border-radius:6px;padding:5px 7px;margin:0 -7px;font-size:10.5px;line-height:1.45;color:var(--text-primary);outline:none;white-space:pre-wrap;word-break:break-word;}
#tp-b .insp .acts{flex:none;display:flex;gap:6px;padding:10px 18px 12px;border-top:1px solid var(--menu-line);}
.tp-btn{height:28px;border:1px solid var(--edge-soft);border-radius:6px;background:transparent;color:var(--text-soft);font-size:10.5px;font-weight:500;cursor:pointer;padding:0 12px;display:flex;align-items:center;justify-content:center;gap:6px;transition:border-color .15s,color .15s;font-family:inherit;}
.tp-btn:hover{color:var(--text-primary);border-color:var(--edge);}
.tp-btn.pri{border-color:var(--purple-400);color:var(--on-fg);flex:1;}
.tp-btn.pri:hover{border-color:var(--purple-600);}
.tp-btn:disabled{opacity:.3;pointer-events:none;}

/* ═══ SHEETS — #tp-sheet (1829-1881), verbatim; its .tp-in field is shared with the settings pane ═══ */
#tp-sheet{position:absolute;inset:0;z-index:2100;background:var(--wash);display:none;align-items:center;justify-content:center;color:var(--text-primary);}
#tp-sheet.on{display:flex;}
#tp-sheet .tp-card{width:340px;display:flex;flex-direction:column;max-height:calc(100% - 56px);background:var(--menu-bg);
  -webkit-backdrop-filter:blur(20px) saturate(1.4);backdrop-filter:blur(20px) saturate(1.4);
  border:1px solid var(--menu-line);border-radius:12px;padding:20px 22px 18px;box-shadow:0 20px 50px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.06);}
#tp-sheet .tp-card.wide{width:480px;max-width:calc(100% - 80px);}
#tp-sheet .tp-hd{font-size:11.5px;font-weight:500;color:var(--text-primary);margin-bottom:14px;flex:none;}
#tp-sheet .tp-sbody{flex:1;min-height:0;overflow-y:auto;margin:0 -6px;padding:0 6px;}
#tp-sheet .tp-f{display:grid;grid-template-columns:56px 1fr;align-items:center;column-gap:10px;row-gap:9px;}
#tp-sheet .tp-f .k{font-size:10px;font-weight:500;color:var(--text-soft);align-self:start;padding-top:7px;}
#tp-sheet .tp-f .v{font-size:10.5px;color:var(--text-primary);padding-top:6px;line-height:1.5;}
#tp-sheet .tp-in,#tp-b .tp-in{height:28px;border:1px solid var(--menu-line);border-radius:5px;padding:0 9px;font-size:11px;background:rgba(255,255,255,0.05);color:var(--text-primary);outline:none;width:100%;font-family:inherit;}
#tp-sheet .tp-in:focus,#tp-b .tp-in:focus{border-color:var(--purple-400);background:rgba(255,255,255,0.07);}
#tp-sheet .tp-in::placeholder,#tp-b .tp-in::placeholder{color:var(--text-muted);}
#tp-sheet .tp-note-in{height:auto;min-height:46px;max-height:108px;overflow-y:auto;padding:6px 9px;line-height:1.45;white-space:pre-wrap;word-break:break-word;text-align:left;cursor:text;user-select:text;-webkit-user-select:text;}
#tp-sheet .tp-note-in:empty::before{content:attr(data-ph);color:var(--text-muted);}
#tp-sheet .chp{display:flex;flex-wrap:wrap;gap:4px;align-items:center;}
#tp-sheet .tp-acts{display:flex;gap:6px;margin-top:18px;justify-content:flex-end;flex:none;}
#tp-sheet .tp-acts .tp-btn.pri{flex:none;padding:0 18px;}
#tp-sheet .tp-note{margin-top:10px;font-size:9.5px;color:var(--text-secondary);line-height:1.5;}
#tp-sheet .tp-text{font-size:11px;color:var(--text-primary);line-height:1.55;}
#tp-sheet .tp-text b{font-weight:500;}
/* #tp-load .bar (1913-1914) — the preset loading bar, re-used for "sending", "verifying", "scanning", "checking" */
.ld{height:2px;background:var(--border-strong);border-radius:1px;overflow:hidden;}

function renderRail(){ var r=$('st-rail'); r.innerHTML='';
  PAGES.forEach(function(p){ if(p.sec){ r.appendChild(el('<div class="sec">'+esc(p.sec)+'</div>')); return; }
    var n=ROWS.filter(function(x){ return x.p===p.id && (x.ctl||x.blk) && x.blk!=='hero' && x.blk!=='wc'; }).length;
    var d=el('<div class="ri'+(p.id===cur&&!q?' cur':'')+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+p.ic+'</svg><span class="nm">'+esc(p.short||p.name)+'</span>'+(p.soon?'<span class="tag">Soon</span>':'<span class="ct">'+n+'</span>')+'</div>');

function go(id,flashId){ cur=id; q=''; $('st-search').value=''; closeMenu(); renderRail(); paintPage(); $('pane').scrollTop=0;

function ctlEl(r){ var c=r.ctl, lane=el('<div class="lane"></div>');
  if(c.t==='chips'){ c.opts.forEach(function(o){ var b=el('<button class="tp-chip'+(String(c.get())===o?' active':'')+'">'+esc(o)+(c.unit&&o===c.opts[c.opts.length-1]?'':'')+'</button>');
      b.onclick=function(){ c.set(o); save(); after(r); }; lane.appendChild(b); });
    if(c.unit) lane.appendChild(el('<span class="val dim" style="margin-left:4px">'+esc(c.unit)+'</span>')); }
  else if(c.t==='menu'){ var v=c.get(), f=el('<div class="tp-in dd"><span class="v"></span>'+CHEV+'</div>');
    f.querySelector('.v').innerHTML=c.fmt?c.fmt(v):esc(v);
    f.onclick=function(){ openMenu(c.opts().map(function(o){ if(o.sec) return o; var val=o.value!=null?o.value:o.label;
        return {label:o.label,ct:o.ct,off:o.off,cur:String(val)===String(c.get()),onPick:function(){ c.set(val); save(); after(r); }}; }),f); };
    lane.appendChild(f); }
  else if(c.t==='text'){ var i=el('<input class="tp-in" type="text" maxlength="30" spellcheck="false">'); i.value=c.get(); i.placeholder=c.ph||'';
    i.oninput=function(){ c.set(i.value); save(); paintInsp(); var cr=document.querySelector('[data-row="credit"] .val'); if(cr) cr.textContent=RID.credit.ctl.get(); };
    i.onkeydown=function(e){ e.stopPropagation(); if(e.key==='Enter') i.blur(); }; lane.appendChild(i); }
  else if(c.t==='info'){ lane.appendChild(el('<span class="val" style="flex:1">'+esc(c.get())+'</span>'));
    if(c.link){ var b=el('<button class="tp-btn">'+esc(c.link.label)+'</button>'); if(c.link.soon) b.disabled=true; b.onclick=function(){ go(c.link.go,'author'); }; lane.appendChild(b); } }
  else if(c.t==='path'){ var pth=c.get(), seg=pth.split('/'), sp=el('<span class="val dim" style="flex:1" title="'+esc(pth)+'"></span>'); sp.textContent=seg[0]+'/…/'+seg.slice(-2).join('/'); lane.appendChild(sp);
    var rv=el('<button class="tp-btn">Reveal</button>'); rv.onclick=function(){ toast('Opens <span class="tp-bk">'+esc(pth.split('/').slice(-2).join('/'))+'</span> in Finder'); }; lane.appendChild(rv); }
  else if(c.t==='num'){ var n=el('<span class="num"><b></b><span>'+esc(c.unit)+'</span></span>'), bEl=n.querySelector('b');
    function paintN(){ bEl.textContent=c.fmt(S[c.key]); }
    paintN(); var span=function(){ return 260; };
    dragify(bEl,{get:function(){ return (S[c.key]-c.min)/(c.max-c.min); },set:function(u){ S[c.key]=Math.round((c.min+u*(c.max-c.min))/c.step)*c.step; paintN(); save(); if(r.id==='buf') paintPage(); },span:span,reset:(c.reset-c.min)/(c.max-c.min)});
    lane.appendChild(n);
    if(c.tap){ var taps=[]; var tb=el('<button class="tp-btn" style="margin-left:auto">Tap</button>'); tb.onclick=function(){ var t=performance.now(); taps=taps.filter(function(x){ return t-x<2000; }); taps.push(t);
        if(taps.length>1){ var d=(taps[taps.length-1]-taps[0])/(taps.length-1); S.tempo=Math.max(40,Math.min(240,Math.round(60000/d))); paintN(); save(); } }; lane.appendChild(tb); } }
  else if(c.t==='slider'){ var tr=el('<div class="tr"><i style="left:0"></i><b></b></div>'), vl=el('<span class="val" style="width:44px;text-align:right;flex:none"></span>');
    function paintS(){ var p=c.get()*100; tr.querySelector('i').style.width=p+'%'; tr.querySelector('b').style.left=p+'%'; vl.textContent=c.fmt(c.get()); }
    paintS(); dragify(tr,{axis:'x',get:c.get,set:function(u){ c.set(u); paintS(); save(); },span:200,reset:c.reset});
    tr.addEventListener('pointerdown',function(e){ var rc=tr.getBoundingClientRect(); c.set(C01((e.clientX-rc.left)/rc.width)); paintS(); save(); });
    lane.appendChild(tr); lane.appendChild(vl); }
  else if(c.t==='btns'){ c.btns.forEach(function(bt){ var b=el('<button class="tp-btn">'+esc(bt.label)+'</button>');
      if(bt.file||bt.dir){ var inp=el('<input type="file" style="display:none"'+(bt.dir?' webkitdirectory':' multiple accept="'+bt.file+'"')+'>');
        inp.onchange=function(){ var n=inp.files.length; if(!n) return; toast('Imported <b>'+n+'</b> '+(n===1?'file':'files')+' into <span class="tp-bk">'+esc((inp.files[0].webkitRelativePath||inp.files[0].name).split('/')[0].replace(/\.\w+$/,''))+'</span>'); inp.value=''; };
        b.onclick=function(){ inp.click(); }; lane.appendChild(inp); }
      else b.onclick=bt.on; lane.appendChild(b); }); }
  if(r.dim&&r.dim()){ lane.style.opacity='.35'; lane.style.pointerEvents='none'; }
  return lane; }

/* REGISTRATION — name → email → authorization code → welcome. Every step validates; Enter = Next. */
var REG={name:'',email:''};
function enterKey(c,fn){ c.querySelectorAll('input').forEach(function(i){ i.onkeydown=function(e){ e.stopPropagation(); if(e.key==='Enter'){ e.preventDefault(); fn(); } if(e.key==='Escape') closeSheet(); }; }); }
function regSheet(step){
  if(step===1){ REG.name=REG.name||S.name||'';
    sheet({title:'Register Terrain',steps:1,body:'<div class="tp-text">First — who are you? This is the name Terrain registers to you, and the author on every preset you save.</div>'
      +'<div class="tp-f" style="margin-top:14px"><span class="k">Name</span><input type="text" class="tp-in" id="rg-name" maxlength="40" placeholder="Your name" spellcheck="false"></div><div class="tp-note" id="rg-msg">Your real name or your artist name — you can change it later.</div>',
      acts:[{label:'Cancel',on:closeSheet},{label:'Next',pri:1,on:next1}],init:function(c){ $('rg-name').value=REG.name; enterKey(c,next1); }});
    function next1(){ var v=$('rg-name').value.trim().replace(/\s+/g,' '), m=$('rg-msg');
      if(v.length<2){ m.textContent='Type at least two letters.'; m.className='tp-note err'; $('rg-name').focus(); return; }
      if(!/[A-Za-zÀ-ÿ]/.test(v)){ m.textContent='A name needs at least one letter.'; m.className='tp-note err'; return; }
      REG.name=v; regSheet(2); } }
  else if(step===2){ REG.email=REG.email||S.email||'';
    sheet({title:'Register Terrain',steps:2,body:'<div class="tp-text">Nice to meet you, <b>'+esc(REG.name)+'</b>. Where should we send your authorization code?</div>'
      +'<div class="tp-f" style="margin-top:14px"><span class="k">Email</span><input type="email" class="tp-in" id="rg-mail" maxlength="80" placeholder="you@example.com" spellcheck="false"></div><div class="tp-note" id="rg-msg">We only use it for your code, your licence and updates you ask for.</div><div id="rg-bar" style="margin-top:10px;height:2px"></div>',
      acts:[{label:'Back',left:1,on:function(){ regSheet(1); }},{label:'Cancel',on:closeSheet},{label:'Send code',pri:1,on:next2}],init:function(c){ $('rg-mail').value=REG.email; enterKey(c,next2); }});
    function next2(){ var v=$('rg-mail').value.trim(), m=$('rg-msg');
      if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)){ m.textContent=v?'That doesn\'t look like an email address.':'Type your email address.'; m.className='tp-note err'; $('rg-mail').focus(); return; }
      REG.email=v; m.textContent='Sending your code…'; m.className='tp-note'; bar($('rg-bar'),900,function(){ regSheet(3); }); } }
  else if(step===3){
    sheet({title:'Register Terrain',steps:3,body:'<div class="tp-text">We sent a code to <b>'+esc(REG.email)+'</b>. Paste it here — it looks like <b>TRRN-XXXX-XXXX</b>.</div>'
      +'<div class="tp-f" style="margin-top:14px"><span class="k">Code</span><input type="text" class="tp-in code" id="rg-code" maxlength="14" placeholder="TRRN-0000-0000" spellcheck="false" autocomplete="one-time-code"></div>'
      +'<div class="tp-note" id="rg-msg">Mockup: any 8 letters or numbers work · a code with 0000 shows the "used up" error. <span id="rg-resend" style="color:var(--purple-400);cursor:pointer">Resend code</span></div><div id="rg-bar" style="margin-top:10px;height:2px"></div>',
      acts:[{label:'Back',left:1,on:function(){ regSheet(2); }},{label:'Cancel',on:closeSheet},{label:'Register',pri:1,on:next3}],init:function(c){ var i=$('rg-code');
        i.oninput=function(){ var raw=i.value.toUpperCase().replace(/[^A-Z0-9]/g,''); if(raw.indexOf('TRRN')===0) raw=raw.slice(4); raw=raw.slice(0,8); i.value='TRRN-'+raw.slice(0,4)+(raw.length>4?'-'+raw.slice(4):''); if(!raw) i.value=''; $('rg-msg').className='tp-note'; };
        $('rg-resend').onclick=function(){ toast('A new code is on its way to <span class="tp-bk">'+esc(REG.email)+'</span>'); }; enterKey(c,next3); }});
    function next3(){ var raw=$('rg-code').value.replace(/^TRRN-?/,'').replace(/-/g,''), m=$('rg-msg');
      if(raw.length<8){ m.textContent='The code has 8 letters and numbers after TRRN — check the email.'; m.className='tp-note err'; $('rg-code').focus(); return; }
      m.textContent='Checking…'; m.className='tp-note';
      bar($('rg-bar'),1100,function(){ if(raw.indexOf('0000')>=0){ $('rg-bar').innerHTML=''; m.textContent='That code has already been used on 3 computers. Sign out on one of them, or write to us.'; m.className='tp-note err'; return; } regSheet(4); }); } }
  else { var was=S.author, auto=!S.authorSet||!S.author||S.author==='Me'||S.author===S.name;
    S.reg=true; S.name=REG.name; S.email=REG.email; S.since='23 Sep 2026'; if(auto){ S.author=REG.name; S.authorSet=false; } save();
    sheet({title:'Welcome to Terrain',body:'<div class="tp-text">Terrain is registered to <b>'+esc(S.name)+'</b>.</div>'
      +'<div class="tp-f" style="margin-top:14px"><span class="k">Name</span><div class="v">'+esc(S.name)+'</div><span class="k">Email</span><div class="v">'+esc(S.email)+'</div><span class="k">Author</span><div class="v ok">'+esc(S.author)+'</div><span class="k">Licence</span><div class="v">Beta · this Mac</div></div>'
      +'<div class="tp-note">'+(auto?'Every preset you save is now signed '+esc(S.author)+'. Change it any time under Account → Author name.':'Your presets stay signed '+esc(was)+' — you set that yourself.')+'</div>',
      acts:[{label:'Done',pri:1,on:function(){ closeSheet(); REG={name:'',email:''}; go('account'); toast('Terrain recognises you as <b>'+esc(S.name)+'</b>'); }}]}); }
}
function signOutSheet(){ sheet({title:'Sign out of Terrain',body:'<div class="tp-text">Terrain on this Mac will stop recognising <b>'+esc(S.name)+'</b>. Your presets keep their author; you can register again any time.</div>',
  acts:[{label:'Cancel',on:closeSheet},{label:'Sign out',pri:1,on:function(){ S.reg=false; save(); closeSheet(); go('account'); toast('Signed out'); }}]}); }
function resetSheet(){ sheet({title:'Reset all settings',body:'<div class="tp-text">Every setting goes back to how Terrain shipped. <b>Your presets, packs and registration are not touched.</b></div>',
  acts:[{label:'Cancel',on:closeSheet},{label:'Reset',pri:1,on:function(){ var keep={reg:S.reg,name:S.name,email:S.email,since:S.since,author:S.author,roles:S.roles,roleVocab:S.roleVocab};
    S=JSON.parse(JSON.stringify(DEF)); Object.keys(keep).forEach(function(k){ S[k]=keep[k]; }); save(); closeSheet(); paintPage(); paintHeaderCpu(); toast('Settings reset'); }}]}); }
/* THE SAVE SHEET — index.html 43162 (openSave), its fields verbatim; Author arrives filled from Settings */
function saveSheet(){ var types=['Bass','Keys','Pad','Lead','Pluck','FX'], styles=['Dark','Warm','Glassy','Evolving','Wide'], ty='Pad', sty=['Glassy','Evolving'];
  sheet({title:'Save preset',wide:true,body:'<div class="tp-f">'
      +'<span class="k">Name</span><input type="text" class="tp-in" id="sv-name" maxlength="40" placeholder="Preset name" value="Glass Choir 2">'
      +'<span class="k">Pack</span><input type="text" class="tp-in" id="sv-bank" maxlength="30" placeholder="Type a pack — new name makes one" value="User">'
      +'<span class="k">Author</span><input type="text" class="tp-in" id="sv-author" maxlength="30" placeholder="Your name" value="'+esc(S.sign==='On'?S.author:'')+'">'
      +'<span class="k">Type</span><div class="chp" id="sv-type"></div><span class="k">Style</span><div class="chp" id="sv-style"></div>'
      +'<span class="k">Notes</span><div class="tp-in tp-note-in" contenteditable="plaintext-only" spellcheck="false" data-ph="What should someone know about this sound?"></div>'
      +'<span class="k">Carries</span><div class="v">2 wavetables · 1 sample</div></div>'
      +'<div class="tp-note">Author comes from <b style="color:var(--text-primary);font-weight:500">Settings → Account</b>'+(S.sign==='On'?'':' (signing is off, so it starts empty)')+'. Type another name here for this save only.</div>',
    acts:[{label:'Cancel',on:closeSheet},{label:'Save',pri:1,on:function(){ var n=$('sv-name').value.trim()||'Untitled', a=$('sv-author').value.trim(); closeSheet(); $('preset-name').textContent=n;
      toast('Saved <span class="tp-bk">User - </span>'+esc(n)+(a?' <span class="tp-bk">· by '+esc(a)+'</span>':'')); }}],
    init:function(c){ function rc(){ var t=$('sv-type'), s=$('sv-style');
        t.innerHTML=types.map(function(x){ return '<button class="tp-chip'+(x===ty?' active':'')+'" data-t="'+x+'">'+x+'</button>'; }).join('')+'<button class="tp-chip add">'+PLUS+'</button>';
        s.innerHTML=styles.map(function(x){ return '<button class="tp-chip'+(sty.indexOf(x)>=0?' active':'')+'" data-s="'+x+'">'+x+'</button>'; }).join('')+'<button class="tp-chip add">'+PLUS+'</button>';
        t.querySelectorAll('[data-t]').forEach(function(b){ b.onclick=function(){ ty=ty===b.dataset.t?'':b.dataset.t; rc(); }; });
        s.querySelectorAll('[data-s]').forEach(function(b){ b.onclick=function(){ var i=sty.indexOf(b.dataset.s); if(i>=0) sty.splice(i,1); else sty.push(b.dataset.s); rc(); }; }); }
      rc(); c.querySelectorAll('input').forEach(function(i){ i.onkeydown=function(e){ e.stopPropagation(); if(e.key==='Escape') closeSheet(); }; }); }});
}

/* ═══ MIDI — Web MIDI when the browser has it (Chrome), the mocked ports otherwise (Safari) ═══ */
var midiAcc=null, midiPorts=null;
function lampFlash(n){ var l=lamps[n]; if(!l) return; l.classList.add('lv'); clearTimeout(l._t); l._t=setTimeout(function(){ l.classList.remove('lv'); },120); }
function onMidi(name,d){ if(!S.ports[name]) return; lampFlash(name); var st=d[0]&0xF0, ch=(d[0]&15)+1;
  if(S.chan!=='Omni'&&S.chan!=='Channel '+ch) return;
  if(st===0x90&&d[2]>0) noteOn(d[1],d[2]/127,name); else if(st===0x80||(st===0x90&&d[2]===0)) noteOff(d[1]);
  else if(st===0xB0){ LIVE.cc=d[1]+' = '+d[2]; if(learning) learnCC(d[1]); paintLive(); }
  else if(st===0xE0){ LIVE.bend=(((d[2]<<7)|d[1])-8192)/8192*S.bend; paintLive(); } }
function learnCC(cc){ clearTimeout(learnT); learning=false; var targets=['Filter 1 · Cutoff','Osc B · Level','Reverb · Mix','Macro 2 · Space','Env 1 · Attack'];
  var p=targets[Math.floor(Math.random()*targets.length)]; S.cc=S.cc.filter(function(m){ return m.cc!==cc||m.fixed; }); S.cc.push({cc:cc,p:p}); save(); paintPage(); toast('Learned <span class="tp-bk">CC '+cc+' →</span> '+esc(p)); }
try{ if(navigator.requestMIDIAccess) navigator.requestMIDIAccess().then(function(acc){ midiAcc=acc;
  function scan(){ midiPorts=[]; acc.inputs.forEach(function(inp){ midiPorts.push({name:inp.name}); if(S.ports[inp.name]===undefined) S.ports[inp.name]=false; inp.onmidimessage=function(e){ onMidi(inp.name,e.data); }; }); if(cur==='audio'&&!q) paintPage(); }
  scan(); acc.onstatechange=scan; },function(){}); }catch(e){}

/* the computer keyboard (fb484's QWERTY map: A W S E D F T G Y H U J K from C4) */
var QW='awsedftgyhujk';
document.addEventListener('keydown',function(e){ if(e.target.tagName==='INPUT'||e.target.isContentEditable) return;
  if(e.key==='Escape'){ if(menuEl) closeMenu(); else if($('tp-sheet').classList.contains('on')) closeSheet(); else if(q){ $('st-search').value=''; q=''; renderRail(); paintPage(); } else openSettings(false); return; }
  if(e.metaKey||e.ctrlKey||e.repeat||!S.qwerty) return; var i=QW.indexOf(e.key.toLowerCase()); if(i<0) return;
  if(!held[60+i]){ noteOn(60+i,100/127,'computer keyboard'); var ks=velEl&&velEl.querySelectorAll('.keys .fxb'); if(ks&&ks[i]) ks[i].classList.add('on'); if(learning) learnCC(20+i); } });
document.addEventListener('keyup',function(e){ var i=QW.indexOf(e.key.toLowerCase()); if(i<0) return; noteOff(60+i); var ks=velEl&&velEl.querySelectorAll('.keys .fxb'); if(ks&&ks[i]) ks[i].classList.remove('on'); });

/* ═══ HEADER, OPEN / CLOSE, SEARCH ═══ */
function openSettings(on){ $('tp-b').classList.toggle('on',on); closeMenu(); ['syn-btn','mix-btn','mod-btn'].forEach(function(id){ $(id).classList.toggle('active',!on&&id==='syn-btn'); }); }
$('settings-btn').onclick=function(){ openSettings(!$('tp-b').classList.contains('on')); };
$('st-close').onclick=function(){ openSettings(false); };
['syn-btn','mix-btn','mod-btn'].forEach(function(id){ $(id).onclick=function(){ openSettings(false); ['syn-btn','mix-btn','mod-btn'].forEach(function(j){ $(j).classList.toggle('active',j===id); }); }; });
$('save-btn').onclick=function(){ saveSheet(); };
$('dice-btn').onclick=function(){ toast('The dice rolls a sound <span class="tp-bk">· not part of this mockup</span>'); };
$('st-search').oninput=function(){ q=this.value.trim().toLowerCase(); renderRail(); paintPage(); };
$('st-search').onkeydown=function(e){ e.stopPropagation(); if(e.key==='Escape'){ this.value=''; q=''; renderRail(); paintPage(); } };
$('bs-tog').onclick=function(){ var on=document.body.classList.toggle('bs'); this.textContent='Build status: '+(on?'on':'off'); this.classList.toggle('active',on); paintInsp(); };
$('snd-tog').onclick=function(){ arm(); chime(); };

/* the synth page behind the glass — the mod-matrix mockup's SYN grid, still */
(function(){ var syn=$('syn'), rows=[['Osc A','Osc B','Osc C'],['Filter 1','Filter 2','Env 1'],['LFO 1','Macros','Reverb'],['Delay','Voice','Output']];
  rows.forEach(function(rw){ var row=el('<div class="row" style="grid-template-columns:repeat('+rw.length+',minmax(0,1fr))"></div>');
    rw.forEach(function(nm,bi){ var g=el('<div class="gbox"><span class="gbl">'+esc(nm)+'</span></div>');
      ['Level','Tone','Shape','Mix'].forEach(function(lb,i){ var c=el('<div class="cell"><div class="ctl k">'+knobSVG()+'</div><div class="lb">'+lb+'</div><div class="vl">'+Math.round(30+((bi*7+i*13)%60))+'%</div></div>'); setRing(c,.3+((bi*7+i*13)%60)/100); g.appendChild(c); }); row.appendChild(g); });
    syn.appendChild(row); }); })();

renderRail(); paintPage(); paintHeaderCpu();
window.__st={go:go,regSheet:regSheet,saveSheet:saveSheet,S:function(){ return S; },openMenuFor:function(id){ var f=document.querySelector('[data-row="'+id+'"] .dd'); if(f) f.click(); },search:function(s){ $('st-search').value=s; $('st-search').oninput(); }};
})();
</script>
