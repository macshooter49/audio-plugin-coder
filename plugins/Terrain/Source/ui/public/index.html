<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Terrain</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #F3EFF8;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      width: 600px;
      height: 570px;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    .plugin-container {
      width: 600px;
      height: 570px;
      padding: 16px 24px;
      display: flex;
      flex-direction: column;
    }

    /* ── Header with preset nav ── */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .plugin-brand {
      display: flex;
      flex-direction: column;
    }

    .plugin-title {
      font-family: 'SF Pro Display', -apple-system, system-ui, sans-serif;
      font-weight: 300;
      font-size: 16px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #6B5F80;
      line-height: 1;
    }

    .plugin-version {
      font-family: 'SF Pro Display', -apple-system, system-ui, sans-serif;
      font-weight: 400;
      font-size: 9px;
      letter-spacing: 1.5px;
      color: #4A4358;
      margin-top: 3px;
    }

    .preset-nav {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .preset-btn {
      background: none;
      border: 1px solid #D4CCE0;
      border-radius: 4px;
      color: #8B7FA0;
      font-size: 14px;
      width: 24px;
      height: 24px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }

    .preset-btn:hover {
      border-color: #8B5CF6;
      color: #8B5CF6;
    }

    .preset-name {
      font-weight: 400;
      font-size: 12px;
      letter-spacing: 1px;
      color: #5B4F70;
      min-width: 100px;
      text-align: center;
      cursor: pointer;
      transition: color 0.15s ease;
    }
    .preset-name:hover {
      color: #8B5CF6;
    }
    .preset-list {
      position: absolute;
      top: 42px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid #E8E0F0;
      border-radius: 6px;
      box-shadow: 0 4px 12px rgba(107, 95, 128, 0.12);
      z-index: 100;
      min-width: 160px;
      max-height: 260px;
      overflow-y: auto;
      padding: 4px 0;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    .preset-list.hidden {
      display: none;
    }
    .preset-list-item {
      padding: 6px 14px;
      font-size: 11px;
      font-weight: 400;
      color: #5B4F70;
      cursor: pointer;
      letter-spacing: 0.3px;
      transition: background 0.1s ease;
      white-space: nowrap;
    }
    .preset-list-item:hover {
      background: rgba(139, 92, 246, 0.08);
      color: #7C3AED;
    }
    .preset-list-item.active {
      color: #7C3AED;
      font-weight: 500;
    }

    .wc-logo {
      opacity: 0.7;
    }

    /* ── Knob rows ── */
    .knob-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 0 6px;
      margin-bottom: 8px;
    }

    .knob-row-tape {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 40px;
      padding: 0 6px;
      margin-bottom: 10px;
    }

    .knob-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 80px;
      cursor: grab;
    }

    .knob-group:active,
    .knob-group.dragging {
      cursor: grabbing;
    }

    .knob-canvas {
      width: 64px;
      height: 64px;
      transition: filter 0.15s ease;
    }

    .knob-group:hover .knob-canvas {
      filter: brightness(1.03);
    }

    .knob-group.dragging .knob-canvas {
      filter: brightness(1.05);
    }

    .knob-value {
      font-weight: 400;
      font-size: 12px;
      color: #5B4F70;
      margin-top: 6px;
      height: 16px;
      line-height: 16px;
      transition: color 0.15s ease;
    }

    .knob-group.dragging .knob-value {
      color: #8B5CF6;
    }

    .knob-label {
      font-weight: 400;
      font-size: 9px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #8B7FA0;
      margin-top: 3px;
      text-align: center;
      line-height: 1.3;
    }

    /* ── Grain sync toggle ── */
    .sync-toggle {
      display: inline-block;
      font-family: 'SF Pro Display', -apple-system, system-ui, sans-serif;
      font-weight: 500;
      font-size: 8px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #A89BBE;
      background: rgba(212, 204, 224, 0.3);
      border: 1px solid rgba(212, 204, 224, 0.5);
      border-radius: 3px;
      padding: 2px 5px;
      cursor: pointer;
      transition: all 0.15s ease;
      margin-top: 2px;
      line-height: 1;
    }
    .sync-toggle:hover {
      border-color: #8B5CF6;
      color: #8B5CF6;
    }
    .sync-toggle.active {
      background: rgba(139, 92, 246, 0.15);
      border-color: #8B5CF6;
      color: #8B5CF6;
    }

    /* ── Section divider ── */
    .section-divider {
      height: 1px;
      background: linear-gradient(to right, transparent, #D4CCE0, transparent);
      margin: 4px 20px 8px;
    }

    /* ── Visualizer strip ── */
    .viz-strip {
      display: flex;
      gap: 12px;
      flex: 1;
      min-height: 0;
    }

    .viz-panel {
      flex: 1;
      background: rgba(255,255,255,0.4);
      border-radius: 8px;
      border: 1px solid #E8E0F0;
      position: relative;
      overflow: hidden;
    }

    .viz-panel canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    #scopeViz {
      cursor: crosshair;
    }

    /* ── Output gain slider ── */
    .gain-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      height: 20px;
      padding: 0 4px;
      margin-top: 4px;
      flex-shrink: 0;
    }

    .gain-label {
      font-size: 8px;
      font-weight: 600;
      letter-spacing: 1.5px;
      color: #A99BBE;
      min-width: 42px;
    }

    .gain-track {
      flex: 1;
      height: 4px;
      background: rgba(139, 92, 246, 0.1);
      border-radius: 2px;
      position: relative;
      cursor: pointer;
    }

    .gain-fill {
      position: absolute;
      height: 100%;
      background: rgba(139, 92, 246, 0.25);
      border-radius: 2px;
      pointer-events: none;
    }

    .gain-thumb {
      position: absolute;
      top: 50%;
      width: 10px;
      height: 10px;
      background: rgba(139, 92, 246, 0.5);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      cursor: pointer;
      transition: background 0.15s;
    }

    .gain-thumb:hover, .gain-bar.dragging .gain-thumb {
      background: rgba(139, 92, 246, 0.8);
    }

    .gain-value {
      font-size: 9px;
      font-weight: 500;
      color: #8B7BA0;
      min-width: 44px;
      text-align: right;
    }

    .viz-label {
      position: absolute;
      top: 6px;
      left: 8px;
      font-size: 8px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #B0A4C0;
      pointer-events: none;
    }

    /* ── XY Automation Controls ── */
    .xy-auto-bar {
      position: absolute;
      top: 4px;
      right: 6px;
      display: flex;
      align-items: center;
      gap: 3px;
      z-index: 10;
      opacity: 0.4;
      transition: opacity 0.2s ease;
    }
    .xy-auto-bar:hover {
      opacity: 0.9;
    }
    .xy-auto-btn {
      width: 18px;
      height: 18px;
      border: none;
      border-radius: 50%;
      background: rgba(139, 92, 246, 0.12);
      color: #8B7FA0;
      font-size: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      transition: all 0.15s ease;
      line-height: 1;
    }
    .xy-auto-btn:hover {
      background: rgba(139, 92, 246, 0.25);
      color: #7C3AED;
    }
    .xy-auto-btn.active {
      background: rgba(139, 92, 246, 0.35);
      color: #7C3AED;
    }
    .xy-auto-speed {
      width: 36px;
      height: 4px;
      background: rgba(139, 92, 246, 0.1);
      border-radius: 2px;
      position: relative;
      cursor: pointer;
      margin: 0 2px;
    }
    .xy-auto-speed-thumb {
      position: absolute;
      top: 50%;
      width: 8px;
      height: 8px;
      background: rgba(139, 92, 246, 0.35);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      cursor: pointer;
      transition: background 0.15s;
      left: 50%;
    }
    .xy-auto-speed-thumb:hover,
    .xy-auto-bar:hover .xy-auto-speed-thumb {
      background: rgba(139, 92, 246, 0.6);
    }

    /* ── Preset Menu ── */
    .preset-menu-btn {
      font-size: 16px;
      line-height: 1;
      letter-spacing: 1px;
    }
    .preset-dropdown {
      position: absolute;
      top: 42px;
      right: 24px;
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid #E8E0F0;
      border-radius: 6px;
      box-shadow: 0 4px 12px rgba(107, 95, 128, 0.12);
      z-index: 100;
      min-width: 140px;
      padding: 4px 0;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    .preset-dropdown.hidden {
      display: none;
    }
    .preset-dropdown-item {
      padding: 6px 14px;
      font-size: 11px;
      font-weight: 400;
      color: #5B4F70;
      cursor: pointer;
      letter-spacing: 0.3px;
      transition: background 0.1s ease;
    }
    .preset-dropdown-item:hover {
      background: rgba(139, 92, 246, 0.08);
      color: #7C3AED;
    }
    .preset-dropdown-item.disabled {
      opacity: 0.35;
      pointer-events: none;
    }
    .preset-input-row {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px 6px;
      border-top: 1px solid #E8E0F0;
    }
    .preset-input-row.hidden {
      display: none;
    }
    .preset-input {
      flex: 1;
      border: 1px solid #D4CCE0;
      border-radius: 4px;
      padding: 3px 6px;
      font-size: 11px;
      font-family: inherit;
      color: #5B4F70;
      background: #fff;
      outline: none;
    }
    .preset-input:focus {
      border-color: #8B5CF6;
    }
  </style>
</head>

  <script>
  if (
    typeof window.__JUCE__ !== "undefined" &&
    typeof window.__JUCE__.getAndroidUserScripts !== "undefined" &&
    typeof window.inAndroidUserScriptEval === "undefined"
  ) {
    window.inAndroidUserScriptEval = true;
    eval(window.__JUCE__.getAndroidUserScripts());
    delete window.inAndroidUserScriptEval;
  }

  {
    if (typeof window.__JUCE__ === "undefined") {
      console.warn(
        "The 'window.__JUCE__' object is undefined." +
          " Native integration features will not work." +
          " Defining a placeholder 'window.__JUCE__' object."
      );

      window.__JUCE__ = {
        postMessage: function () {},
      };
    }

    if (typeof window.__JUCE__.initialisationData === "undefined") {
      window.__JUCE__.initialisationData = {
        __juce__platform: [],
        __juce__functions: [],
        __juce__registeredGlobalEventIds: [],
        __juce__sliders: [],
        __juce__toggles: [],
        __juce__comboBoxes: [],
      };
    }

    class ListenerList {
      constructor() {
        this.listeners = new Map();
        this.listenerId = 0;
      }

      addListener(fn) {
        const newListenerId = this.listenerId++;
        this.listeners.set(newListenerId, fn);
        return newListenerId;
      }

      removeListener(id) {
        if (this.listeners.has(id)) {
          this.listeners.delete(id);
        }
      }

      callListeners(payload) {
        for (const [, value] of this.listeners) {
          value(payload);
        }
      }
    }

    class EventListenerList {
      constructor() {
        this.eventListeners = new Map();
      }

      addEventListener(eventId, fn) {
        if (!this.eventListeners.has(eventId))
          this.eventListeners.set(eventId, new ListenerList());

        const id = this.eventListeners.get(eventId).addListener(fn);
        return [eventId, id];
      }

      removeEventListener([eventId, id]) {
        if (this.eventListeners.has(eventId)) {
          this.eventListeners.get(eventId).removeListener(id);
        }
      }

      emitEvent(eventId, object) {
        if (this.eventListeners.has(eventId))
          this.eventListeners.get(eventId).callListeners(object);
      }
    }

    class Backend {
      constructor() {
        this.listeners = new EventListenerList();
      }

      addEventListener(eventId, fn) {
        return this.listeners.addEventListener(eventId, fn);
      }

      removeEventListener([eventId, id]) {
        this.listeners.removeEventListener([eventId, id]);
      }

      emitEvent(eventId, object) {
        window.__JUCE__.postMessage(
          JSON.stringify({ eventId: eventId, payload: object })
        );
      }

      emitByBackend(eventId, object) {
        this.listeners.emitEvent(eventId, JSON.parse(object));
      }
    }

    if (typeof window.__JUCE__.backend === "undefined")
      window.__JUCE__.backend = new Backend();
  }
  </script>

  <script>
  (function() {
    'use strict';

    class PromiseHandler {
      constructor() {
        this.lastPromiseId = 0;
        this.promises = new Map();

        window.__JUCE__.backend.addEventListener(
          "__juce__complete",
          ({ promiseId, result }) => {
            if (this.promises.has(promiseId)) {
              this.promises.get(promiseId).resolve(result);
              this.promises.delete(promiseId);
            }
          }
        );
      }

      createPromise() {
        const promiseId = this.lastPromiseId++;
        const result = new Promise((resolve, reject) => {
          this.promises.set(promiseId, { resolve: resolve, reject: reject });
        });
        return [promiseId, result];
      }
    }

    const promiseHandler = new PromiseHandler();

    function getNativeFunction(name) {
      if (!window.__JUCE__.initialisationData.__juce__functions.includes(name))
        console.warn(
          "Creating native function binding for '" + name + "', which is unknown to the backend"
        );

      const f = function () {
        const [promiseId, result] = promiseHandler.createPromise();
        window.__JUCE__.backend.emitEvent("__juce__invoke", {
          name: name,
          params: Array.prototype.slice.call(arguments),
          resultId: promiseId,
        });
        return result;
      };

      return f;
    }

    class ListenerList {
      constructor() {
        this.listeners = new Map();
        this.listenerId = 0;
      }

      addListener(fn) {
        const newListenerId = this.listenerId++;
        this.listeners.set(newListenerId, fn);
        return newListenerId;
      }

      removeListener(id) {
        if (this.listeners.has(id)) {
          this.listeners.delete(id);
        }
      }

      callListeners(payload) {
        for (const [, value] of this.listeners) {
          value(payload);
        }
      }
    }

    const BasicControl_valueChangedEventId = "valueChanged";
    const BasicControl_propertiesChangedId = "propertiesChanged";
    const SliderControl_sliderDragStartedEventId = "sliderDragStarted";
    const SliderControl_sliderDragEndedEventId = "sliderDragEnded";

    class SliderState {
      constructor(name) {
        if (!window.__JUCE__.initialisationData.__juce__sliders.includes(name))
          console.warn(
            "Creating SliderState for '" + name + "', which is unknown to the backend"
          );

        this.name = name;
        this.identifier = "__juce__slider" + this.name;
        this.scaledValue = 0;
        this.properties = {
          start: 0, end: 1, skew: 1, name: "", label: "",
          numSteps: 100, interval: 0, parameterIndex: -1,
        };
        this.valueChangedEvent = new ListenerList();
        this.propertiesChangedEvent = new ListenerList();

        window.__JUCE__.backend.addEventListener(this.identifier, (event) =>
          this.handleEvent(event)
        );

        window.__JUCE__.backend.emitEvent(this.identifier, {
          eventType: "requestInitialUpdate",
        });
      }

      setNormalisedValue(newValue) {
        this.scaledValue = this.snapToLegalValue(
          this.normalisedToScaledValue(newValue)
        );
        window.__JUCE__.backend.emitEvent(this.identifier, {
          eventType: BasicControl_valueChangedEventId,
          value: this.scaledValue,
        });
      }

      sliderDragStarted() {
        window.__JUCE__.backend.emitEvent(this.identifier, {
          eventType: SliderControl_sliderDragStartedEventId,
        });
      }

      sliderDragEnded() {
        window.__JUCE__.backend.emitEvent(this.identifier, {
          eventType: SliderControl_sliderDragEndedEventId,
        });
      }

      handleEvent(event) {
        if (event.eventType == BasicControl_valueChangedEventId) {
          this.scaledValue = event.value;
          this.valueChangedEvent.callListeners();
        }
        if (event.eventType == BasicControl_propertiesChangedId) {
          let { eventType: _, ...rest } = event;
          this.properties = rest;
          this.propertiesChangedEvent.callListeners();
        }
      }

      getScaledValue() {
        return this.scaledValue;
      }

      getNormalisedValue() {
        return Math.pow(
          (this.scaledValue - this.properties.start) /
            (this.properties.end - this.properties.start),
          this.properties.skew
        );
      }

      normalisedToScaledValue(normalisedValue) {
        return (
          Math.pow(normalisedValue, 1 / this.properties.skew) *
            (this.properties.end - this.properties.start) +
          this.properties.start
        );
      }

      snapToLegalValue(value) {
        const interval = this.properties.interval;
        if (interval == 0) return value;
        const start = this.properties.start;
        const clamp = (val, min = 0, max = 1) => Math.max(min, Math.min(max, val));
        return clamp(
          start + interval * Math.floor((value - start) / interval + 0.5),
          this.properties.start,
          this.properties.end
        );
      }
    }

    const sliderStates = new Map();
    for (const sliderName of window.__JUCE__.initialisationData.__juce__sliders)
      sliderStates.set(sliderName, new SliderState(sliderName));

    function getSliderState(name) {
      if (!sliderStates.has(name)) sliderStates.set(name, new SliderState(name));
      return sliderStates.get(name);
    }

    // Expose API as global
    window.Juce = {
      getNativeFunction: getNativeFunction,
      getSliderState: getSliderState,
    };
  })();
  </script>

  <!-- ================================================================== -->
  <script>
  (function() {
    'use strict';

    // ── Arc Knob Constants ──
    var ARC_START = 0.75 * Math.PI;
    var ARC_END   = 0.25 * Math.PI;
    var ARC_RANGE = 1.5  * Math.PI;
    var KNOB_RADIUS = 29;
    var CANVAS_SIZE = 128;
    var CENTER = CANVAS_SIZE / 2;

    function valueToAngle(normalized) {
      return ARC_START + normalized * ARC_RANGE;
    }

    // ── Canvas Knob Renderer ──
    function drawKnob(canvas, normalized, isActive) {
      var ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);

      // Glass body
      var glassGrad = ctx.createRadialGradient(
        CENTER - 7, CENTER - 7, 2,
        CENTER, CENTER, KNOB_RADIUS + 2
      );
      glassGrad.addColorStop(0, 'rgba(255, 255, 255, 0.95)');
      glassGrad.addColorStop(0.5, 'rgba(255, 255, 255, 0.7)');
      glassGrad.addColorStop(1, 'rgba(243, 239, 248, 0.4)');

      ctx.beginPath();
      ctx.arc(CENTER, CENTER, KNOB_RADIUS, 0, Math.PI * 2);
      ctx.fillStyle = glassGrad;
      ctx.fill();

      // Purple tint overlay
      ctx.beginPath();
      ctx.arc(CENTER, CENTER, KNOB_RADIUS, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(139, 92, 246, 0.06)';
      ctx.fill();

      // Top-left highlight
      var highlightGrad = ctx.createRadialGradient(
        CENTER - 10, CENTER - 12, 1,
        CENTER - 7, CENTER - 9, 16
      );
      highlightGrad.addColorStop(0, 'rgba(255, 255, 255, 0.8)');
      highlightGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');
      ctx.beginPath();
      ctx.arc(CENTER, CENTER, KNOB_RADIUS - 1, 0, Math.PI * 2);
      ctx.fillStyle = highlightGrad;
      ctx.fill();

      // Inner shadow
      var shadowGrad = ctx.createRadialGradient(
        CENTER, CENTER, KNOB_RADIUS - 5,
        CENTER, CENTER, KNOB_RADIUS
      );
      shadowGrad.addColorStop(0, 'rgba(0, 0, 0, 0)');
      shadowGrad.addColorStop(1, 'rgba(0, 0, 0, 0.04)');
      ctx.beginPath();
      ctx.arc(CENTER, CENTER, KNOB_RADIUS, 0, Math.PI * 2);
      ctx.fillStyle = shadowGrad;
      ctx.fill();

      // Arc track
      ctx.beginPath();
      ctx.arc(CENTER, CENTER, KNOB_RADIUS + 5, ARC_START, ARC_END, false);
      ctx.strokeStyle = '#E8E0F0';
      ctx.lineWidth = 3;
      ctx.lineCap = 'round';
      ctx.stroke();

      // Active arc
      if (normalized > 0.003) {
        var endAngle = valueToAngle(normalized);

        if (isActive) {
          ctx.beginPath();
          ctx.arc(CENTER, CENTER, KNOB_RADIUS + 5, ARC_START, endAngle, false);
          ctx.strokeStyle = 'rgba(139, 92, 246, 0.25)';
          ctx.lineWidth = 7;
          ctx.lineCap = 'round';
          ctx.stroke();
        }

        ctx.beginPath();
        ctx.arc(CENTER, CENTER, KNOB_RADIUS + 5, ARC_START, endAngle, false);
        ctx.strokeStyle = isActive ? '#7C3AED' : '#8B5CF6';
        ctx.lineWidth = 3;
        ctx.lineCap = 'round';
        ctx.stroke();

        var dotX = CENTER + (KNOB_RADIUS + 5) * Math.cos(endAngle);
        var dotY = CENTER + (KNOB_RADIUS + 5) * Math.sin(endAngle);
        ctx.beginPath();
        ctx.arc(dotX, dotY, 2.5, 0, Math.PI * 2);
        ctx.fillStyle = isActive ? '#7C3AED' : '#8B5CF6';
        ctx.fill();

        if (isActive) {
          ctx.beginPath();
          ctx.arc(dotX, dotY, 5, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(139, 92, 246, 0.3)';
          ctx.fill();
        }
      }
    }

    // ── Knob Controller ──
    function KnobController(groupEl, sliderState) {
      this.group = groupEl;
      this.sliderState = sliderState;
      this.canvas = groupEl.querySelector('.knob-canvas');
      this.valueEl = groupEl.querySelector('.knob-value');
      this.min = parseFloat(groupEl.dataset.min);
      this.max = parseFloat(groupEl.dataset.max);
      this.defaultVal = parseFloat(groupEl.dataset['default']);
      this.decimals = parseInt(groupEl.dataset.decimals);
      this.unit = groupEl.dataset.unit;
      this.paramId = groupEl.dataset.param;
      this.isActive = false;
      this.dragStartY = 0;
      this.dragStartNorm = 0;

      var self = this;

      if (this.sliderState) {
        this.sliderState.valueChangedEvent.addListener(function() {
          var norm = self.sliderState.getNormalisedValue();
          self.updateFromNormalized(norm, false);
        });
      }

      this.group.addEventListener('mousedown', function(e) { self.onMouseDown(e); });
      this.group.addEventListener('dblclick', function(e) { self.onDoubleClick(e); });

      this.updateFromNormalized(this.valueToNormalized(parseFloat(groupEl.dataset.value)), false);
    }

    KnobController.prototype.valueToNormalized = function(val) {
      return (val - this.min) / (this.max - this.min);
    };

    KnobController.prototype.normalizedToValue = function(norm) {
      return this.min + norm * (this.max - this.min);
    };

    KnobController.prototype.updateFromNormalized = function(norm, notifyHost) {
      norm = Math.max(0, Math.min(1, norm));
      var val = this.normalizedToValue(norm);
      this.group.dataset.value = val.toFixed(this.decimals);

      // Grain sync: show division name instead of ms
      if (this.paramId === 'GRAIN_SIZE' && grainSyncEnabled) {
        var idx = Math.floor(norm * 10);
        if (idx > 9) idx = 9;
        if (idx < 0) idx = 0;
        this.valueEl.textContent = grainSyncDivisions[idx].name;
      } else {
        var sign = val > 0 && this.paramId === 'PITCH' ? '+' : '';
        this.valueEl.textContent = sign + val.toFixed(this.decimals) + this.unit;
      }

      drawKnob(this.canvas, norm, this.isActive);

      if (notifyHost && this.sliderState) {
        this.sliderState.setNormalisedValue(norm);
      }
    };

    KnobController.prototype.onMouseDown = function(e) {
      e.preventDefault();
      this.isActive = true;
      this.dragStartY = e.clientY;
      this.dragStartNorm = this.valueToNormalized(parseFloat(this.group.dataset.value));
      this.group.classList.add('dragging');

      if (this.sliderState) this.sliderState.sliderDragStarted();

      drawKnob(this.canvas, this.dragStartNorm, true);

      var self = this;

      var onMove = function(ev) {
        var sensitivity = ev.shiftKey ? 800 : 200;
        var deltaY = self.dragStartY - ev.clientY;
        var deltaNorm = deltaY / sensitivity;
        self.updateFromNormalized(self.dragStartNorm + deltaNorm, true);
      };

      var onUp = function() {
        self.isActive = false;
        self.group.classList.remove('dragging');
        if (self.sliderState) self.sliderState.sliderDragEnded();
        var norm = self.valueToNormalized(parseFloat(self.group.dataset.value));
        drawKnob(self.canvas, norm, false);
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
      };

      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    };

    KnobController.prototype.onDoubleClick = function(e) {
      e.preventDefault();
      var norm = this.valueToNormalized(this.defaultVal);
      this.updateFromNormalized(norm, true);
    };

    // ── Preset Navigation ──
    var currentPresetIdx = 0;
    var numPresets = 10;
    var loadPresetFn = null;
    var getPresetNameFn = null;
    var getNumPresetsFn = null;
    var getCurrentPresetIndexFn = null;
    var setXYAutoStateFn = null;
    var getXYAutoStateFn = null;
    var setGrainSyncFn = null;
    var getGrainSyncFn = null;

    // Grain BPM sync state
    var grainSyncEnabled = false;
    var currentBPM = 120;
    var grainSyncDivisions = [
      { name: '1/32',  mult: 0.125  },
      { name: '1/16T', mult: 0.1667 },
      { name: '1/16',  mult: 0.25   },
      { name: '1/8T',  mult: 0.3333 },
      { name: '1/8',   mult: 0.5    },
      { name: '1/4T',  mult: 0.6667 },
      { name: '1/4',   mult: 1.0    },
      { name: '1/2T',  mult: 1.3333 },
      { name: '1/2',   mult: 2.0    },
      { name: '1/1',   mult: 4.0    }
    ];

    function updatePresetDisplay(name) {
      var el = document.getElementById('presetName');
      if (el) el.textContent = name;
    }

    async function initPresets() {
      try {
        loadPresetFn = window.Juce.getNativeFunction('loadPreset');
        getPresetNameFn = window.Juce.getNativeFunction('getPresetName');
        getNumPresetsFn = window.Juce.getNativeFunction('getNumPresets');
        getCurrentPresetIndexFn = window.Juce.getNativeFunction('getCurrentPresetIndex');
        setXYAutoStateFn = window.Juce.getNativeFunction('setXYAutoState');
        getXYAutoStateFn = window.Juce.getNativeFunction('getXYAutoState');
        setGrainSyncFn = window.Juce.getNativeFunction('setGrainSync');
        getGrainSyncFn = window.Juce.getNativeFunction('getGrainSync');

        numPresets = await getNumPresetsFn();
        currentPresetIdx = await getCurrentPresetIndexFn();
        var name = await getPresetNameFn(currentPresetIdx);
        updatePresetDisplay(name);

        // Restore XY auto state from the current preset
        await pullXYAutoState();
        await pullGrainSyncState();
      } catch (e) {
        console.log('Preview mode: preset functions not available');
      }
    }

    // Push grain sync state to C++
    function pushGrainSyncState() {
      if (setGrainSyncFn) {
        setGrainSyncFn(grainSyncEnabled ? 1.0 : 0.0);
      }
    }

    // Pull grain sync state from C++ and apply to JS
    async function pullGrainSyncState() {
      if (!getGrainSyncFn) return;
      var state = await getGrainSyncFn();
      if (!state) return;

      grainSyncEnabled = state.enabled > 0.5;
      if (state.bpm > 0) currentBPM = state.bpm;

      var btn = document.getElementById('grainSyncBtn');
      if (btn) {
        if (grainSyncEnabled) btn.classList.add('active');
        else btn.classList.remove('active');
      }

      // Force grain size display update
      updateGrainSyncDisplay();
    }

    // Update the grain size knob value display for sync mode
    function updateGrainSyncDisplay() {
      var grainGroup = document.querySelector('[data-param="GRAIN_SIZE"]');
      if (!grainGroup) return;
      var valueEl = grainGroup.querySelector('.knob-value');
      if (!valueEl) return;

      if (grainSyncEnabled) {
        var norm = 0.5;
        if (xySliders.grainSize) norm = xySliders.grainSize.getNormalisedValue();
        var idx = Math.floor(norm * 10);
        if (idx > 9) idx = 9;
        if (idx < 0) idx = 0;
        var div = grainSyncDivisions[idx];
        var ms = (60000 / currentBPM) * div.mult;
        valueEl.textContent = div.name;
        valueEl.title = ms.toFixed(0) + ' ms @ ' + currentBPM.toFixed(0) + ' BPM';
      } else {
        valueEl.title = '';
      }
    }

    // Sync XY pad dot position from actual parameter values
    function syncXYPadFromParams() {
      if (xySliders.grainSize) {
        xyPadPos.x = xySliders.grainSize.getNormalisedValue();
      }
      if (xySliders.density) {
        xyPadPos.y = 1.0 - xySliders.density.getNormalisedValue();
      }
    }

    // Push current XY automation state to C++
    function pushXYAutoState() {
      if (setXYAutoStateFn) {
        setXYAutoStateFn(
          xyAuto.enabled ? 1.0 : 0.0,
          xyAuto.mode === 'smooth' ? 1.0 : 0.0,
          xyAuto.speed
        );
      }
    }

    // Pull XY automation state from C++ and apply to JS
    async function pullXYAutoState() {
      if (!getXYAutoStateFn) return;
      var state = await getXYAutoStateFn();
      if (!state) return;

      var shouldEnable = state.enabled > 0.5;
      var shouldSmooth = state.mode > 0.5;
      var newSpeed = state.speed;

      // Stop current automation if running
      if (xyAuto.enabled) stopXYAuto();

      // Apply mode
      xyAuto.mode = shouldSmooth ? 'smooth' : 'chaotic';
      var modeBtn = document.getElementById('xyAutoMode');
      if (modeBtn) {
        modeBtn.innerHTML = shouldSmooth ? '&#x223F;' : '&#x26A1;';
        modeBtn.title = shouldSmooth ? 'Smooth' : 'Chaotic';
      }

      // Apply speed
      xyAuto.speed = newSpeed;
      var speedThumb = document.getElementById('xyAutoSpeedThumb');
      if (speedThumb) speedThumb.style.left = (xyAuto.speed * 100) + '%';

      // Start automation if preset had it enabled
      if (shouldEnable) startXYAuto();

      // Sync XY pad position from parameter values
      syncXYPadFromParams();
    }

    async function navigatePreset(delta) {
      if (!loadPresetFn) return;
      currentPresetIdx = (currentPresetIdx + delta + numPresets) % numPresets;
      await loadPresetFn(currentPresetIdx);
      var name = await getPresetNameFn(currentPresetIdx);
      updatePresetDisplay(name);
      await pullXYAutoState();
      await pullGrainSyncState();
    }

    // ── Preset List (click name to browse) ──
    async function buildPresetList() {
      var listEl = document.getElementById('presetList');
      listEl.innerHTML = '';
      for (var i = 0; i < numPresets; i++) {
        var name = await getPresetNameFn(i);
        var item = document.createElement('div');
        item.className = 'preset-list-item' + (i === currentPresetIdx ? ' active' : '');
        item.textContent = name;
        item.dataset.idx = i;
        item.addEventListener('click', (function(idx) {
          return async function() {
            currentPresetIdx = idx;
            await loadPresetFn(idx);
            updatePresetDisplay(await getPresetNameFn(idx));
            await pullXYAutoState();
            await pullGrainSyncState();
            closePresetList();
          };
        })(i));
        listEl.appendChild(item);
      }
    }

    function togglePresetList() {
      var listEl = document.getElementById('presetList');
      if (listEl.classList.contains('hidden')) {
        closePresetMenu(); // close the ⋮ menu if open
        buildPresetList();
        listEl.classList.remove('hidden');
      } else {
        closePresetList();
      }
    }

    function closePresetList() {
      document.getElementById('presetList').classList.add('hidden');
    }

    function initPresetList() {
      document.getElementById('presetName').addEventListener('click', function(e) {
        e.stopPropagation();
        togglePresetList();
      });
      document.addEventListener('click', function() { closePresetList(); });
      document.getElementById('presetList').addEventListener('click', function(e) { e.stopPropagation(); });
    }

    // ── Preset Menu (Save / Rename / Overwrite / Delete) ──
    var saveNewPresetFn = null;
    var renamePresetFn = null;
    var overwritePresetFn = null;
    var deletePresetFn = null;
    var getFactoryPresetCountFn = null;
    var numFactoryPresets = 10;
    var pmPendingAction = null; // 'save' or 'rename'

    function initPresetMenu() {
      try {
        saveNewPresetFn = window.Juce.getNativeFunction('saveNewPreset');
        renamePresetFn = window.Juce.getNativeFunction('renamePreset');
        overwritePresetFn = window.Juce.getNativeFunction('overwritePreset');
        deletePresetFn = window.Juce.getNativeFunction('deletePreset');
        getFactoryPresetCountFn = window.Juce.getNativeFunction('getFactoryPresetCount');
      } catch (e) {
        console.log('Preview mode: preset menu disabled');
        return;
      }

      // Get factory count for delete protection
      if (getFactoryPresetCountFn) {
        getFactoryPresetCountFn().then(function(n) { numFactoryPresets = n; });
      }

      var dropdown = document.getElementById('presetDropdown');
      var inputRow = document.getElementById('pmInputRow');
      var input = document.getElementById('pmInput');

      // Toggle dropdown
      document.getElementById('presetMenu').addEventListener('click', function(e) {
        e.stopPropagation();
        var isHidden = dropdown.classList.contains('hidden');
        closePresetMenu();
        closePresetList();
        if (isHidden) {
          dropdown.classList.remove('hidden');
          // Gray out delete for factory presets
          var delItem = document.getElementById('pmDelete');
          if (currentPresetIdx < numFactoryPresets) {
            delItem.classList.add('disabled');
          } else {
            delItem.classList.remove('disabled');
          }
        }
      });

      // Close on outside click
      document.addEventListener('click', function() { closePresetMenu(); });
      dropdown.addEventListener('click', function(e) { e.stopPropagation(); });

      // Save
      document.getElementById('pmSave').addEventListener('click', function() {
        pmPendingAction = 'save';
        inputRow.classList.remove('hidden');
        input.value = '';
        input.placeholder = 'Preset name...';
        input.focus();
      });

      // Rename
      document.getElementById('pmRename').addEventListener('click', function() {
        pmPendingAction = 'rename';
        inputRow.classList.remove('hidden');
        input.value = document.getElementById('presetName').textContent;
        input.focus();
        input.select();
      });

      // Overwrite
      document.getElementById('pmOverwrite').addEventListener('click', async function() {
        if (!overwritePresetFn) return;
        pushXYAutoState();
        pushGrainSyncState();
        await overwritePresetFn(currentPresetIdx);
        closePresetMenu();
      });

      // Delete
      document.getElementById('pmDelete').addEventListener('click', async function() {
        if (!deletePresetFn || currentPresetIdx < numFactoryPresets) return;
        await deletePresetFn(currentPresetIdx);
        numPresets = await getNumPresetsFn();
        if (currentPresetIdx >= numPresets) currentPresetIdx = numPresets - 1;
        await loadPresetFn(currentPresetIdx);
        updatePresetDisplay(await getPresetNameFn(currentPresetIdx));
        await pullXYAutoState();
        await pullGrainSyncState();
        closePresetMenu();
      });

      // Input confirm (Enter or click checkmark)
      document.getElementById('pmInputOk').addEventListener('click', function() { confirmPresetInput(); });
      input.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') confirmPresetInput();
        if (e.key === 'Escape') closePresetMenu();
      });
    }

    async function confirmPresetInput() {
      var input = document.getElementById('pmInput');
      var name = input.value.trim();
      if (!name) return;

      // Ensure C++ has latest XY auto state before saving
      pushXYAutoState();
      pushGrainSyncState();

      if (pmPendingAction === 'save' && saveNewPresetFn) {
        var newIdx = await saveNewPresetFn(name);
        numPresets = await getNumPresetsFn();
        currentPresetIdx = newIdx;
        updatePresetDisplay(name);
      } else if (pmPendingAction === 'rename' && renamePresetFn) {
        await renamePresetFn(currentPresetIdx, name);
        updatePresetDisplay(name);
      }

      closePresetMenu();
    }

    function closePresetMenu() {
      document.getElementById('presetDropdown').classList.add('hidden');
      document.getElementById('pmInputRow').classList.add('hidden');
      pmPendingAction = null;
    }

    // ── Grain Particle Visualizer ──
    var grainParticles = [];
    var grainCanvas, grainCtx;

    function initGrainViz() {
      grainCanvas = document.getElementById('grainViz');
      if (!grainCanvas) return;
      var rect = grainCanvas.parentElement.getBoundingClientRect();
      grainCanvas.width = rect.width * 2;
      grainCanvas.height = rect.height * 2;
      grainCtx = grainCanvas.getContext('2d');
    }

    function updateGrainViz(grainCount) {
      if (!grainCtx) return;

      var w = grainCanvas.width;
      var h = grainCanvas.height;

      // Spawn particles proportional to grain count
      var targetParticles = Math.min(grainCount, 60);
      while (grainParticles.length < targetParticles) {
        grainParticles.push({
          x: Math.random() * w,
          y: Math.random() * h,
          vx: (Math.random() - 0.5) * 2,
          vy: (Math.random() - 0.5) * 2,
          size: 4 + Math.random() * 8,
          alpha: 0.3 + Math.random() * 0.5,
          life: 60 + Math.random() * 120
        });
      }

      // Clear
      grainCtx.clearRect(0, 0, w, h);

      // Update and draw
      for (var i = grainParticles.length - 1; i >= 0; i--) {
        var p = grainParticles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        p.alpha *= 0.995;

        if (p.life <= 0 || p.alpha < 0.05 || p.x < 0 || p.x > w || p.y < 0 || p.y > h) {
          grainParticles.splice(i, 1);
          continue;
        }

        grainCtx.beginPath();
        grainCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        grainCtx.fillStyle = 'rgba(139, 92, 246, ' + p.alpha + ')';
        grainCtx.fill();
      }
    }

    // ── Waveform Scope Visualizer ──
    var scopeCanvas, scopeCtx;
    var scopeData = [];

    function initScopeViz() {
      scopeCanvas = document.getElementById('scopeViz');
      if (!scopeCanvas) return;
      var rect = scopeCanvas.parentElement.getBoundingClientRect();
      scopeCanvas.width = rect.width * 2;
      scopeCanvas.height = rect.height * 2;
      scopeCtx = scopeCanvas.getContext('2d');
    }

    var scopeHistory = [];
    var scopeMaxHistory = 8;
    var scopeRotation = 0;
    var scopeAnimFrame = null;

    function updateScopeViz(data) {
      if (!data || data.length === 0) return;
      scopeData = data.slice();

      // Store history for trailing rings
      scopeHistory.unshift(scopeData.slice());
      if (scopeHistory.length > scopeMaxHistory)
        scopeHistory.pop();
    }

    function renderScope() {
      scopeAnimFrame = requestAnimationFrame(renderScope);
      if (!scopeCtx) return;

      var w = scopeCanvas.width;
      var h = scopeCanvas.height;
      var cx = w / 2;
      var cy = h / 2;
      var baseRadius = Math.min(cx, cy) * 0.38;
      var sensitivity = 2.5;

      scopeRotation += 0.008;

      scopeCtx.clearRect(0, 0, w, h);

      // Concentric grid rings (more rings for depth)
      for (var g = 1; g <= 6; g++) {
        scopeCtx.beginPath();
        scopeCtx.arc(cx, cy, baseRadius * g * 0.22, 0, Math.PI * 2);
        scopeCtx.strokeStyle = 'rgba(139, 92, 246, ' + (g % 2 === 0 ? 0.07 : 0.04) + ')';
        scopeCtx.lineWidth = g === 3 ? 1.5 : 0.8;
        scopeCtx.stroke();
      }

      // Rotating cross lines (8 spokes like a compass)
      for (var a = 0; a < 8; a++) {
        var ang = a * Math.PI / 8 + scopeRotation * 0.3;
        var spokeAlpha = a % 2 === 0 ? 0.07 : 0.035;
        var spokeLen = a % 2 === 0 ? 1.4 : 1.1;
        scopeCtx.beginPath();
        scopeCtx.moveTo(cx + baseRadius * spokeLen * Math.cos(ang), cy + baseRadius * spokeLen * Math.sin(ang));
        scopeCtx.lineTo(cx - baseRadius * spokeLen * Math.cos(ang), cy - baseRadius * spokeLen * Math.sin(ang));
        scopeCtx.strokeStyle = 'rgba(139, 92, 246, ' + spokeAlpha + ')';
        scopeCtx.lineWidth = a % 4 === 0 ? 1.2 : 0.6;
        scopeCtx.stroke();
      }

      // Rotating tick marks on outer ring
      for (var t = 0; t < 24; t++) {
        var tickAng = t * Math.PI / 12 + scopeRotation * 0.15;
        var tickInner = baseRadius * 1.25;
        var tickOuter = baseRadius * 1.35;
        scopeCtx.beginPath();
        scopeCtx.moveTo(cx + tickInner * Math.cos(tickAng), cy + tickInner * Math.sin(tickAng));
        scopeCtx.lineTo(cx + tickOuter * Math.cos(tickAng), cy + tickOuter * Math.sin(tickAng));
        scopeCtx.strokeStyle = 'rgba(139, 92, 246, 0.08)';
        scopeCtx.lineWidth = t % 3 === 0 ? 1.5 : 0.6;
        scopeCtx.stroke();
      }

      // Draw history rings (trailing ghost layers with 3D depth)
      for (var h_idx = scopeHistory.length - 1; h_idx >= 0; h_idx--) {
        var ringData = scopeHistory[h_idx];
        var fade = 1 - (h_idx / scopeMaxHistory);
        var ringOffset = h_idx * 0.02;
        var radiusScale = 1 - h_idx * 0.025;

        // 3D perspective offset (slight y-shift for depth)
        var depthY = h_idx * 3;

        // Alpha: main ring bright, ghosts fade out progressively
        var alpha, lineW;
        if (h_idx === 0) { alpha = 0.95; lineW = 2.5; }
        else if (h_idx === 1) { alpha = 0.4; lineW = 1.8; }
        else { alpha = fade * 0.2; lineW = Math.max(0.5, 1.5 - h_idx * 0.15); }

        scopeCtx.beginPath();
        var len = ringData.length;
        for (var i = 0; i <= len; i++) {
          var idx = i % len;
          var angle = (i / len) * Math.PI * 2 + scopeRotation + ringOffset;
          var amp = ringData[idx] * baseRadius * sensitivity;
          var r = baseRadius * radiusScale + amp;
          var x = cx + r * Math.cos(angle);
          var y = cy + depthY + r * Math.sin(angle);
          if (i === 0) scopeCtx.moveTo(x, y);
          else scopeCtx.lineTo(x, y);
        }
        scopeCtx.closePath();

        // Glow layers for main + second ring
        if (h_idx <= 1) {
          scopeCtx.strokeStyle = 'rgba(139, 92, 246, ' + (h_idx === 0 ? 0.15 : 0.06) + ')';
          scopeCtx.lineWidth = h_idx === 0 ? 10 : 5;
          scopeCtx.stroke();
        }

        scopeCtx.strokeStyle = 'rgba(139, 92, 246, ' + alpha + ')';
        scopeCtx.lineWidth = lineW;
        scopeCtx.stroke();
      }

      // Inner fill pulse: faint radial gradient that breathes with audio
      if (scopeHistory.length > 0) {
        var peakAmp = 0;
        var mainRing = scopeHistory[0];
        for (var p = 0; p < mainRing.length; p++)
          peakAmp = Math.max(peakAmp, Math.abs(mainRing[p]));
        var pulseAlpha = Math.min(peakAmp * 0.3, 0.08);
        var grad = scopeCtx.createRadialGradient(cx, cy, 0, cx, cy, baseRadius * 1.2);
        grad.addColorStop(0, 'rgba(139, 92, 246, ' + pulseAlpha + ')');
        grad.addColorStop(1, 'rgba(139, 92, 246, 0)');
        scopeCtx.fillStyle = grad;
        scopeCtx.fillRect(0, 0, w, h);
      }

      // If no data yet, draw idle ring
      if (scopeHistory.length === 0) {
        scopeCtx.beginPath();
        scopeCtx.arc(cx, cy, baseRadius, 0, Math.PI * 2);
        scopeCtx.strokeStyle = 'rgba(139, 92, 246, 0.15)';
        scopeCtx.lineWidth = 1;
        scopeCtx.stroke();
      }
    }

    // ── Scope XY Pad Controller ──
    // Drag on scope to control: X = Grain Size + Spray, Y = Density + Feedback
    var xyPadActive = false;
    var xyPadPos = { x: 0.5, y: 0.5 }; // normalized 0-1
    var xyDefaultPos = { x: 0.5, y: 0.5 };
    var xySliders = {};  // populated on init

    function initXYPad() {
      try {
        xySliders.grainSize = window.Juce.getSliderState('GRAIN_SIZE');
        xySliders.density   = window.Juce.getSliderState('DENSITY');
        xySliders.spray     = window.Juce.getSliderState('SPRAY');
        xySliders.drift     = window.Juce.getSliderState('DRIFT');
      } catch (e) {
        console.log("Preview mode: XY pad disabled");
        return;
      }

      if (!scopeCanvas) return;

      // Read initial positions from current param values
      if (xySliders.grainSize) {
        xyDefaultPos.x = xySliders.grainSize.getNormalisedValue();
        xyPadPos.x = xyDefaultPos.x;
      }
      if (xySliders.density) {
        xyDefaultPos.y = 1.0 - xySliders.density.getNormalisedValue();
        xyPadPos.y = xyDefaultPos.y;
      }

      // Mouse events
      scopeCanvas.addEventListener('mousedown', xyDown);
      document.addEventListener('mousemove', xyMove);
      document.addEventListener('mouseup', xyUp);

      // Double-click to reset to default position
      scopeCanvas.addEventListener('dblclick', xyReset);

      // Touch events
      scopeCanvas.addEventListener('touchstart', function(e) {
        e.preventDefault();
        xyDown(e.touches[0]);
      }, { passive: false });
      document.addEventListener('touchmove', function(e) {
        if (xyPadActive) { e.preventDefault(); xyMove(e.touches[0]); }
      }, { passive: false });
      document.addEventListener('touchend', function() { xyUp(); });
    }

    function xyDown(e) {
      xyPadActive = true;

      // Notify host drag started on all 4 params
      if (xySliders.grainSize) xySliders.grainSize.sliderDragStarted();
      if (xySliders.density)   xySliders.density.sliderDragStarted();
      if (xySliders.spray)     xySliders.spray.sliderDragStarted();
      if (xySliders.drift)  xySliders.drift.sliderDragStarted();

      xyMove(e);
    }

    function xyMove(e) {
      if (!xyPadActive || !scopeCanvas) return;

      var rect = scopeCanvas.getBoundingClientRect();
      var x = (e.clientX - rect.left) / rect.width;
      var y = (e.clientY - rect.top) / rect.height;

      x = Math.max(0, Math.min(1, x));
      y = Math.max(0, Math.min(1, y));

      xyPadPos.x = x;
      xyPadPos.y = y;

      // Map X → Grain Size + Spray
      if (xySliders.grainSize) xySliders.grainSize.setNormalisedValue(x);
      if (xySliders.spray)     xySliders.spray.setNormalisedValue(x);

      // Map Y → Density + Feedback (inverted: top = high)
      var yInv = 1.0 - y;
      if (xySliders.density)  xySliders.density.setNormalisedValue(yInv);
      if (xySliders.drift) xySliders.drift.setNormalisedValue(yInv);
    }

    function xyUp() {
      if (!xyPadActive) return;
      xyPadActive = false;

      if (xySliders.grainSize) xySliders.grainSize.sliderDragEnded();
      if (xySliders.density)   xySliders.density.sliderDragEnded();
      if (xySliders.spray)     xySliders.spray.sliderDragEnded();
      if (xySliders.drift)  xySliders.drift.sliderDragEnded();
    }

    function xyReset() {
      xyPadPos.x = xyDefaultPos.x;
      xyPadPos.y = xyDefaultPos.y;

      if (xySliders.grainSize) { xySliders.grainSize.sliderDragStarted(); xySliders.grainSize.setNormalisedValue(xyDefaultPos.x); xySliders.grainSize.sliderDragEnded(); }
      if (xySliders.spray)     { xySliders.spray.sliderDragStarted(); xySliders.spray.setNormalisedValue(xyDefaultPos.x); xySliders.spray.sliderDragEnded(); }
      var yInv = 1.0 - xyDefaultPos.y;
      if (xySliders.density)   { xySliders.density.sliderDragStarted(); xySliders.density.setNormalisedValue(yInv); xySliders.density.sliderDragEnded(); }
      if (xySliders.drift)  { xySliders.drift.sliderDragStarted(); xySliders.drift.setNormalisedValue(yInv); xySliders.drift.sliderDragEnded(); }
    }

    // ── XY Pad Automation ──
    var xyAuto = {
      enabled: false,
      mode: 'chaotic',   // 'chaotic' or 'smooth'
      speed: 0.5,        // 0-1 normalized
      target: { x: Math.random(), y: Math.random() },
      animFrame: null,
      lastJumpTime: 0
    };

    function xyAutoSetParams(x, y) {
      xyPadPos.x = x;
      xyPadPos.y = y;
      if (xySliders.grainSize) xySliders.grainSize.setNormalisedValue(x);
      if (xySliders.spray)     xySliders.spray.setNormalisedValue(x);
      var yInv = 1.0 - y;
      if (xySliders.density)   xySliders.density.setNormalisedValue(yInv);
      if (xySliders.drift)     xySliders.drift.setNormalisedValue(yInv);
    }

    function xyAutoTick(timestamp) {
      if (!xyAuto.enabled) return;

      // Skip tick if user is manually dragging
      if (!xyPadActive) {
        if (xyAuto.mode === 'chaotic') {
          // Chaotic: teleport at interval. Speed maps: 0→3000ms, 1→100ms (exponential)
          var interval = 3000 * Math.pow(100 / 3000, xyAuto.speed);
          if (timestamp - xyAuto.lastJumpTime >= interval) {
            xyAuto.lastJumpTime = timestamp;
            xyAutoSetParams(Math.random(), Math.random());
          }
        } else {
          // Smooth: lerp toward target. Speed maps: 0→0.004, 1→0.08
          var lerpFactor = 0.004 + xyAuto.speed * 0.076;
          xyPadPos.x += (xyAuto.target.x - xyPadPos.x) * lerpFactor;
          xyPadPos.y += (xyAuto.target.y - xyPadPos.y) * lerpFactor;
          xyAutoSetParams(xyPadPos.x, xyPadPos.y);

          // Pick new target when close enough
          var dx = xyAuto.target.x - xyPadPos.x;
          var dy = xyAuto.target.y - xyPadPos.y;
          if (Math.sqrt(dx * dx + dy * dy) < 0.02) {
            xyAuto.target.x = Math.random();
            xyAuto.target.y = Math.random();
          }
        }
      }

      xyAuto.animFrame = requestAnimationFrame(xyAutoTick);
    }

    function startXYAuto() {
      xyAuto.enabled = true;
      xyAuto.lastJumpTime = performance.now();
      xyAuto.target = { x: Math.random(), y: Math.random() };
      xyAuto.animFrame = requestAnimationFrame(xyAutoTick);
      document.getElementById('xyAutoToggle').innerHTML = '&#x25A0;';
      document.getElementById('xyAutoToggle').classList.add('active');
    }

    function stopXYAuto() {
      xyAuto.enabled = false;
      if (xyAuto.animFrame) {
        cancelAnimationFrame(xyAuto.animFrame);
        xyAuto.animFrame = null;
      }
      document.getElementById('xyAutoToggle').innerHTML = '&#x25B6;';
      document.getElementById('xyAutoToggle').classList.remove('active');
    }

    function toggleXYAuto() {
      if (xyAuto.enabled) stopXYAuto();
      else startXYAuto();
      pushXYAutoState();
    }

    function cycleXYAutoMode() {
      var btn = document.getElementById('xyAutoMode');
      if (xyAuto.mode === 'chaotic') {
        xyAuto.mode = 'smooth';
        btn.innerHTML = '&#x223F;';  // ∿
        btn.title = 'Smooth';
      } else {
        xyAuto.mode = 'chaotic';
        btn.innerHTML = '&#x26A1;';  // ⚡
        btn.title = 'Chaotic';
      }
      // Reset target for smooth mode
      xyAuto.target = { x: Math.random(), y: Math.random() };
      pushXYAutoState();
    }

    function initXYAuto() {
      document.getElementById('xyAutoToggle').addEventListener('click', function(e) {
        e.stopPropagation();
        toggleXYAuto();
      });
      document.getElementById('xyAutoMode').addEventListener('click', function(e) {
        e.stopPropagation();
        cycleXYAutoMode();
      });

      // Speed slider
      var speedTrack = document.getElementById('xyAutoSpeedTrack');
      var speedThumb = document.getElementById('xyAutoSpeedThumb');
      var speedDragging = false;

      function updateSpeedVisual() {
        speedThumb.style.left = (xyAuto.speed * 100) + '%';
      }

      function onSpeedDown(e) {
        e.stopPropagation();
        e.preventDefault();
        speedDragging = true;
        onSpeedMove(e);
      }
      function onSpeedMove(e) {
        if (!speedDragging) return;
        var rect = speedTrack.getBoundingClientRect();
        var clientX = e.clientX || (e.touches && e.touches[0].clientX) || 0;
        var x = (clientX - rect.left) / rect.width;
        xyAuto.speed = Math.max(0, Math.min(1, x));
        updateSpeedVisual();
      }
      function onSpeedUp() {
        if (speedDragging) pushXYAutoState();
        speedDragging = false;
      }

      speedTrack.addEventListener('mousedown', onSpeedDown);
      speedThumb.addEventListener('mousedown', onSpeedDown);
      document.addEventListener('mousemove', onSpeedMove);
      document.addEventListener('mouseup', onSpeedUp);

      speedTrack.addEventListener('touchstart', function(e) { e.stopPropagation(); onSpeedDown(e); }, { passive: false });
      document.addEventListener('touchmove', function(e) { if (speedDragging) onSpeedMove(e); });
      document.addEventListener('touchend', onSpeedUp);

      updateSpeedVisual();
    }

    // Inject XY crosshair drawing into renderScope
    var _origRenderScope = renderScope;
    renderScope = function() {
      _origRenderScope();

      if (!scopeCtx || !scopeCanvas) return;

      var w = scopeCanvas.width;
      var h = scopeCanvas.height;
      var px = xyPadPos.x * w;
      var py = xyPadPos.y * h;
      var alpha = xyPadActive ? 0.85 : 0.5;

      // Crosshair lines (purple, dashed)
      scopeCtx.strokeStyle = 'rgba(139, 92, 246, ' + (alpha * 0.2) + ')';
      scopeCtx.lineWidth = 1;
      scopeCtx.setLineDash([6, 4]);

      scopeCtx.beginPath();
      scopeCtx.moveTo(px, 0); scopeCtx.lineTo(px, h);
      scopeCtx.stroke();
      scopeCtx.beginPath();
      scopeCtx.moveTo(0, py); scopeCtx.lineTo(w, py);
      scopeCtx.stroke();

      scopeCtx.setLineDash([]);

      // Outer glow
      var glowSize = xyPadActive ? 36 : 28;
      var grad = scopeCtx.createRadialGradient(px, py, 0, px, py, glowSize);
      grad.addColorStop(0, 'rgba(139, 92, 246, ' + (alpha * 0.6) + ')');
      grad.addColorStop(0.35, 'rgba(139, 92, 246, ' + (alpha * 0.2) + ')');
      grad.addColorStop(1, 'rgba(139, 92, 246, 0)');
      scopeCtx.fillStyle = grad;
      scopeCtx.fillRect(px - glowSize, py - glowSize, glowSize * 2, glowSize * 2);

      // Main dot (bigger, purple)
      var dotRadius = xyPadActive ? 8 : 6;
      scopeCtx.beginPath();
      scopeCtx.arc(px, py, dotRadius, 0, Math.PI * 2);
      scopeCtx.fillStyle = 'rgba(159, 122, 255, ' + alpha + ')';
      scopeCtx.fill();

      // Inner highlight
      scopeCtx.beginPath();
      scopeCtx.arc(px, py, dotRadius * 0.45, 0, Math.PI * 2);
      scopeCtx.fillStyle = 'rgba(200, 180, 255, ' + (alpha * 0.7) + ')';
      scopeCtx.fill();

      // Axis labels while dragging
      if (xyPadActive) {
        scopeCtx.font = '16px system-ui';
        scopeCtx.fillStyle = 'rgba(159, 122, 255, 0.55)';
        scopeCtx.textAlign = 'left';
        scopeCtx.fillText('SIZE / SPRAY', px + 16, py - 14);
        scopeCtx.textAlign = 'right';
        scopeCtx.fillText('DENS / DRIFT', px - 16, py + 24);
      }
    };

    // ── Global visualization callback (called from C++ timerCallback) ──
    // ── Output Gain Slider Controller ──
    function initGainSlider() {
      var bar = document.getElementById('gainBar');
      var track = bar.querySelector('.gain-track');
      var fill = document.getElementById('gainFill');
      var thumb = document.getElementById('gainThumb');
      var valueEl = document.getElementById('gainValue');
      var gainSlider = null;

      try {
        gainSlider = window.Juce.getSliderState('OUTPUT_GAIN');
      } catch (e) {
        console.log("Preview mode: gain slider disabled");
      }

      var min = parseFloat(bar.dataset.min);   // -12
      var max = parseFloat(bar.dataset.max);    // 12
      var dragging = false;

      function updateVisual(norm) {
        var val = min + norm * (max - min);
        // Fill from center (50%) toward current position
        var center = (0 - min) / (max - min); // 0dB position = 0.5
        var left = Math.min(center, norm);
        var width = Math.abs(norm - center);
        fill.style.left = (left * 100) + '%';
        fill.style.width = (width * 100) + '%';
        thumb.style.left = (norm * 100) + '%';
        valueEl.textContent = (val >= 0 ? '+' : '') + val.toFixed(1) + ' dB';
      }

      // Listen for parameter changes from host/knobs
      if (gainSlider) {
        gainSlider.valueChangedEvent.addListener(function() {
          updateVisual(gainSlider.getNormalisedValue());
        });
        // Set initial visual
        updateVisual(gainSlider.getNormalisedValue());
      } else {
        updateVisual(0.5); // default 0dB
      }

      function onDown(e) {
        dragging = true;
        bar.classList.add('dragging');
        if (gainSlider) gainSlider.sliderDragStarted();
        onMove(e);
      }

      function onMove(e) {
        if (!dragging) return;
        var rect = track.getBoundingClientRect();
        var x = ((e.clientX || e.touches[0].clientX) - rect.left) / rect.width;
        x = Math.max(0, Math.min(1, x));
        if (gainSlider) gainSlider.setNormalisedValue(x);
        updateVisual(x);
      }

      function onUp() {
        if (!dragging) return;
        dragging = false;
        bar.classList.remove('dragging');
        if (gainSlider) gainSlider.sliderDragEnded();
      }

      // Double-click to reset to 0 dB
      track.addEventListener('dblclick', function() {
        var center = (0 - min) / (max - min);
        if (gainSlider) {
          gainSlider.sliderDragStarted();
          gainSlider.setNormalisedValue(center);
          gainSlider.sliderDragEnded();
        }
        updateVisual(center);
      });

      track.addEventListener('mousedown', onDown);
      thumb.addEventListener('mousedown', onDown);
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);

      track.addEventListener('touchstart', function(e) { e.preventDefault(); onDown(e); }, { passive: false });
      document.addEventListener('touchmove', function(e) { if (dragging) onMove(e); });
      document.addEventListener('touchend', onUp);
    }

    window.updateVisualization = function(grainCount, scopeArray, bpm) {
      if (bpm > 0) currentBPM = bpm;
      updateGrainViz(grainCount);
      updateScopeViz(scopeArray);
      if (grainSyncEnabled) updateGrainSyncDisplay();
    };

    // ── Initialize ──
    document.addEventListener("DOMContentLoaded", function() {
      var knobGroups = document.querySelectorAll('.knob-group');

      knobGroups.forEach(function(group) {
        var paramId = group.dataset.param;
        var sliderState = null;

        try {
          sliderState = window.Juce.getSliderState(paramId);
        } catch (e) {
          console.log("Preview mode: no JUCE backend for " + paramId);
        }

        new KnobController(group, sliderState);
      });

      // Preset buttons
      document.getElementById('presetPrev').addEventListener('click', function() {
        navigatePreset(-1);
      });
      document.getElementById('presetNext').addEventListener('click', function() {
        navigatePreset(1);
      });

      // Init grain sync toggle
      var syncBtn = document.getElementById('grainSyncBtn');
      if (syncBtn) {
        syncBtn.addEventListener('click', function() {
          grainSyncEnabled = !grainSyncEnabled;
          if (grainSyncEnabled) syncBtn.classList.add('active');
          else syncBtn.classList.remove('active');
          pushGrainSyncState();
          updateGrainSyncDisplay();
        });
      }

      // Init visualizers
      initGrainViz();
      initScopeViz();
      initXYPad();
      initXYAuto();
      initGainSlider();
      renderScope();

      // Init presets
      initPresets();
      initPresetList();
      initPresetMenu();

      console.log("Terrain WebView UI initialized");
    });
  })();
  </script>
</body>
</html>
